<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MCF Tiempo Bala</title>
<meta name="description" content="MCF Tiempo Bala: shooter en primera persona donde el tiempo solo avanza cuando te mueves.">
<meta name="theme-color" content="#e9f2f5">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#ff3434;--ink:#16181c;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#e9f2f5;font-family:Rubik,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
#vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(40,90,120,.28));opacity:0;transition:opacity .2s}
#flash{position:fixed;inset:0;pointer-events:none;background:#ff2020;opacity:0}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#16181c;box-shadow:0 0 0 2px rgba(255,255,255,.8);pointer-events:none;transition:all .12s}
#cross.grab{width:26px;height:26px;margin:-13px 0 0 -13px;background:none;border:2.5px solid #16181c;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:2px}
.tl b{font:400 clamp(26px,3.4vw,38px) "Russo One",sans-serif;line-height:1;color:#16181c}
.tl span{font-weight:800;font-size:13px;letter-spacing:.14em;color:#5d6873}
.tr{position:absolute;right:max(18px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:10px;pointer-events:auto}
.ib{width:46px;height:46px;border-radius:14px;background:rgba(22,24,28,.82);display:grid;place-items:center}
.ib svg{width:22px;height:22px}
.br{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));text-align:right}
.br b{font:400 clamp(30px,4vw,46px) "Russo One",sans-serif;line-height:1}
.br span{display:block;font-weight:800;font-size:13px;letter-spacing:.14em;color:#5d6873;text-transform:uppercase}
#tbar{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(220px,40vw);height:6px;border-radius:9px;background:rgba(22,24,28,.15);overflow:hidden}
#tbar i{display:block;height:100%;width:3%;background:#16181c;border-radius:9px}
#tlab{position:absolute;left:50%;bottom:calc(max(22px,env(safe-area-inset-bottom)) + 12px);transform:translateX(-50%);font-weight:900;font-size:11px;letter-spacing:.3em;color:#5d6873}
#big{position:fixed;left:0;right:0;top:38%;text-align:center;font:400 clamp(44px,9vw,112px) "Russo One",sans-serif;color:#16181c;letter-spacing:.02em;pointer-events:none;text-shadow:0 4px 0 rgba(255,255,255,.7)}
#big.red{color:var(--red)}
#big small{display:block;font:800 clamp(14px,1.8vw,19px) Rubik,sans-serif;letter-spacing:.2em;color:#5d6873;margin-top:10px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(233,242,245,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5}
.panel{width:min(560px,100%);text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:.24em;font-size:12px;color:#5d6873}
.brand svg{width:16px}
h1{margin:12px 0 6px;font:400 clamp(52px,11vw,104px) "Russo One",sans-serif;line-height:.9;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--red)}
.sub{color:#4b5560;font-size:16px;line-height:1.5;margin:8px 0 24px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:15px 26px;border-radius:16px;background:#fff;border:2px solid #16181c;font-weight:800;font-size:16px;text-decoration:none;color:#16181c;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.pri{background:#16181c;color:#fff}
.keys{margin-top:22px;color:#5d6873;font-size:13px;line-height:1.9}
.keys kbd{font:700 11px Rubik;border:1.5px solid #9aa4ad;border-radius:5px;padding:1px 6px;color:#16181c;background:#fff}
.rec{margin-top:14px;font-weight:800;color:#16181c}
.row{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px;font-size:13px;font-weight:700;color:#4b5560}
.row input{accent-color:#16181c}
/* controles táctiles */
#touch{position:fixed;inset:0;pointer-events:none;display:none}
.touch #touch{display:block}
#joy{position:absolute;left:max(26px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(22,24,28,.12);border:2px solid rgba(22,24,28,.25);pointer-events:auto}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(22,24,28,.55)}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(22,24,28,.78);color:#fff;font-weight:900;font-size:13px;letter-spacing:.05em;display:grid;place-items:center}
#tFire{right:max(28px,env(safe-area-inset-right));bottom:max(110px,calc(env(safe-area-inset-bottom) + 90px));width:86px;height:86px}
#tThrow{right:max(126px,calc(env(safe-area-inset-right) + 110px));bottom:max(40px,env(safe-area-inset-bottom));width:64px;height:64px;font-size:11px}
.touch .br{bottom:auto;top:max(70px,env(safe-area-inset-top))}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vign"></div>
<div id="flash"></div>
<div id="cross"></div>
<div id="hud" hidden>
  <div class="tl"><span id="lvLab">NIVEL 1</span><b id="foes">0</b><span>ENEMIGOS</span></div>
  <div class="tr"><button class="ib" id="bPause" aria-label="Pausa"><svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button></div>
  <div class="br"><b id="ammo">—</b><span id="wname">Sin arma</span></div>
  <div id="tlab">TIEMPO</div><div id="tbar"><i id="tfill"></i></div>
</div>
<div id="big" hidden></div>
<div id="touch"><div id="joy"><i></i></div><button class="tbtn" id="tFire">DISPARA</button><button class="tbtn" id="tThrow">LANZA</button></div>

<div class="ov" id="menu">
  <div class="panel">
    <div class="brand"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z"/></svg>MCF GAMES</div>
    <h1>TIEMPO<br><em>BALA</em></h1>
    <p class="sub">El tiempo solo avanza cuando te mueves.<br>Esquiva las balas, coge sus armas y no dejes a ninguno en pie.</p>
    <div class="btns"><button class="btn pri" id="bPlay">Jugar</button><a class="btn" href="../">← MCF Games</a></div>
    <div class="rec" id="rec"></div>
    <div class="row"><label>Sensibilidad <input type="range" id="sens" min="0.4" max="2.5" step="0.1" value="1"></label></div>
    <div class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> moverse · ratón apuntar · <kbd>clic</kbd> disparar / coger arma / puñetazo · <kbd>clic der.</kbd> o <kbd>R</kbd> lanzar el arma · <kbd>Esc</kbd> pausa</div>
  </div>
</div>
<div class="ov" id="pause" hidden>
  <div class="panel">
    <h1 style="font-size:64px">PAUSA</h1>
    <div class="btns"><button class="btn pri" id="bResume">Seguir</button><button class="btn" id="bRestart">Repetir nivel</button><a class="btn" href="../">Salir</a></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =========================================================
   MCF Tiempo Bala — el tiempo solo avanza cuando te mueves
   ========================================================= */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TOUCH = matchMedia('(pointer:coarse)').matches;
if (TOUCH) document.body.classList.add('touch');
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

/* ---------- three ---------- */
const cv = $('gl');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
R.setPixelRatio(Math.min(2, devicePixelRatio || 1));
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const SKY = new THREE.Color('#e9f2f5');
scene.background = SKY; scene.fog = new THREE.Fog(SKY, 22, 70);
const cam = new THREE.PerspectiveCamera(72, 1, 0.05, 200);
scene.add(cam);
scene.add(new THREE.HemisphereLight('#ffffff', '#b9d4dd', 0.85));
const sun = new THREE.DirectionalLight('#ffffff', 0.55);
sun.position.set(12, 24, 8); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024); Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 80 });
sun.shadow.bias = -0.0008; scene.add(sun); scene.add(sun.target);
function resize() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const M = {
  floor: new THREE.MeshLambertMaterial({ color: '#f4f8f9' }),
  wall: new THREE.MeshLambertMaterial({ color: '#ffffff' }),
  box: new THREE.MeshLambertMaterial({ color: '#dfe9ec' }),
  red: new THREE.MeshLambertMaterial({ color: '#ff3b30', flatShading: true }),
  red2: new THREE.MeshLambertMaterial({ color: '#d81f1f', flatShading: true }),
  gun: new THREE.MeshLambertMaterial({ color: '#1d2126' }),
  gun2: new THREE.MeshLambertMaterial({ color: '#3b4148' }),
  wood: new THREE.MeshLambertMaterial({ color: '#8a5a33' }),
  hand: new THREE.MeshLambertMaterial({ color: '#2a2e33' }),
  ebul: new THREE.MeshBasicMaterial({ color: '#ff2a2a' }),
  pbul: new THREE.MeshBasicMaterial({ color: '#16181c' }),
  trailE: new THREE.MeshBasicMaterial({ color: '#ff3b3b', transparent: true, opacity: 0.45 }),
  trailP: new THREE.MeshBasicMaterial({ color: '#30343a', transparent: true, opacity: 0.35 }),
};
// suelo con cuadrícula suave
(function () {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#f5f9fa'; g.fillRect(0, 0, 256, 256); g.strokeStyle = '#dde9ed'; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.anisotropy = 4; M.floor.map = t;
})();

/* ---------- armas ---------- */
const WEAP = {
  pistol: { name: 'Pistola', ammo: 6, rate: 0.33, spread: 0.004, pellets: 1, auto: false, speed: 70 },
  ak: { name: 'Fusil', ammo: 24, rate: 0.11, spread: 0.018, pellets: 1, auto: true, speed: 80 },
  shotgun: { name: 'Escopeta', ammo: 4, rate: 0.75, spread: 0.07, pellets: 6, auto: false, speed: 60 },
  bat: { name: 'Bate', ammo: Infinity, rate: 0.55, melee: true },
};
function gunMesh(type) {
  const g = new THREE.Group(), B = (w, h, d, m, x, y, z, rx = 0) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); o.position.set(x, y, z); o.rotation.x = rx; o.castShadow = true; g.add(o); return o; };
  if (type === 'pistol') { B(.062, .055, .27, M.gun2, 0, .02, -.06); B(.058, .045, .22, M.gun, 0, -.03, -.04); B(.055, .15, .075, M.gun, 0, -.11, .05, .3); B(.012, .02, .012, M.gun2, 0, .055, -.18); B(.02, .02, .03, M.gun2, 0, .05, .05); }
  else if (type === 'ak') { B(.065, .09, .62, M.gun, 0, 0, -.2); B(.05, .04, .36, M.gun2, 0, .02, -.62); B(.05, .16, .07, M.gun2, 0, -.12, -.12, -.35); B(.05, .12, .06, M.gun2, 0, -.08, .07, .3); B(.06, .09, .22, M.wood, 0, -.02, .22); }
  else if (type === 'shotgun') { B(.07, .08, .8, M.gun, 0, 0, -.28); B(.05, .05, .5, M.gun2, 0, -.06, -.35); B(.06, .12, .3, M.wood, 0, -.05, .22, .2); }
  else if (type === 'bat') { const c = new THREE.Mesh(new THREE.CylinderGeometry(.045, .025, .85, 8), M.wood); c.rotation.x = Math.PI / 2; c.position.z = -.3; c.castShadow = true; g.add(c); }
  return g;
}

/* ---------- mundo ---------- */
let world = new THREE.Group(); scene.add(world);
let boxes = [];                 // {x0,x1,z0,z1,h}
function addBox(x, z, w, d, h, mat = M.box) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; world.add(m);
  boxes.push({ x0: x - w / 2, x1: x + w / 2, z0: z - d / 2, z1: z + d / 2, h });
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- estado ---------- */
const P = { x: 0, z: 0, yaw: 0, pitch: 0, weapon: null, ammo: 0, cd: 0, alive: true, bob: 0, kick: 0, swing: 0 };
let enemies = [], bullets = [], pickups = [], thrown = [], shards = [], effects = [];
let level = LS.get('mcfTB.level', 1), best = LS.get('mcfTB.best', 0);
let state = 'menu', ts = 0.03, pulse = 0, pending = [], spawnPts = [], winT = 0, deadT = 0, gtime = 0;
let sens = LS.get('mcfTB.sens', 1); $('sens').value = sens;
$('sens').oninput = e => { sens = +e.target.value; LS.set('mcfTB.sens', sens); };

/* ---------- enemigos ---------- */
function makeEnemy(x, z, weapon) {
  const g = new THREE.Group();
  const part = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; g.add(o); return o; };
  const torso = part(new THREE.CylinderGeometry(.24, .2, .62, 6), M.red, 0, 1.22, 0);
  part(new THREE.CylinderGeometry(.21, .17, .2, 6), M.red2, 0, .86, 0);
  const head = part(new THREE.IcosahedronGeometry(.17, 0), M.red, 0, 1.72, 0);
  part(new THREE.CylinderGeometry(.07, .08, .1, 6), M.red2, 0, 1.56, 0);
  const legs = [], arms = [];
  for (const s of [-1, 1]) {
    const leg = new THREE.Group(); leg.position.set(s * .11, .82, 0); g.add(leg);
    const l = new THREE.Mesh(new THREE.CylinderGeometry(.09, .065, .8, 5), M.red); l.position.y = -.4; l.castShadow = true; leg.add(l); legs.push(leg);
    const arm = new THREE.Group(); arm.position.set(s * .3, 1.46, 0); g.add(arm);
    const a = new THREE.Mesh(new THREE.CylinderGeometry(.065, .05, .62, 5), M.red); a.position.y = -.3; a.castShadow = true; arm.add(a); arms.push(arm);
  }
  let gun = null;
  if (weapon) { gun = gunMesh(weapon); gun.scale.setScalar(1.3); gun.position.set(0, -.6, -.08); arms[1].add(gun); }
  g.position.set(x, 0, z); world.add(g);
  return { g, head, torso, legs, arms, gun, x, z, yaw: 0, weapon, ammo: weapon ? (weapon === 'bat' ? Infinity : rnd(4, 9) | 0) : 0, cd: rnd(.8, 1.6), walk: rnd(0, 6), alive: true, swing: 0, react: rnd(.35, .7), seen: 0, speed: rnd(1.6, 2.2), strafe: rnd(-1, 1) };
}

/* ---------- nivel ---------- */
function buildLevel(n) {
  scene.remove(world); world.traverse(o => { if (o.geometry) o.geometry.dispose(); }); world = new THREE.Group(); scene.add(world);
  boxes = []; enemies = []; bullets = []; pickups = []; thrown = []; shards = []; effects = []; pending = []; spawnPts = [];
  const r = mulberry(n * 977 + 13);
  const S = Math.min(16 + n * 0.8, 26); // medio lado de la sala
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), M.floor); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; world.add(fl);
  // paredes exteriores con huecos de puerta
  const H = 4.2, T = 0.6;
  const doorsAt = [];
  for (const side of [0, 1, 2, 3]) {
    const dpos = (r() - .5) * S;
    doorsAt.push([side, dpos]);
    const seg = (a, b) => { if (b - a < .1) return; const c = (a + b) / 2, len = b - a; if (side === 0) addBox(c, -S, len, T, H, M.wall); if (side === 1) addBox(c, S, len, T, H, M.wall); if (side === 2) addBox(-S, c, T, len, H, M.wall); if (side === 3) addBox(S, c, T, len, H, M.wall); };
    seg(-S - T / 2, dpos - 1.4); seg(dpos + 1.4, S + T / 2);
    const out = 3.5; // pasillo detrás de la puerta (de ahí salen refuerzos)
    if (side === 0) spawnPts.push([dpos, -S - out]); if (side === 1) spawnPts.push([dpos, S + out]); if (side === 2) spawnPts.push([-S - out, dpos]); if (side === 3) spawnPts.push([S + out, dpos]);
  }
  // coberturas: pilares, cajas y muros bajos
  const nCov = 10 + Math.min(n, 14);
  for (let i = 0; i < nCov; i++) {
    const kind = r();
    const x = (r() * 2 - 1) * (S - 3), z = (r() * 2 - 1) * (S - 3);
    if (Math.hypot(x, z - (S - 4)) < 4) continue; // salida del jugador libre
    if (kind < .3) addBox(x, z, 1.1, 1.1, H, M.wall);
    else if (kind < .7) { const s = .8 + r() * .6; addBox(x, z, s, s, s); if (r() < .4) addBox(x + rnd(-.1, .1), z, s * .7, s * .7, s * 1.7); }
    else { const w = 2.5 + r() * 3; r() < .5 ? addBox(x, z, w, .4, 1.1) : addBox(x, z, .4, w, 1.1); }
  }
  // jugador
  P.x = 0; P.z = S - 3; P.yaw = 0; P.pitch = 0; P.alive = true; P.cd = 0; P.kick = 0;
  const start = n === 1 ? 'pistol' : r() < .7 ? 'pistol' : r() < .5 ? null : 'shotgun';
  setWeapon(start, start ? WEAP[start].ammo : 0);
  if (!start) addPickup('bat', 0, S - 5);
  // armas sueltas
  const kinds = ['pistol', 'ak', 'shotgun', 'bat'];
  for (let i = 0; i < 2 + (n > 4 ? 1 : 0); i++) { const k = kinds[(r() * 4) | 0]; addPickup(k, (r() * 2 - 1) * (S - 4), (r() * 2 - 1) * (S - 6)); }
  // enemigos
  const total = Math.min(3 + Math.floor(n * 1.3), 22);
  const now = Math.min(total, 3 + Math.floor(n / 2));
  const pickW = () => { const v = r(); return n < 3 ? (v < .8 ? 'pistol' : 'bat') : v < .45 ? 'pistol' : v < .65 ? 'ak' : v < .8 ? 'shotgun' : v < .93 ? 'bat' : null; };
  for (let i = 0; i < now; i++) {
    let x, z, k = 0; do { x = (r() * 2 - 1) * (S - 2); z = -S + 2 + r() * S * 1.1; k++; } while (k < 30 && (blocked(x, z, .5) || Math.hypot(x - P.x, z - P.z) < 12));
    enemies.push(makeEnemy(x, z, pickW()));
  }
  for (let i = now; i < total; i++) pending.push(pickW());
  sun.target.position.set(0, 0, 0);
  updHUD();
}
function blocked(x, z, rad) { for (const b of boxes) if (x > b.x0 - rad && x < b.x1 + rad && z > b.z0 - rad && z < b.z1 + rad) return true; return false; }
function addPickup(type, x, z, ammo) {
  const m = gunMesh(type); m.position.set(x, .08, z); m.rotation.set(0, rnd(0, 6), Math.PI / 2 * (type === 'bat' ? 0 : 1)); m.scale.setScalar(1.6); world.add(m);
  pickups.push({ type, m, x, z, ammo: ammo != null ? ammo : WEAP[type].ammo, t: 0 });
}
function setWeapon(type, ammo) {
  P.weapon = type; P.ammo = ammo;
  if (view.gun) view.root.remove(view.gun);
  view.gun = null;
  if (type) { view.gun = gunMesh(type); view.gun.traverse(o => o.castShadow = false); view.root.add(view.gun); view.gun.position.set(0, 0, 0); if (type === 'bat') view.gun.rotation.set(.9, -.3, .4); }
  updHUD();
}

/* ---------- arma en primera persona ---------- */
const view = { root: new THREE.Group(), gun: null, hand: null };
view.root.position.set(.2, -.17, -.42); view.root.scale.setScalar(.75); cam.add(view.root);
view.hand = new THREE.Mesh(new THREE.BoxGeometry(.09, .1, .16), M.hand); view.hand.position.set(0, -.08, .08); view.root.add(view.hand);

/* ---------- balas ---------- */

}

/* ---------- IA ---------- */

/* ---------- objetos lanzados y armas en el suelo ---------- */

    t.vy -= 14 * dt; t.x += t.vx * dt; t.y += t.vy * dt; t.z += t.vz * dt;
    t.m.position.set(t.x, t.y, t.z); t.m.rotation.x += t.spin * dt; t.m.rotation.y += t.spin * .3 * dt;
    for (const e of enemies) if (e.alive && t.y < 1.9 && Math.hypot(e.x - t.x, e.z - t.z) < .55) { if (e.weapon && e.weapon !== 'bat' && Math.random() < .35) disarm(e); else killEnemy(e, new THREE.Vector3(t.vx, 0, t.vz).normalize()); t.done = true; t.vx *= -.2; t.vz *= -.2; }

    let mx = 0, mz = 0;
    if (state === 'play') {
      if (keys.KeyW || keys.ArrowUp) mz -= 1; if (keys.KeyS || keys.ArrowDown) mz += 1; if (keys.KeyA || keys.ArrowLeft) mx -= 1; if (keys.KeyD || keys.ArrowRight) mx += 1;

}
function win() {

}
function nextLevel() { level++; LS.set('mcfTB.level', level); startLevel(); }

$('bResume').onclick = () => { $('pause').hidden = true; state = 'play'; if (!TOUCH) cv.requestPointerLock(); };
$('bRestart').onclick = () => { $('pause').hidden = true; restartLevel(); };
$('bPause').onclick = () => pauseGame();
$('bPlay').onclick = () => { audio(); $('menu').hidden = true; $('hud').hidden = false; startLevel(); if (!TOUCH) cv.requestPointerLock(); };
$('rec').textContent = best ? 'Tu mejor nivel: ' + best + (level > 1 ? ' · continúas en el nivel ' + level : '') : '';

/* ---------- sonido ---------- */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (AC.state === 'suspended') AC.resume(); }
function noise(dur, f, q, vol, type = 'bandpass') { if (!AC) return; const n = AC.createBuffer(1, Math.max(1, AC.sampleRate * dur | 0), AC.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2); const s = AC.createBufferSource(); s.buffer = n; const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = AC.createGain(); g.gain.value = vol; s.connect(fl).connect(g).connect(AC.destination); s.start(); }
function tone(f0, f1, dur, vol, type = 'sine') { if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02); }
function sfx(k, dist = 0) {
  if (!AC) return; const v = 1 / (1 + dist * .08);
  if (k === 'shot') { noise(.18, 1400, .7, .7, 'lowpass'); tone(160, 50, .12, .4, 'square'); }
  else if (k === 'shotgun') { noise(.35, 900, .6, .9, 'lowpass'); tone(110, 40, .2, .5, 'square'); }
  else if (k === 'eshot') { noise(.14, 1100, .7, .45 * v, 'lowpass'); }
  else if (k === 'shatter') { noise(.4, 3200, .8, .55); tone(1800, 600, .25, .12, 'triangle'); }
  else if (k === 'ric') { noise(.06, 2600, 3, .2); }
  else if (k === 'empty') { tone(900, 700, .04, .2, 'square'); }
  else if (k === 'grab') { tone(500, 900, .08, .15, 'triangle'); }
  else if (k === 'swing') { noise(.15, 700, 1.5, .25); }
  else if (k === 'punch') { tone(140, 60, .1, .4); noise(.06, 500, 1, .4); }
  else if (k === 'dead') { tone(300, 60, .9, .3, 'sawtooth'); noise(.6, 400, .5, .5, 'lowpass'); }
  else if (k === 'win') { [392, 523, 659, 784].forEach((f, i) => setTimeout(() => tone(f, f, .25, .16, 'triangle'), i * 90)); }
}

/* ---------- arranque ---------- */
buildLevel(level); state = 'menu';
cam.position.set(0, 1.62, 0);
requestAnimationFrame(frame);
