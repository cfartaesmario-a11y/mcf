<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MCF Tiempo Bala</title>
<meta name="description" content="MCF Tiempo Bala: shooter en primera persona donde el tiempo solo avanza cuando te mueves.">
<meta name="theme-color" content="#dfeef2">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#ff4a3d;--ink:#1b1e24;--mut:#5d6b78;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#dfeef2;font-family:Rubik,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
.disp{font-family:"Lilita One",Rubik,sans-serif;font-weight:400;letter-spacing:.01em}
#vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 50%,rgba(30,80,110,.32));opacity:0}
#flash{position:fixed;inset:0;pointer-events:none;background:#ff2b2b;opacity:0}
#cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none}
#cross i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #1b1e24}
#cross b{position:absolute;inset:0;border-radius:50%;border:2.5px solid transparent}
#cross.grab b{border-color:#fff;box-shadow:0 0 0 1.5px #1b1e24,inset 0 0 0 1.5px #1b1e24}
#cross.reload b{border-color:#fff #fff transparent transparent;box-shadow:none;animation:spin .5s linear infinite;filter:drop-shadow(0 0 1px #1b1e24)}
@keyframes spin{to{transform:rotate(360deg)}}
#hud{position:fixed;inset:0;pointer-events:none}
.tl{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top))}
.tl b{display:block;font-size:clamp(26px,3.2vw,38px);line-height:1;color:#fff;-webkit-text-stroke:1.5px #1b1e24;paint-order:stroke fill;text-shadow:0 3px 0 #1b1e24}
#heads{position:absolute;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:60vw}
#heads i{width:20px;height:22px;background:#ff6a3d;clip-path:polygon(50% 0,92% 22%,100% 62%,72% 100%,28% 100%,0 62%,8% 22%);filter:drop-shadow(0 2px 0 #1b1e24)}
#heads i.off{background:rgba(27,30,36,.18);filter:none}
.tr{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));display:flex;gap:10px;pointer-events:auto}
.ib{width:48px;height:48px;border-radius:14px;background:#fff;box-shadow:0 4px 0 #1b1e24,0 0 0 2px #1b1e24 inset;display:grid;place-items:center}
.ib:active{transform:translateY(2px);box-shadow:0 2px 0 #1b1e24,0 0 0 2px #1b1e24 inset}
.ib svg{width:24px;height:24px}
.bl{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(16px,env(safe-area-inset-bottom));font-weight:700;font-size:12.5px;line-height:1.8;color:#3c4752}
.bl kbd{font:800 11px Rubik;background:#fff;border:1.5px solid #1b1e24;border-bottom-width:3px;border-radius:6px;padding:1px 6px;margin-right:4px}
.br{position:absolute;right:max(22px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));text-align:right}
.br b{font-size:clamp(34px,4.4vw,52px);line-height:1;color:#fff;-webkit-text-stroke:1.5px #1b1e24;paint-order:stroke fill;text-shadow:0 3px 0 #1b1e24}
.br b small{font-size:.5em}
.br span{display:block;font-weight:900;font-size:13px;letter-spacing:.14em;color:#3c4752;text-transform:uppercase;margin-top:4px}
#tbar{position:absolute;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(240px,40vw);height:8px;border-radius:9px;background:rgba(27,30,36,.18);overflow:hidden}
#tbar i{display:block;height:100%;width:3%;background:#1b1e24;border-radius:9px}
#big{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:clamp(48px,9vw,118px);line-height:1;color:#fff;-webkit-text-stroke:3px #1b1e24;paint-order:stroke fill;text-shadow:0 6px 0 #1b1e24;pointer-events:none}
#big.red{color:var(--red)}
#big small{display:block;font:900 clamp(14px,1.7vw,19px) Rubik,sans-serif;-webkit-text-stroke:0;text-shadow:none;letter-spacing:.18em;color:#3c4752;margin-top:16px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(223,238,242,.7);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:5}
.panel{width:min(600px,100%);text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;letter-spacing:.24em;font-size:12px;color:#3c4752}
.brand svg{width:16px}
h1{margin:14px 0 4px;font-size:clamp(60px,12vw,124px);line-height:.88;color:#fff;-webkit-text-stroke:3px #1b1e24;paint-order:stroke fill;text-shadow:0 7px 0 #1b1e24}
h1 em{font-style:normal;color:#ff6a3d}
.sub{color:#3c4752;font-weight:600;font-size:16px;line-height:1.5;margin:18px 0 24px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:15px 28px;border-radius:16px;background:#fff;box-shadow:0 5px 0 #1b1e24,0 0 0 2.5px #1b1e24 inset;font-weight:900;font-size:17px;text-decoration:none;color:#1b1e24;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1b1e24,0 0 0 2.5px #1b1e24 inset}
.btn.pri{background:#ff6a3d;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.rec{margin-top:18px;font-weight:800;color:#1b1e24}
.set{background:#fff;border-radius:22px;box-shadow:0 6px 0 #1b1e24,0 0 0 2.5px #1b1e24 inset;padding:22px 24px;width:min(380px,100%);text-align:left}
.set h2{margin:0 0 14px;font-size:34px;text-align:center}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-weight:800;border-bottom:2px dashed #dfe6ea}
.srow:last-of-type{border:0}
.tg{width:58px;height:32px;border-radius:99px;background:#cfd8de;position:relative;box-shadow:inset 0 0 0 2px #1b1e24}
.tg::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #1b1e24;transition:left .15s}
.tg.on{background:#ff6a3d}.tg.on::after{left:30px}
.srow input[type=range]{accent-color:#ff6a3d;width:150px}
/* táctil */
#touch{position:fixed;inset:0;pointer-events:none;display:none}
.touch #touch{display:block}.touch .bl{display:none}
#joy{position:absolute;left:max(26px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 2.5px rgba(27,30,36,.5);pointer-events:auto}
#joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#fff;box-shadow:0 4px 0 #1b1e24,inset 0 0 0 2.5px #1b1e24}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;background:#fff;box-shadow:0 5px 0 #1b1e24,inset 0 0 0 2.5px #1b1e24;font-weight:900;font-size:12px;display:grid;place-items:center}
#tFire{right:max(28px,env(safe-area-inset-right));bottom:max(120px,calc(env(safe-area-inset-bottom) + 100px));width:90px;height:90px;background:#ff6a3d;color:#fff}
#tThrow{right:max(130px,calc(env(safe-area-inset-right) + 112px));bottom:max(44px,env(safe-area-inset-bottom));width:66px;height:66px}
.touch .br{bottom:auto;top:max(76px,env(safe-area-inset-top))}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="vign"></div>
<div id="flash"></div>
<div id="cross"><i></i><b></b></div>
<div id="hud" hidden>
  <div class="tl"><b class="disp" id="lvLab">NIVEL 1</b></div>
  <div id="heads"></div>
  <div class="tr"><button class="ib" id="bSet" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="#1b1e24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
  <div class="bl"><div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> moverse</div><div><kbd>Clic</kbd> coger / disparar</div><div><kbd>Clic dcho</kbd> lanzar</div></div>
  <div class="br"><b class="disp" id="ammo">—</b><span id="wname">Sin arma</span></div>
  <div id="tbar"><i id="tfill"></i></div>
</div>
<div id="big" class="disp" hidden></div>
<div id="touch"><div id="joy"><i></i></div><button class="tbtn" id="tFire">DISPARA</button><button class="tbtn" id="tThrow">LANZA</button></div>

<div class="ov" id="menu">
  <div class="panel">
    <div class="brand"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 15.5v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V8.5l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z"/></svg>MCF GAMES</div>
    <h1 class="disp">TIEMPO<br><em>BALA</em></h1>
    <p class="sub">El tiempo solo avanza cuando te mueves.<br>Un disparo y estás fuera: piensa cada paso.</p>
    <div class="btns"><button class="btn pri disp" id="bPlay" style="font-size:22px;padding:14px 40px">JUGAR</button><button class="btn" id="bSet2">Ajustes</button><a class="btn" href="../">← MCF Games</a></div>
    <div class="rec" id="rec"></div>
  </div>
</div>
<div class="ov" id="settings" hidden>
  <div class="set">
    <h2 class="disp">AJUSTES</h2>
    <div class="srow">Efectos de sonido <button class="tg" id="tgSfx" aria-label="Efectos"></button></div>
    <div class="srow">Música <button class="tg" id="tgMus" aria-label="Música"></button></div>
    <div class="srow">Sensibilidad <input type="range" id="sens" min="0.3" max="2.5" step="0.05"></div>
    <div class="srow">Empezar desde el nivel 1 <button class="btn" id="bReset" style="padding:8px 14px;font-size:14px">Reiniciar</button></div>
    <div class="btns" style="margin-top:16px"><button class="btn pri" id="bSetOk">Seguir</button><a class="btn" href="../">Salir</a></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =========================================================
   MCF Tiempo Bala — el tiempo solo avanza cuando te mueves
   ========================================================= */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const TOUCH = matchMedia('(pointer:coarse)').matches;
if (TOUCH) document.body.classList.add('touch');
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const CFG = Object.assign({ sfx: true, mus: true, sens: 1 }, LS.get('mcfTB.cfg', {}));
const saveCfg = () => LS.set('mcfTB.cfg', CFG);

/* ---------- three ---------- */
const cv = $('gl');
const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' });
R.setPixelRatio(Math.min(1.75, devicePixelRatio || 1));
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const SKY = new THREE.Color('#dcecf1');
scene.background = SKY; scene.fog = new THREE.Fog(SKY, 26, 75);
const cam = new THREE.PerspectiveCamera(74, 1, 0.04, 200);
scene.add(cam);
const hemi = new THREE.HemisphereLight('#ffffff', '#b4cdd6', 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff6ec', 0.75);
sun.castShadow = true; sun.shadow.mapSize.set(1536, 1536);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 70 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02; scene.add(sun); scene.add(sun.target);
function resize() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

/* ---------- materiales: estilo low-poly con sombreado por facetas ---------- */
function toonRamp(n) { const d = new Uint8Array(n * 4); for (let i = 0; i < n; i++) { const v = Math.round(60 + 195 * i / (n - 1)); d.set([v, v, v, 255], i * 4); } const t = new THREE.DataTexture(d, n, 1, THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; }
const RAMP = toonRamp(4);
const toon = (c, o = {}) => new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: RAMP, flatShading: true }, o));
const lam = (c, o = {}) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o));
const M = {
  floor: lam('#eef5f7'), wall: lam('#f7fbfc'), wallDark: lam('#d8e7ec'), trim: lam('#c3d6dd'), ceil: lam('#f4f9fa'),
  lightPanel: new THREE.MeshBasicMaterial({ color: '#ffffff' }),
  crate: toon('#e8d4b3'), crateDark: toon('#c9ab7e'), desk: toon('#f1f4f5'), deskLeg: toon('#9fb1ba'), shelf: toon('#b9cbd2'),
  enemy: toon('#ff6c3a', { emissive: '#4a0a00' }), enemy2: toon('#ff9a5c', { emissive: '#3a0a00' }), enemyDark: toon('#e8352a', { emissive: '#3a0000' }),
  gun: toon('#101215'), gun2: toon('#23272d'), wood: toon('#9a6234'), metal: toon('#c8d6dc'), glove: toon('#1a1d22'),
  gas: toon('#ff7fbf', { emissive: '#3a0020' }), gasCap: toon('#ffd1e8'), ball: toon('#6d7a84'),
  car: toon('#f6f7f8'), carDark: toon('#25292f'), glass: lam('#3a4a57'), tire: toon('#1d2024'), light: new THREE.MeshBasicMaterial({ color: '#fff6c9' }),
  ebul: new THREE.MeshBasicMaterial({ color: '#ff2b2b' }), pbul: new THREE.MeshBasicMaterial({ color: '#ffd23a' }),
  trailE: new THREE.MeshBasicMaterial({ color: '#ff3b3b', transparent: true, opacity: .55, depthWrite: false }),
  trailP: new THREE.MeshBasicMaterial({ color: '#ffb100', transparent: true, opacity: .45, depthWrite: false }),
  boom: new THREE.MeshBasicMaterial({ color: '#ffb347', transparent: true, opacity: .9, depthWrite: false }),
};
(function () { // baldosas del suelo
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#eef5f7'; g.fillRect(0, 0, 256, 256); g.fillStyle = '#e5eff2'; g.fillRect(0, 0, 128, 128); g.fillRect(128, 128, 128, 128);
  g.strokeStyle = '#d3e2e7'; g.lineWidth = 2; g.strokeRect(0, 0, 256, 256); g.beginPath(); g.moveTo(128, 0); g.lineTo(128, 256); g.moveTo(0, 128); g.lineTo(256, 128); g.stroke();
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(40, 40); t.anisotropy = 4; M.floor.map = t;
})();

/* ---------- geometrías con facetas ---------- */
const GEO = { dodec: new THREE.DodecahedronGeometry(1, 0), ico: new THREE.IcosahedronGeometry(1, 0), oct: new THREE.OctahedronGeometry(1, 0), box: new THREE.BoxGeometry(1, 1, 1), cyl6: new THREE.CylinderGeometry(1, 1, 1, 6), cyl10: new THREE.CylinderGeometry(1, 1, 1, 10), tetra: new THREE.TetrahedronGeometry(1, 0) };
function mesh(geo, mat, sx, sy, sz, x = 0, y = 0, z = 0, parent) { const m = new THREE.Mesh(geo, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; if (parent) parent.add(m); return m; }
const grp = (parent, x = 0, y = 0, z = 0) => { const g = new THREE.Group(); g.position.set(x, y, z); if (parent) parent.add(g); return g; };

/* ---------- armas ---------- */
const WEAP = {
  pistol: { name: 'Pistola', mag: 8, res: 16, rate: .3, reload: .9, spread: .006, pellets: 1, auto: false, speed: 75 },
  ak: { name: 'Fusil', mag: 30, res: 30, rate: .1, reload: 1.4, spread: .02, pellets: 1, auto: true, speed: 85 },
  shotgun: { name: 'Escopeta', mag: 4, res: 8, rate: .7, reload: 1.6, spread: .075, pellets: 7, auto: false, speed: 65 },
  axe: { name: 'Hacha', melee: true, rate: .6 },
  ball: { name: 'Bola de hierro', throwOnly: true },
};
function gunModel(type) {
  const g = new THREE.Group(), B = (w, h, d, m, x, y, z, rx = 0) => { const o = mesh(GEO.box, m, w, h, d, x, y, z, g); o.rotation.x = rx; return o; };
  if (type === 'pistol') { B(.055, .05, .25, M.gun2, 0, .02, -.07); B(.05, .04, .2, M.gun, 0, -.022, -.05); B(.05, .15, .07, M.gun, 0, -.1, .035, .3); B(.012, .022, .012, M.gun2, 0, .052, -.18); B(.03, .035, .03, M.gun, 0, -.06, -.03); }
  else if (type === 'ak') { B(.06, .085, .5, M.gun, 0, 0, -.17); B(.035, .035, .34, M.gun2, 0, .015, -.58); B(.05, .07, .22, M.wood, 0, -.01, -.42); B(.045, .17, .07, M.gun2, 0, -.13, -.1, -.4); B(.045, .12, .06, M.gun, 0, -.08, .07, .35); B(.055, .1, .26, M.wood, 0, -.03, .22); }
  else if (type === 'shotgun') { B(.065, .075, .78, M.gun, 0, 0, -.3); B(.045, .045, .46, M.wood, 0, -.06, -.36); B(.055, .13, .3, M.wood, 0, -.06, .22, .18); }
  else if (type === 'axe') { mesh(GEO.cyl6, M.wood, .025, .75, .025, 0, 0, -.3, g).rotation.x = Math.PI / 2; const h = mesh(GEO.box, M.metal, .025, .2, .16, 0, .07, -.62, g); h.rotation.x = .1; }
  else if (type === 'ball') { mesh(GEO.ico, M.ball, .14, .14, .14, 0, 0, -.1, g); }
  return g;
}

/* ---------- jugador y estado ---------- */
const P = { x: 0, z: 0, yaw: 0, pitch: 0, weapon: null, mag: 0, res: 0, cd: 0, reload: 0, alive: true, bob: 0, kick: 0, swing: 0, lookV: 0 };
let world = new THREE.Group(); scene.add(world);
let boxes = [], enemies = [], bullets = [], pickups = [], thrown = [], shards = [], effects = [], gases = [], pending = [], doors = [];
let level = LS.get('mcfTB.level', 1), best = LS.get('mcfTB.best', 0);
let state = 'menu', ts = .02, pulse = 0, winT = 0, deadT = 0, shake = 0, totalFoes = 0, roomHalf = [12, 15];

/* ---------- enemigos: cuerpo de cristal con articulaciones ---------- */
function makeEnemy(x, z, kind) {
  const root = grp(world, x, 0, z);
  const hip = grp(root, 0, .96, 0);
  mesh(GEO.dodec, M.enemyDark, .17, .11, .13, 0, 0, 0, hip);
  const spine = grp(hip, 0, .06, 0);
  mesh(GEO.dodec, M.enemy, .15, .12, .11, 0, .09, 0, spine);
  mesh(GEO.dodec, M.enemy2, .22, .2, .15, 0, .33, 0, spine);
  const neck = grp(spine, 0, .55, 0);
  const head = mesh(GEO.ico, M.enemy2, .14, .165, .15, 0, .14, 0, neck);
  const sh = [], el = [], hip2 = [], kn = [];
  for (const s of [-1, 1]) {
    const S = grp(spine, s * .25, .47, 0); sh.push(S);
    mesh(GEO.dodec, M.enemy, .065, .16, .065, 0, -.14, 0, S);
    const E = grp(S, 0, -.29, 0); el.push(E);
    mesh(GEO.dodec, M.enemy2, .055, .15, .055, 0, -.14, 0, E);

/* ---------- bucle ---------- */
let last = performance.now();

    const mag = Math.min(1, ml);
    if (mag > 0 && P.alive) { const sp = 4.4 * rdt, s = Math.sin(P.yaw), c = Math.cos(P.yaw); moveCircle(P, P.x + (mx * c + mz * s) * sp, P.z + (-mx * s + mz * c) * sp, .38); P.bob += rdt * 9 * mag; }

    const look = Math.min(1, P.lookV / Math.max(rdt, 1e-3) * .02); P.lookV = 0;

    stepEnemies(dt); stepBullets(dt); stepThrown(dt); stepShards(dt);
    for (const f of effects) { f.life -= f.real ? rdt : dt; if (f.grow) { const k = 1 - f.life / f.max; f.m.scale.setScalar(.3 + f.grow * k); f.m.material.opacity = .9 * (1 - k); } }

    const sh = shake * (Math.random() - .5);
    cam.position.set(P.x + sh, (P.alive ? 1.62 + Math.sin(P.bob) * .03 : Math.max(.35, 1.62 - deadT * 3)), P.z + sh);
    cam.rotation.set(0, 0, 0); cam.rotateY(P.yaw); cam.rotateX(P.pitch); if (!P.alive) cam.rotateZ(Math.min(.6, deadT * 1.5));
    P.kick = Math.max(0, P.kick - rdt * 9); P.swing = Math.max(0, P.swing - rdt * 4);
    const rl = P.reload > 0 ? Math.sin(Math.min(1, 1 - P.reload / (WEAP[P.weapon].reload || 1)) * Math.PI) : 0;
    view.root.position.set(.19 + Math.sin(P.bob * .5) * .01, -.16 + Math.abs(Math.cos(P.bob * .5)) * .008 - rl * .08 + P.kick * .015, -.38 + P.kick * .06);
    view.root.rotation.set(P.kick * .22 + rl * .5 + (P.weapon === 'axe' ? -P.swing * 1.7 : 0), P.weapon === 'axe' ? P.swing * 1.1 : 0, rl * .5);

    fist.visible = P.swing > 0 && !P.weapon && P.alive; fist.position.set(-.12 + P.swing * .1, -.14, -.25 - Math.sin(P.swing * Math.PI) * .32);

}
function win() { state = 'win'; winT = 0; sfx('win'); best = Math.max(best, level); LS.set('mcfTB.best', best); showBig('¡NIVEL SUPERADO!', 'Nivel ' + level); }
function nextLevel() { level++; LS.set('mcfTB.level', level); startLevel(); }
function startLevel() { buildLevel(level); state = 'play'; ts = .015; showBig('NIVEL ' + level, TOUCH ? 'Mueve el joystick y el tiempo avanza' : 'El tiempo solo avanza cuando te mueves'); clearTimeout(startLevel.t); startLevel.t = setTimeout(() => { if (state === 'play') $('big').hidden = true; }, 1500); }

function openSettings() { if (state === 'play') state = 'paused'; $('settings').hidden = false; drawToggles(); if (document.pointerLockElement) document.exitPointerLock(); }
function closeSettings() { $('settings').hidden = true; if (state === 'paused') { state = 'play'; if (!TOUCH) cv.requestPointerLock(); } }
function drawToggles() { $('tgSfx').classList.toggle('on', CFG.sfx); $('tgMus').classList.toggle('on', CFG.mus); $('sens').value = CFG.sens; }
$('tgSfx').onclick = () => { CFG.sfx = !CFG.sfx; saveCfg(); drawToggles(); };
$('tgMus').onclick = () => { CFG.mus = !CFG.mus; saveCfg(); drawToggles(); };
$('sens').oninput = e => { CFG.sens = +e.target.value; saveCfg(); };
$('bReset').onclick = () => { level = 1; LS.set('mcfTB.level', 1); $('bReset').textContent = 'Hecho'; if (state === 'paused') { startLevel(); state = 'paused'; } recTxt(); };
$('bSetOk').onclick = closeSettings;
$('bSet').onclick = openSettings; $('bSet2').onclick = openSettings;
$('bPlay').onclick = () => { audio(); $('menu').hidden = true; $('hud').hidden = false; startLevel(); if (!TOUCH) cv.requestPointerLock(); };
function recTxt() { $('rec').textContent = level > 1 ? 'Continúas en el nivel ' + level + (best ? ' · mejor nivel: ' + best : '') : ''; }
recTxt();

/* ---------- sonido ---------- */
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (AC.state === 'suspended') AC.resume(); }
function noise(dur, f, q, vol, type = 'bandpass') { if (!AC) return; const n = AC.createBuffer(1, Math.max(1, AC.sampleRate * dur | 0), AC.sampleRate), d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2); const s = AC.createBufferSource(); s.buffer = n; const fl = AC.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q; const g = AC.createGain(); g.gain.value = vol; s.connect(fl).connect(g).connect(AC.destination); s.start(); }
function tone(f0, f1, dur, vol, type = 'sine') { if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02); }
function sfx(k, dist = 0) {
  if (!AC || !CFG.sfx) return; const v = 1 / (1 + dist * .07), sl = .55 + .45 * ts;
  if (k === 'shot') { noise(.2, 1500 * sl, .7, .7, 'lowpass'); tone(170 * sl, 50, .12, .4, 'square'); }
  else if (k === 'ak') { noise(.14, 1800 * sl, .7, .6, 'lowpass'); tone(150 * sl, 50, .08, .3, 'square'); }
  else if (k === 'shotgun') { noise(.4, 900 * sl, .6, .95, 'lowpass'); tone(110 * sl, 40, .22, .5, 'square'); }
  else if (k === 'eshot') { noise(.16, 1100 * sl, .7, .5 * v, 'lowpass'); }
  else if (k === 'shatter') { noise(.45, 3400 * sl, .8, .55); tone(2000 * sl, 600, .3, .1, 'triangle'); }
  else if (k === 'break') { noise(.25, 2600 * sl, .8, .4); }
  else if (k === 'boom') { noise(1, 220 * sl, .7, 1, 'lowpass'); tone(90 * sl, 30, .7, .6); }
  else if (k === 'ric') { noise(.06, 2600 * sl, 3, .18); }
  else if (k === 'empty') { tone(900, 700, .04, .2, 'square'); }
  else if (k === 'reload') { tone(600, 400, .05, .15, 'square'); setTimeout(() => CFG.sfx && tone(800, 900, .05, .15, 'square'), 160); }

  else if (k === 'punch') { tone(140, 60, .1, .4); noise(.06, 500, 1, .4); }
  else if (k === 'dead') { tone(320, 60, .9, .3, 'sawtooth'); noise(.6, 400, .5, .5, 'lowpass'); }
  else if (k === 'win') { [392, 523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f, .22, .14, 'triangle'), i * 85)); }
}

/* ---------- arranque ---------- */
buildLevel(level); state = 'menu';
requestAnimationFrame(frame);
