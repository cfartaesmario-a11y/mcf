<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MCF Frontline</title>
<meta name="theme-color" content="#0d110c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Cpath d=%27M20 2 37 11v18L20 38 3 29V11z%27 fill=%27%231d2418%27 stroke=%27%23c9a54a%27 stroke-width=%272%27/%3E%3Cpath d=%27M20 9l3.2 6.6 7.3 1-5.3 5.1 1.3 7.2L20 25.5l-6.5 3.4 1.3-7.2-5.3-5.1 7.3-1z%27 fill=%27%23c9a54a%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#0d110c;--pn:rgba(18,23,16,.92);--ln:rgba(201,165,74,.22);--gold:#c9a54a;--tx:#e9e4d2;--mu:#9a9a86;--ok:#5fbf6a;--bad:#e05a4a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.hide{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h2,h3,.logo b,.logo span,.sec,.clock b,.stamp{font-family:Oswald,Inter,sans-serif;letter-spacing:.04em}
#map{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:grab;display:block}
.top{position:fixed;left:0;right:0;top:0;height:58px;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(#0d110cf2,#0d110cc0 70%,transparent);z-index:5;pointer-events:none}
.top>*{pointer-events:auto}.top .sp{flex:1;pointer-events:none}
.logo{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--tx)}
.logo svg{width:32px;height:32px}.logo b{color:var(--gold);font-size:18px;font-weight:700}.logo span{font-size:18px;font-weight:500;letter-spacing:.14em}
.logo.big{flex-direction:column;gap:4px;margin-bottom:16px}.logo.big svg{width:64px;height:64px}.logo.big b{font-size:14px;letter-spacing:.3em}.logo.big span{font-size:30px;letter-spacing:.2em}
.res{display:flex;gap:6px}
.res span{display:flex;align-items:baseline;gap:5px;padding:6px 10px;background:var(--pn);border:1px solid var(--ln);border-radius:6px;font-size:13px;white-space:nowrap}
.res small{color:var(--ok);font-size:11px}
.clock{display:flex;flex-direction:column;align-items:flex-end;padding:4px 12px;background:var(--pn);border:1px solid var(--ln);border-radius:6px}
.clock b{font-size:18px;line-height:1.1}.clock small{font-size:11px;color:var(--mu)}.clock.night{border-color:#5562c8;box-shadow:0 0 18px #3946b055}.clock.night b{color:#aab4ff}
.ib{width:40px;height:40px;border-radius:6px;background:var(--pn);border:1px solid var(--ln);color:var(--gold);font-size:18px}
.ib:hover{border-color:var(--gold)}
#side{position:fixed;right:14px;top:70px;width:320px;max-height:calc(100vh - 90px);overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px;z-index:4;backdrop-filter:blur(8px);box-shadow:0 10px 40px #0008;animation:sl .18s ease-out}
@keyframes sl{from{transform:translateX(16px);opacity:0}}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.ph small{color:var(--gold);text-transform:uppercase;font-size:11px;letter-spacing:.12em;font-weight:600}
.ph h3{font-size:24px;font-weight:600;line-height:1.1;text-transform:uppercase}
.x{width:30px;height:30px;border-radius:6px;color:var(--mu)}.x:hover{background:#ffffff12;color:var(--tx)}
.own{display:flex;align-items:center;gap:8px;padding:9px 10px;background:#0006;border-radius:7px;margin-bottom:12px}
.own i{width:14px;height:14px;border-radius:3px;border:1px solid #fff6}.own i.neu{background:repeating-linear-gradient(45deg,#777 0 3px,#444 3px 6px)}
.own em{color:var(--mu);font-style:normal}.tag{margin-left:auto;font-size:10px;padding:2px 6px;border-radius:4px;background:var(--gold);color:#1a1405;letter-spacing:.1em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3>div{background:#0005;border-radius:7px;padding:8px}.grid3 small{display:block;color:var(--mu);font-size:10.5px}.grid3 b{font-size:14px}
.sec{margin:14px 0 7px;font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold)}
.res3{display:flex;gap:6px}.res3 .r{flex:1;text-align:center;padding:7px;background:#0005;border-radius:7px;font-weight:600}
.nb{display:flex;flex-wrap:wrap;gap:5px}.nb button{padding:4px 9px;border-radius:5px;background:#ffffff0d;border:1px solid #ffffff14;font-size:12px}.nb button:hover{border-color:var(--gold)}.nb button.sea{color:#8fc0e6}
.mu{color:var(--mu)}.sm{font-size:12px;margin-top:10px}.soon{border-top:1px dashed #ffffff1c;padding-top:10px}
.fl{display:block;font-size:12px;color:var(--mu);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.08em}
.fl input,input{display:block;width:100%;margin-top:6px;padding:10px 12px;background:#0007;border:1px solid #ffffff22;border-radius:7px;color:var(--tx);font:inherit;font-size:15px;outline:none}
input:focus{border-color:var(--gold)}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.cols button{aspect-ratio:1;border-radius:7px;border:2px solid transparent;box-shadow:inset 0 0 0 1px #0006}
.cols button.on{border-color:#fff;transform:scale(1.08)}.cols button:disabled{opacity:.18;cursor:not-allowed}
.pick{padding:10px 12px;border-radius:7px;background:#0006;border:1px dashed #ffffff30;display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.pick.ok{border:1px solid var(--ok)}.pick b{font-family:Oswald;font-size:17px;text-transform:uppercase}.pick span{color:var(--mu);font-size:12.5px}.pick em{color:var(--bad);font-style:normal;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:7px;background:#ffffff12;border:1px solid #ffffff22;font-weight:600;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:var(--gold)}.btn.pri{background:linear-gradient(#d9b75a,#a8862f);color:#1a1405;border:0;text-transform:uppercase;letter-spacing:.08em;font-family:Oswald;font-size:15px}
.btn.pri:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}.btn.bad{background:#7a2219;border-color:#b0392b}.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
#legend{position:fixed;left:14px;top:70px;width:200px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:10px;z-index:3;max-height:40vh;overflow:auto}
#legend .lt{font-family:Oswald;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
#legend button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 6px;border-radius:5px;font-size:13px;text-align:left}#legend button:hover{background:#ffffff0d}
#legend i{width:11px;height:11px;border-radius:2px;flex:none}#legend b{margin-left:auto;color:var(--mu);font-weight:500}
#mini{position:fixed;left:14px;bottom:14px;width:240px;height:150px;border:1px solid var(--ln);border-radius:8px;z-index:3;cursor:crosshair;box-shadow:0 6px 20px #0008}
#tip{position:fixed;left:0;top:0;pointer-events:none;z-index:9;background:#0d110cee;border:1px solid var(--ln);border-radius:6px;padding:6px 9px;display:flex;flex-direction:column}
#tip b{font-family:Oswald;text-transform:uppercase;letter-spacing:.05em}#tip span{font-size:12px;color:var(--mu)}#tip i{font-style:normal}
.banner{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:4;padding:9px 18px;border-radius:30px;background:#1a1405e6;border:1px solid var(--gold);color:#ffe9a8;font-family:Oswald;letter-spacing:.1em;text-transform:uppercase;font-size:14px;display:none;animation:pu 1.6s ease-in-out infinite}
.deploying .banner{display:block}
@keyframes pu{50%{box-shadow:0 0 22px #c9a54a66}}
.gate{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:radial-gradient(ellipse at center,#1c2416,#080a07);padding:20px}
.gbox{max-width:420px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.gbox h2{font-size:30px;text-transform:uppercase}.gbox p{color:var(--mu)}
.stamp{border:3px solid var(--bad);color:var(--bad);padding:4px 14px;font-size:22px;letter-spacing:.3em;transform:rotate(-6deg);opacity:.85}
.spin{width:40px;height:40px;border-radius:50%;border:3px solid #ffffff22;border-top-color:var(--gold);animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(1turn)}}
#modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:15;padding:16px}
.mbox{width:min(440px,100%);background:#141a11;border:1px solid var(--ln);border-radius:12px;padding:18px}.mbox .btn{margin-top:8px}
.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:10px 16px;border-radius:8px;background:#1b2216;border:1px solid var(--ln);box-shadow:0 8px 30px #000a;transition:.4s}.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}.toast.out{opacity:0;transform:translateY(10px)}
@media(max-width:760px){
 .top{height:auto;flex-wrap:wrap;padding:8px 10px;gap:8px}.logo span{display:none}
 .res{order:5;width:100%;overflow-x:auto}.res span{padding:4px 8px;font-size:12px}
 #legend{display:none}#mini{width:120px;height:75px;left:10px;bottom:10px}
 #side{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:55vh}
 .banner{top:auto;bottom:96px;font-size:12px;white-space:nowrap}
}
@media(max-width:760px){#side{padding:12px;max-height:46vh}.ph h3{font-size:19px}.cols{grid-template-columns:repeat(12,1fr);gap:4px}.cols button{border-radius:4px}.fl{margin:8px 0 4px}.fl input{padding:8px 10px}}
/* ---- v2: órdenes, bases, inventario ---- */
.bar{height:6px;border-radius:4px;background:#ffffff14;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:4px}
.ust{padding:8px 10px;border-radius:7px;background:#0006;font-size:13px;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chips span{padding:4px 9px;border-radius:5px;background:#ffffff10;font-size:12.5px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}.acts .wide{grid-column:1/-1}
.btn.red{background:linear-gradient(#c8463a,#8c241b);border:0;color:#fff}.btn.ghost{background:transparent}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn{font-size:13.5px}
.tg{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;cursor:pointer;color:var(--tx)}.tg input{width:auto;margin:0;accent-color:var(--gold)}
#schw input{margin-top:6px}
.warn{color:#ffb3a8;font-size:12.5px;margin-top:10px;padding:8px 10px;border-radius:7px;background:#e05a4a1f}.okm{color:#a6e0ae;font-size:12.5px;margin-top:10px;padding:8px 10px;border-radius:7px;background:#5fbf6a1f}
.nt{color:#aab4ff}
.rec{display:flex;flex-direction:column;gap:6px}.ri{display:flex;align-items:center;gap:10px;text-align:left;padding:7px 9px;border-radius:8px;background:#ffffff0b;border:1px solid #ffffff14}
.ri:hover:not(:disabled){border-color:var(--gold)}.ri:disabled{opacity:.5;cursor:not-allowed}.ri img{width:26px;height:44px;object-fit:contain;flex:none}.ri .ico{font-size:22px;width:26px;text-align:center}
.ri b{display:block;font-size:13.5px}.ri small{color:var(--mu);font-size:11.5px}
.mbox.wide{width:min(720px,100%);max-height:86vh;overflow:auto}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.inv .it{background:#0005;border:1px solid #ffffff14;border-radius:9px;padding:11px;display:flex;flex-direction:column;gap:6px}
.inv .ih{display:flex;justify-content:space-between;align-items:center}.inv .ih b{font-family:Oswald;font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.inv .cnt{background:var(--gold);color:#1a1405;border-radius:10px;padding:1px 8px;font-weight:700;font-size:12px}
.inv p{font-size:12px;color:var(--mu);flex:1}.inv small{font-size:11.5px}.inv .btn{padding:7px 12px;margin-top:0}
.fl2{display:flex;flex-direction:column;gap:5px}.fl2 button{text-align:left;padding:7px 10px;border-radius:7px;background:#ffffff0b}.fl2 button:hover{background:#ffffff16}.fl2 b{display:block;font-size:13px}.fl2 small{color:var(--mu);font-size:11.5px}
#mbanner{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:6;padding:9px 10px 9px 18px;border-radius:30px;background:#1a1405f0;border:1px solid var(--gold);color:#ffe9a8;font-size:13.5px;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px)}
#mbanner button{padding:5px 12px;border-radius:20px;background:#ffffff18;font-size:12.5px}
.picking #map{cursor:crosshair}
#selbox{position:fixed;border:1.5px dashed #ffe9a8;background:#ffe9a812;z-index:7;pointer-events:none}
.zbtn{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zbtn button{width:42px;height:42px;border-radius:8px;background:var(--pn);border:1px solid var(--ln);color:var(--tx);font-size:22px;line-height:1}
.zbtn button:hover{border-color:var(--gold)}
#side .sec:first-child{margin-top:0}
@media(max-width:760px){.zbtn{bottom:auto;top:190px;right:10px}.zbtn button{width:38px;height:38px}#mbanner{top:auto;bottom:calc(46vh + 18px);font-size:12.5px}.inv{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="gate" id="gate"></div>
<div id="app" class="hide">
  <canvas id="map"></canvas>
  <header class="top" id="top"></header>
  <div class="banner">★ Elige tu punto de despliegue en el mapa</div>
  <aside id="legend"></aside>
  <aside id="side" class="hide"></aside>
  <canvas id="mini" width="240" height="150"></canvas>
  <div class="zbtn"><button data-zoom="1.6" title="Acercar">+</button><button data-zoom="0.625" title="Alejar">−</button></div>
  <div id="mbanner" class="hide"></div>
  <div id="selbox" class="hide"></div>
</div>
<div id="tip" class="hide"></div>
<div id="modal" class="hide"></div>
<div class="toasts" id="toasts"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>/* ===================== MCF Frontline · generación del mundo ===================== */
'use strict';
const WW=2400,WH=1500,CELL=4,GW=WW/CELL,GH=WH/CELL;
function mul32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,2147483647);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s,o){let t=0,a=1,f=1,n=0;for(let i=0;i<(o||5);i++){t+=vnoise(x*f,y*f,s+i*17)*a;n+=a;a*=.5;f*=2.03}return t/n}
const TER={sea:{n:'Mar',c:'#1d4f7a'},coast:{n:'Costa',c:'#c8b47a'},plains:{n:'Llanura',c:'#6f9a4a',mv:1,df:1},forest:{n:'Bosque',c:'#3f6b34',mv:1.4,df:1.3},hills:{n:'Colinas',c:'#8a8a55',mv:1.5,df:1.35},mountain:{n:'Montaña',c:'#8b7d6b',mv:2.2,df:1.7},desert:{n:'Desierto',c:'#cdb178',mv:1.2,df:1}};
const SYL=['al','bar','cor','dan','el','fen','gar','hal','is','jor','kel','lan','mar','nor','or','pal','quin','ros','sal','tor','ur','val','wen','xar','yel','zan','ber','cas','dor','mon','vik','ost','rav','sel','tur','ven','gra','lun','bra','kor'];
function mkName(R){const n=2+(R()<.35?1:0);let s='';for(let i=0;i<n;i++)s+=SYL[Math.floor(R()*SYL.length)];return s.charAt(0).toUpperCase()+s.slice(1)}

function genWorld(seed){
  const R=mul32(seed*7919+1);const t0=performance.now();
  /* altura y humedad */
  const H=new Float32Array(GW*GH),M=new Float32Array(GW*GH);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const wx=x*CELL,wy=y*CELL;
    const nx=(wx-WW/2)/(WW/2),ny=(wy-WH/2)/(WH/2);const d=Math.sqrt(nx*nx*0.9+ny*ny*1.25);
    let h=fbm(wx/420,wy/420,seed,6)*1.1-.55+(.5-d*.6)+(fbm(wx/160,wy/160,seed+99,3)-.5)*.25;
    /* cordilleras: ruido "ridged" que forma cadenas alargadas */
    const rg=1-Math.abs(fbm(wx/520,wy/520,seed+211,4)*2-1);const rk=Math.pow(Math.max(0,rg-.72)/.28,1.6);
    h=h>0?h*.55+rk*.55*Math.min(1,h*6):h;
    H[y*GW+x]=h;M[y*GW+x]=fbm(wx/300,wy/300,seed+500,4)}
  const land=i=>H[i]>0;
  /* centros de provincias (rejilla con jitter) */
  const SP=72,cols=Math.ceil(WW/SP),rows=Math.ceil(WH/SP);const P=[];
  for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){const x=(gx+.15+R()*.7)*SP,y=(gy+.15+R()*.7)*SP;if(x>=WW||y>=WH)continue;
    const ci=Math.floor(y/CELL)*GW+Math.floor(x/CELL);const L=land(ci);if(!L&&((gx+gy)%2||R()<.35))continue;P.push({x,y,land:L,gx,gy})}
  /* índice espacial */
  const grid=new Map();P.forEach((p,i)=>{p.id=i;const k=p.gx+','+p.gy;grid.set(k,i)});
  const own=new Int32Array(GW*GH);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x,L=land(i);const wx=x*CELL+2,wy=y*CELL+2;/* deformación del dominio: fronteras orgánicas */const qx=wx+(fbm(wx/70,wy/70,seed+7,3)-.5)*70,qy=wy+(fbm(wx/70,wy/70,seed+8,3)-.5)*70;const gx=Math.floor(qx/SP),gy=Math.floor(qy/SP);let best=-1,bd=1e18;
    for(let r=1;r<=3&&best<0;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const k=grid.get((gx+dx)+','+(gy+dy));if(k==null)continue;const p=P[k];if(p.land!==L)continue;
      const dd=(p.x-qx)*(p.x-qx)+(p.y-qy)*(p.y-qy);if(dd<bd){bd=dd;best=k}}
    own[i]=best}
  /* estadísticas por provincia */
  const st=P.map(()=>({n:0,sx:0,sy:0,h:0,m:0}));
  for(let i=0;i<own.length;i++){const k=own[i];if(k<0)continue;const s=st[k];s.n++;s.sx+=(i%GW)*CELL+2;s.sy+=Math.floor(i/GW)*CELL+2;s.h+=H[i];s.m+=M[i]}
  const prov=[];const remap=new Int32Array(P.length).fill(-1);
  P.forEach((p,k)=>{const s=st[k];if(s.n<25)return;remap[k]=prov.length;
    const h=s.h/s.n,m=s.m/s.n;let t='sea';if(p.land){t=h>.36?'mountain':h>.25?'hills':m>.56?'forest':m<.4?'desert':'plains'}
    prov.push({id:prov.length,land:p.land,t,x:s.sx/s.n,y:s.sy/s.n,area:s.n,nb:new Set()})});
  for(let i=0;i<own.length;i++)own[i]=own[i]>=0?remap[own[i]]:-1;
  /* celdas huérfanas: asignar a vecino */
  for(let pass=0;pass<4;pass++)for(let i=0;i<own.length;i++)if(own[i]<0){const x=i%GW,y=(i/GW)|0;const n=[x>0?own[i-1]:-1,x<GW-1?own[i+1]:-1,y>0?own[i-GW]:-1,y<GH-1?own[i+GW]:-1].find(v=>v>=0);if(n!=null&&n>=0)own[i]=n}
  /* vecinos */

/* ---------- avance del mundo (determinista: cualquier cliente lo puede ejecutar) ---------- */

    for(const id in S.b||{}){const b=S.b[id];if(b.fin&&!b.ok&&b.fin<=t){if(BT[b.t].inc)settle(W,S,b.o,b.fin);b.ok=1}}

      u.x=+q[0].toFixed(1);u.y=+q[1].toFixed(1);u.hd=+q[2].toFixed(2);delete u.p;delete u.d;u.it=ta;
      if(u.a)u.ar=1;
      if(u.tq){const T=UT[u.t];const L=Math.hypot(u.tq[2]-u.tq[0],u.tq[3]-u.tq[1]);S.tr=S.tr||{};S.tr['t'+id+ta.toString(36)]={o:u.o,x1:u.tq[0],y1:u.tq[1],x2:u.tq[2],y2:u.tq[3],st:ta,fin:Math.round(ta+L/(T.dig*sp)*HOUR)};delete u.tq}
      if(u.em){const c=S.u[u.em];if(c&&c.o===u.o&&!c.p){const cap=UT[c.t].cap||0;if(usedCap(S,u.em)+(UT[u.t].slot||1)<=cap&&Math.hypot(c.x-u.x,c.y-u.y)<10)u.in=u.em}delete u.em}}

function trenchPts(tr){const a=[tr.x1,tr.y1],b=[tr.x2,tr.y2];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const n=Math.max(2,Math.round(L/1.3));const nx=-(b[1]-a[1])/L,ny=(b[0]-a[0])/L;const o=[];
  for(let i=0;i<=n;i++){const k=i/n;const z=(i%4<2?1:-1)*.55*(i>0&&i<n?1:0);o.push([a[0]+(b[0]-a[0])*k+nx*z,a[1]+(b[1]-a[1])*k+ny*z])}return o}
function drawTrench(x,tr,t,col){const p=trenchPts(tr);const tot=Math.max(1,tr.fin-tr.st);const k=Math.max(0,Math.min(1,(t-tr.st)/tot));const m=Math.max(1,Math.round((p.length-1)*k));
  const line=(n)=>{x.beginPath();x.moveTo(p[0][0],p[0][1]);for(let i=1;i<=n;i++)x.lineTo(p[i][0],p[i][1])};x.lineCap='round';x.lineJoin='round';
  if(k<1){x.setLineDash([.6,.6]);line(p.length-1);x.strokeStyle='rgba(255,220,120,.7)';x.lineWidth=.25;x.stroke();x.setLineDash([])}
  if(t<tr.st)return;line(m);x.strokeStyle='#7b6646';x.lineWidth=2.1;x.stroke();line(m);x.strokeStyle='#3a2d1e';x.lineWidth=1.15;x.stroke();line(m);x.strokeStyle='rgba(20,14,8,.7)';x.lineWidth=.5;x.stroke();
  for(let i=0;i<=m;i+=1){const q=p[i];x.fillStyle='#b4a175';x.beginPath();x.ellipse(q[0]+.95,q[1]-.4,.4,.24,.4,0,7);x.fill()}
  x.fillStyle=col;x.beginPath();x.arc(p[0][0],p[0][1],.35,0,7);x.fill()}

function hops(a,b,max){if(a===b)return 0;let f=[a];const seen=new Set([a]);for(let d=1;d<=max;d++){const nf=[];for(const x of f)for(const n of WORLD.prov[x].nb){if(!WORLD.prov[n].land||seen.has(n))continue;if(n===b)return d;seen.add(n);nf.push(n)}f=nf}return 99}

function freeSpot(S,x,y,r){for(const id in S.b||{}){const b=S.b[id];if(Math.hypot(b.x-x,b.y-y)<bR(b)+r+1)return false}return true}

    for(const k in S.own)if(S.own[k]!==UID&&tooClose(cap,+k))throw new Error('Hay otro país demasiado cerca');
    const want=[cap,...p.nb.filter(n=>W.prov[n].land&&!S.own[n]).sort((a,b)=>W.prov[b].city-W.prov[a].city).slice(0,3)];want.forEach(k=>S.own[k]=UID);
    S.pl[UID]={n:cleanName(name)||MYNAME,col,cap,res:{m:600,s:250,o:120},lt:t,inv:{cmp:1},t};
    /* cuartel general junto a la ciudad y tropas iniciales */
    let hx=p.x+10,hy=p.y+6;for(let i=0;i<24;i++){const a=i*.9,d=10+i*.6;const x=p.x+Math.cos(a)*d,y=p.y+Math.sin(a)*d;const mi=Math.floor(y/MR)*MW+Math.floor(x/MR);if(!isWater(W,x,y)&&!W.rmask[mi]&&provAtW(W,x,y)===cap){hx=x;hy=y;break}}
    S.b['b'+UID.slice(0,5)+'hq']={o:UID,t:'hq',l:1,x:+hx.toFixed(1),y:+hy.toFixed(1),r:0,st:t,fin:t,ok:1};
    const kit=['inf','inf','eng','trk','hmv'];kit.forEach((k,i)=>{const a=-1.2+i*.62;S.u[uid36('u')+i]={o:UID,t:k,x:+(hx+Math.cos(a)*16).toFixed(1),y:+(hy+Math.sin(a)*16).toFixed(1),hd:a,hp:100,it:t}})})}

    const pv=provAtW(WORLD,x,y);if((S.own||{})[pv]!==UID)throw new Error('Solo puedes construir en tu territorio');if(isWater(WORLD,x,y))throw new Error('No se puede construir en el agua');

    if(!show)continue;const fs=(cu!=null?13:p.city>=2?12:10.5)*dpr*(k>=ZT?1.25:1);x.font=`${cu!=null||p.city>=2?700:600} ${fs}px Oswald,system-ui`;
    const ty=k<ZT?sy+(p.city||cu!=null?13*dpr:0)+fs*.25:sy-(p.rs||8)*z-fs;const name=p.name.toUpperCase();const tw=x.measureText(name).width/2+2*dpr;const bb=[sx-tw,ty-fs*.6,sx+tw,ty+fs*.6];
    if(boxes.some(o=>o[0]<bb[2]&&o[2]>bb[0]&&o[1]<bb[3]&&o[3]>bb[1]))continue;boxes.push(bb);
    x.lineWidth=3*dpr;x.strokeStyle='rgba(15,18,12,.85)';x.strokeText(name,sx,ty);x.fillStyle=cu!=null?'#ffe9a8':'#f2ead2';x.fillText(name,sx,ty)}}
function star(x,cx,cy,r,col){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.fillStyle=col;x.fill();x.lineWidth=1.6*DPR();x.strokeStyle='#fff6d0';x.stroke()}
function drawMini(){const m=$('#mini');if(!m||!MINI)return;const x=m.getContext('2d');x.drawImage(MINI,0,0);if(OWNC){x.globalAlpha=.9;x.drawImage(OWNC,0,0,240,150);x.globalAlpha=1}
  const k=240/WW;const S=S_();for(const id in S.u||{}){const u=S.u[id];if(u.o!==UID||u.in)continue;x.fillStyle='#fff';x.fillRect((u.x||0)*k-1,(u.y||0)*k-1,2,2)}
  const c=cv();x.strokeStyle='#ffe9a8';x.lineWidth=1.5;x.strokeRect(cam.x*k,cam.y*k,Math.max(3,c.width/cam.z*k),Math.max(3,c.height/cam.z*k))}

/* ---------- entrada (ratón / táctil) ---------- */
function bindInput(){const c=cv();const pts=new Map();let drag=null,moved=0,pinch=null,box=null;
  c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.offsetX,e.offsetY]);moved=0;
    if(pts.size===1){if(e.shiftKey){box={x:e.offsetX,y:e.offsetY,x2:e.offsetX,y2:e.offsetY};drag=null}else drag={x:e.offsetX,y:e.offsetY,cx:cam.x,cy:cam.y}}
    else if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:cam.z,w:s2w((a[0]+b[0])/2*DPR(),(a[1]+b[1])/2*DPR())};drag=null;box=null}});
  c.addEventListener('pointermove',e=>{const dpr=DPR();
    if(pts.has(e.pointerId))pts.set(e.pointerId,[e.offsetX,e.offsetY]);
    if(pinch&&pts.size===2){const[a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);cam.z=pinch.z*d/pinch.d;clampCam();const mx=(a[0]+b[0])/2*dpr,my=(a[1]+b[1])/2*dpr;cam.x=pinch.w[0]-mx/cam.z;cam.y=pinch.w[1]-my/cam.z;clampCam();moved=99;DIRTY=true;return}
    if(box){box.x2=e.offsetX;box.y2=e.offsetY;drawBox(box);return}
    if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));if(moved>5){cam.x=drag.cx-dx*dpr/cam.z;cam.y=drag.cy-dy*dpr/cam.z;clampCam();DIRTY=true;c.style.cursor='grabbing'}}
    else if(WORLD){const w=s2w(e.offsetX*dpr,e.offsetY*dpr);HOVW=w;const h=provAt(w[0],w[1]);if(MODE)DIRTY=true;if(h!==HOV){HOV=h;tip(e,h);if(DEPLOY)DIRTY=true}else tipMove(e)}});
  const up=e=>{pts.delete(e.pointerId);c.style.cursor='';if(pts.size<2)pinch=null;
    if(box&&pts.size===0){const dpr=DPR();const a=s2w(Math.min(box.x,box.x2)*dpr,Math.min(box.y,box.y2)*dpr),b=s2w(Math.max(box.x,box.x2)*dpr,Math.max(box.y,box.y2)*dpr);selectBox(a,b);box=null;$('#selbox').classList.add('hide');return}
    if(pts.size===0){if(drag&&moved<6&&WORLD){const dpr=DPR();click(s2w(e.offsetX*dpr,e.offsetY*dpr),[e.offsetX*dpr,e.offsetY*dpr])}drag=null}};
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
  c.addEventListener('pointerleave',()=>{$('#tip').classList.add('hide')});
  c.addEventListener('wheel',e=>{e.preventDefault();const dpr=DPR();const[wx,wy]=s2w(e.offsetX*dpr,e.offsetY*dpr);cam.z*=Math.exp(-e.deltaY*.0018);clampCam();cam.x=wx-e.offsetX*dpr/cam.z;cam.y=wy-e.offsetY*dpr/cam.z;clampCam();DIRTY=true},{passive:false});
  $('#mini').addEventListener('pointerdown',e=>{const k=WW/240;const c2=cv();cam.x=e.offsetX*k-c2.width/cam.z/2;cam.y=e.offsetY*k-c2.height/cam.z/2;clampCam();DIRTY=true});
  document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>zoomBy(+b.dataset.zoom));
  addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Escape'){cancelMode();SELU=[];SELB=null;panel()}if(e.key==='r'&&MODE&&MODE.k==='place'){MODE.rot=(MODE.rot||0)+Math.PI/8;DIRTY=true}});
  addEventListener('resize',resize)}
function zoomBy(f){const c=cv();const[wx,wy]=s2w(c.width/2,c.height/2);cam.z*=f;clampCam();cam.x=wx-c.width/2/cam.z;cam.y=wy-c.height/2/cam.z;clampCam();DIRTY=true}
function drawBox(b){const e=$('#selbox');e.classList.remove('hide');e.style.left=Math.min(b.x,b.x2)+'px';e.style.top=Math.min(b.y,b.y2)+'px';e.style.width=Math.abs(b.x2-b.x)+'px';e.style.height=Math.abs(b.y2-b.y)+'px'}
function selectBox(a,b){const S=S_(),t=now();SELU=Object.keys(S.u||{}).filter(id=>{const u=S.u[id];if(u.o!==UID||u.in)return false;const q=uPos(WORLD,S,u,t,spd());return q[0]>=a[0]&&q[0]<=b[0]&&q[1]>=a[1]&&q[1]<=b[1]});SELB=null;SELP=-1;SELC=null;cancelMode();panel();DIRTY=true}

  t.innerHTML=`<b>${esc(p.name)}</b><span>${TER[p.t].n}${p.city?' · '+CITYN[p.city]:''}${o?` · <i style="color:${colOf(o)}">■</i> ${esc(nameOf(o))}`:''}</span>`;t.classList.remove('hide');tipMove(e)}
function tipMove(e){const t=$('#tip');t.style.transform=`translate(${e.clientX+14}px,${e.clientY+14}px)`}
const CITYN=['','Pueblo','Ciudad','Metrópolis'];

/* ---------- toques en el mapa ---------- */
function hitUnit(w,sp_){const S=S_(),t=now(),z=cam.z,zc=ZC();let best=null,bd=1e9;
  for(const id in S.u||{}){const u=S.u[id];if(u.in)continue;const q=uPos(WORLD,S,u,t,spd());let d;
    if(zc>=ZT){d=Math.hypot(q[0]-w[0],q[1]-w[1]);const T=UT[u.t];if(d>Math.max(T.kind==='veh'?T.len:2.6,16*DPR()/z))continue}
    else{const s=w2s(q[0],q[1]);d=Math.hypot(s[0]-sp_[0],s[1]-sp_[1])/z;if(d*z>16*DPR())continue}
    if(u.o===UID)d*=.6;if(d<bd){bd=d;best=id}}return best}
function hitBase(w,sp_){const S=S_(),z=cam.z,zc=ZC();let best=null,bd=1e9;for(const id in S.b||{}){const b=S.b[id];let d;
    if(zc>=ZT){d=Math.hypot(b.x-w[0],b.y-w[1]);if(d>bR(b)+1)continue}else{const s=w2s(b.x,b.y);d=Math.hypot(s[0]-sp_[0],s[1]-sp_[1])/z;if(d*z>14*DPR())continue}if(d<bd){bd=d;best=id}}return best}
function click(w,sp_){const S=S_();
  if(DEPLOY){const id=provAt(w[0],w[1]);if(id>=0){SELP=id;SELC=renderSel(WORLD,id);DIRTY=true;panel()}return}
  if(MODE){modeClick(w,sp_);return}
  const u=hitUnit(w,sp_);
  if(u){const mine=S.u[u].o===UID;if(MULTI&&mine){SELU=SELU.includes(u)?SELU.filter(x=>x!==u):[...SELU,u]}else SELU=[u];SELB=null;SELP=-1;SELC=null;PREV=null;panel();DIRTY=true;return}
  const b=hitBase(w,sp_);if(b){SELB=b;SELU=[];SELP=-1;SELC=null;panel();DIRTY=true;return}
  if(SELU.length&&!MULTI){SELU=[];}
  SELB=null;const id=provAt(w[0],w[1]);if(id>=0&&ZC()<ZT){SELP=id;SELC=renderSel(WORLD,id)}else{SELP=-1;SELC=null}DIRTY=true;panel()}
function cancelMode(){MODE=null;PREV=null;$('#app').classList.remove('picking');banner('');DIRTY=true}
function banner(t){const b=$('#mbanner');if(!t){b.classList.add('hide');return}b.innerHTML=t+' <button id="mcancel">Cancelar</button>';b.classList.remove('hide');$('#mcancel').onclick=()=>{cancelMode();panel()}}
function setMode(m,txt){MODE=m;PREV=null;$('#app').classList.add('picking');banner(txt);DIRTY=true}
function modeClick(w,sp_){const S=S_(),t=now();const k=MODE.k;
  if(k==='move'||k==='attack'){const routes=[];const ids=SELU.filter(id=>S.u[id]&&!S.u[id].in);let maxT=0;
    ids.forEach((id,i)=>{const u=S.u[id];const q=uPos(WORLD,S,u,t,spd());const kk=ids.length>1?i-(ids.length-1)/2:0;const ang=Math.atan2(w[1]-q[1],w[0]-q[0])+Math.PI/2;
      const p=planRoute(WORLD,[q[0],q[1]],[w[0]+Math.cos(ang)*kk*4,w[1]+Math.sin(ang)*kk*4],OFFROAD);if(!p)return;const rt=routeTimes(WORLD,u.t,p,spd());maxT=Math.max(maxT,rt[rt.length-1]);routes.push({id,p})});
    if(!routes.length){toast('No hay ruta terrestre hasta ese punto','bad');return}
    PREV={dest:w,routes,attack:k==='attack',eta:maxT};banner('');panel();DIRTY=true;return}
  if(k==='embark'){const c=hitUnit(w,sp_);const cu=c&&S.u[c];if(!cu||cu.o!==UID||!UT[cu.t].cap){toast('Toca uno de tus vehículos de transporte','bad');return}
    const free=UT[cu.t].cap-usedCap(S,c);const ids=SELU.filter(id=>S.u[id]&&UT[S.u[id].t].kind==='inf');const q=uPos(WORLD,S,cu,t,spd());
    act(()=>orderUnits(ids.slice(0,8),[q[0],q[1]],{embark:c,off:true}),'Las tropas van hacia el vehículo'+(free<ids.reduce((a,id)=>a+UT[S.u[id].t].slot,0)?' (no caben todas)':''));cancelMode();panel();return}
  if(k==='dig1'){MODE={k:'dig2',a:w};banner('Toca dónde TERMINA la trinchera (máx. 40 m)');return}
  if(k==='dig2'){const a=MODE.a;let b=w;const L=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L>40){b=[a[0]+(b[0]-a[0])*40/L,a[1]+(b[1]-a[1])*40/L]}if(L<3){toast('La trinchera es demasiado corta','bad');return}
    const id=SELU.find(i=>S.u[i]&&UT[S.u[i].t].dig);const mid=[(a[0]+b[0])/2,(a[1]+b[1])/2];const T=UT[S.u[id].t];
    act(()=>orderUnits([id],mid,{dig:[a[0],a[1],b[0],b[1]],dep:SCHED}),`Trinchera ordenada: ${Math.round(Math.min(L,40))} m · ${fmtD(Math.min(L,40)/(T.dig*spd())*HOUR)} de obra al llegar`);cancelMode();panel();return}
  if(k==='place'){if(ZC()<ZT){toast('Acerca más el zoom para colocar la base','bad');return}MODE.at=w;panel();DIRTY=true;return}
  if(k==='strike'){act(()=>launchStrike(MODE.bid,w[0],w[1]),'¡Aparatos en el aire!');cancelMode();panel();return}}
function placeOk(b){const S=S_();const pv=provAt(b.x,b.y);if(ownerOf(pv)!==UID)return false;if(isWater(WORLD,b.x,b.y))return false;return freeSpot(S,b.x,b.y,bR(b))}

/* ---------- panel lateral ---------- */
const prog=(a,b,t)=>Math.max(0,Math.min(100,(t-a)/Math.max(1,b-a)*100));
function panel(){const el=$('#side');if(!WORLD){el.innerHTML='';return}const S=S_(),t=now();el.classList.remove('hide');
  if(DEPLOY){el.innerHTML=deployPanel();bindDeploy();return}
  if(PREV)return previewPanel(el);
  if(MODE&&MODE.k==='place')return placePanel(el);

  if(SELU.length)return unitPanel(el);

  if(SELP>=0)return provPanel(el);
  el.classList.add('hide')}
const closeBtn='<button class="x" data-x>✕</button>';
function bindClose(el){const b=el.querySelector('[data-x]');if(b)b.onclick=()=>{SELU=[];SELB=null;SELP=-1;SELC=null;cancelMode();DIRTY=true;panel()}}
function hpBar(hp){return`<div class="bar"><i style="width:${hp}%;background:${hp>60?'#5fbf6a':hp>30?'#e0a12f':'#e05a4a'}"></i></div>`}
function unitStatus(S,id,u,t){const sp=spd();if((u.rdy||0)>t)return`🛠️ En formación · lista a las ${fmtDay(u.rdy)}`;if(u.in)return`🚚 A bordo de ${esc(UT[S.u[u.in]?S.u[u.in].t:'trk'].n)}`;
  if(u.p){const ar=uArrive(WORLD,u,sp);if((u.d||0)>t)return`⏰ Salida programada ${fmtDay(u.d)} · llegada ${fmtDay(ar)}`;return`${u.a?'⚔️ Atacando':u.tq?'⛏️ Va a cavar':u.em?'🚚 Va a subir al vehículo':'➡️ En marcha'} · llega a las ${fmtDay(ar)} (${fmtD(ar-t)})`}
  if(u.ar)return'⚔️ Esperando al resto del ataque';const tr=Object.values(S.tr||{}).find(tr=>tr.o===u.o&&tr.fin>t&&segDist([u.x,u.y],[tr.x1,tr.y1],[tr.x2,tr.y2])<6);if(tr)return`⛏️ Cavando trinchera · ${Math.round(prog(tr.st,tr.fin,t))}%`;
  const ent=u.it?Math.min(30,Math.round((t-u.it)/HOUR*sp*15)):0;return`🛡️ Defendiendo posición${ent?` · atrincherada +${ent}%`:''}`}
function unitPanel(el){const S=S_(),t=now();const ids=SELU;const mine=ids.every(id=>S.u[id].o===UID);

    <div class="ust">${unitStatus(S,ids[0],u,t)}</div>${hpBar(u.hp||100)}<div class="grid3"><div><small>Ataque</small><b>${T.atk}</b></div><div><small>Defensa</small><b>${T.def}</b></div><div><small>Velocidad</small><b>${T.road} / ${T.off}</b></div></div>
    ${T.cap?`<p class="mu sm">Transporte: ${usedCap(S,ids[0])}/${T.cap} plazas ocupadas</p>`:''}<p class="mu sm">${T.d}</p>`}
  else{const cnt={};ids.forEach(id=>{const k=S.u[id].t;cnt[k]=(cnt[k]||0)+1});head=`<div class="ph"><div><small>Grupo seleccionado</small><h3>${ids.length} unidades</h3></div>${closeBtn}</div><div class="chips">${Object.entries(cnt).map(([k,n])=>`<span>${n}× ${UT[k].n}</span>`).join('')}</div>`}

      ${any(u=>UT[u.t].cap&&usedCap(S,ids.find(i=>S.u[i]===u))>0)?'<button class="btn" data-a="unload">⬇️ Bajar tropas</button>':''}
      ${any(u=>UT[u.t].dig&&!u.in)?'<button class="btn" data-a="dig">⛏️ Cavar trinchera</button>':''}

      <label class="tg"><input type="checkbox" id="multi" ${MULTI?'checked':''}> Selección múltiple (toca más unidades)</label>

  $('#sch').onchange=e=>{SCHED=e.target.checked?schedParse($('#scht').value)||now()+HOUR:null;panel()};

   <div class="grid3"><div><small>Salida</small><b>${SCHED&&SCHED>now()?fmtDay(dep):'Ahora'}</b></div><div><small>Duración</small><b>${fmtD(P.eta)}</b></div><div><small>Llegada</small><b>${fmtDay(ar)}</b></div></div>${warn}
   <div class="acts" style="margin-top:12px"><button class="btn ${P.attack?'red':'pri'} wide" id="pgo">${P.attack?'⚔️ Lanzar ataque':'Confirmar orden'}</button><button class="btn ghost wide" id="pno">Cambiar destino</button></div>`;
  bindClose(el);$('#pgo').onclick=async()=>{const ids=P.routes.map(r=>r.id);const ok=await act(()=>orderUnits(ids,P.dest,{attack:P.attack,dep:SCHED,off:OFFROAD}),P.attack?'¡Ataque en marcha!':'Orden enviada');if(ok!=null){PREV=null;MODE=null;$('#app').classList.remove('picking');SCHED=null;panel();DIRTY=true}};
  $('#pno').onclick=()=>{const k=P.attack?'attack':'move';PREV=null;setMode({k},P.attack?'Toca el OBJETIVO del ataque':'Toca el DESTINO');panel()}}
function basePanel(el){const S=S_(),t=now();const id=SELB,b=S.b[id],T=BT[b.t];const mine=b.o===UID;const build=(b.fin||0)>t;
  let h=`<div class="ph"><div><small>${mine?'Tu base':'Base de '+esc(nameOf(b.o))} · nivel ${b.l}</small><h3>${bName(b)}</h3></div>${closeBtn}</div>`;
  if(build)h+=`<div class="ust">🏗️ En obras · lista a las ${fmtDay(b.fin)} (${fmtD(b.fin-t)})</div><div class="bar"><i style="width:${prog(b.st,b.fin,t)}%;background:#ffd166"></i></div>`;
  h+=`<p class="mu sm">${T.d}</p>`;
  if(T.inc)h+=`<div class="res3">${Object.entries(T.inc).map(([k,v])=>`<span class="r">${{m:'💶',s:'⚙️',o:'🛢️'}[k]} +${v[b.l-1]}/h</span>`).join('')}</div>`;
  if(mine){const rec=Object.entries(UT).filter(([k,u])=>u.base===b.t);
    if(rec.length){const q=Object.values(S.u||{}).filter(u=>u.bq===id&&(u.rdy||0)>t).length;h+=`<div class="sec">Reclutar ${q?`· ${q} en cola`:''}</div><div class="rec">`+rec.map(([k,u])=>{const lock=b.l<u.lvl;const can=!build&&!lock&&canPay(WORLD,S,UID,u.cost,t);
      return`<button class="ri" data-r="${k}" ${can?'':'disabled'}>${u.img&&IMG[u.img]?`<img src="img/${u.img}.webp" alt="">`:`<span class="ico">${u.kind==='inf'?'🪖':'🚙'}</span>`}<div><b>${u.n}</b><small>${lock?'🔒 Necesita nivel '+u.lvl:fmtCost(u.cost)+' · '+fmtD(u.t*60000*(b.l>=3?.7:1)/spd())}</small></div></button>`}).join('')+'</div>'}
    if(T.strike){const ST=T.strike;const cd=(b.cd||0)>t;h+=`<div class="sec">${ST.n}</div><p class="mu sm">Daño ${ST.dmg[b.l-1]} · alcance ${ST.rng[b.l-1]} m · ${fmtCost(ST.cost)}</p><button class="btn red wide" id="bstr" ${build||cd?'disabled':''}>${cd?'Aparatos volviendo · '+fmtD(b.cd-t):'🎯 Elegir objetivo'}</button>`}
    if(b.l<T.n.length){const c=T.cost[b.l];h+=`<div class="sec">Mejorar a ${T.n[b.l]}</div><p class="mu sm">${fmtCost(c)} · ${fmtD(T.t[b.l]*60000/spd())} de obras</p><button class="btn pri wide" id="bup" ${build||!canPay(WORLD,S,UID,c,t)?'disabled':''}>Mejorar base</button>`}}
  el.innerHTML=h;bindClose(el);
  el.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>act(()=>recruit(id,x.dataset.r),UT[x.dataset.r].n+' en formación').then(()=>panel()));
  $('#bup')&&($('#bup').onclick=()=>act(()=>upgradeBase(id),'Obras de mejora iniciadas').then(()=>panel()));
  $('#bstr')&&($('#bstr').onclick=()=>{setMode({k:'strike',bid:id},'Toca el objetivo del ataque (radio 10 m)');panel()})}
function provPanel(el){const p=WORLD.prov[SELP];const o=ownerOf(SELP);const y=provYield(p);const T=TER[p.t];
  if(!p.land){el.innerHTML=`<div class="ph"><div><small>Zona marítima</small><h3>${esc(p.name)}</h3></div>${closeBtn}</div><p class="mu">Aguas navegables. La flota llegará más adelante.</p>`;bindClose(el);return}
  el.innerHTML=`<div class="ph"><div><small>${T.n}${p.coast?' · Costa':''}</small><h3>${esc(p.name)}</h3></div>${closeBtn}</div>
  <div class="own">${o?`<i style="background:${colOf(o)}"></i><span>${esc(nameOf(o))}${o===UID?' <em>(tú)</em>':''}</span>${S_().pl[o]&&S_().pl[o].cap===SELP?'<b class="tag">CAPITAL</b>':''}`:'<i class="neu"></i><span>Territorio neutral · milicia local</span>'}</div>
  <div class="grid3"><div><small>Asentamiento</small><b>${p.city?CITYN[p.city]:'Rural'}</b></div><div><small>Defensa</small><b>×${(T.df||1).toFixed(2)}</b></div><div><small>Movimiento</small><b>×${(T.mv||1).toFixed(1)}</b></div></div>
  <div class="sec">Producción por hora</div><div class="res3"><span class="r">💶 ${y.m}</span><span class="r">⚙️ ${y.s}</span><span class="r">🛢️ ${y.o}</span></div>
  <button class="btn wide" id="pzoom" style="margin-top:12px">🔍 Ver de cerca</button>`;bindClose(el);
  $('#pzoom').onclick=()=>{centerOn(p.x,p.y,10);SELP=-1;SELC=null;panel()}}
function centerOn(wx,wy,zc){const c=cv();if(zc)cam.z=zc*DPR();clampCam();cam.x=wx-c.width/2/cam.z;cam.y=wy-c.height/2/cam.z;clampCam();DIRTY=true}

/* ---------- inventario de bases ---------- */
function invPanel(){const m=$('#modal');const S=S_(),t=now();const P=me();if(!P)return;const inv=P.inv||{};
  m.innerHTML=`<div class="mbox wide"><div class="ph"><div><small>Compra bases y colócalas donde quieras</small><h3>Inventario</h3></div><button class="x" data-x>✕</button></div><div class="inv">`+
  Object.entries(BT).filter(([k,b])=>b.buy!==false).map(([k,b])=>{const c=b.cost[0];const n=inv[k]||0;return`<div class="it"><div class="ih"><b>${b.n[0]}</b>${n?`<span class="cnt">×${n}</span>`:''}</div><p>${b.d}</p><small>${fmtCost(c)} · obras ${fmtD(b.t[0]*60000/spd())}${b.n.length>1?' · mejora hasta '+b.n[b.n.length-1]:''}</small>
    <div class="row"><button class="btn" data-buy="${k}" ${canPay(WORLD,S,UID,c,t)?'':'disabled'}>Comprar</button>${n?`<button class="btn pri" data-put="${k}">Colocar</button>`:''}</div></div>`}).join('')+'</div></div>';
  m.classList.remove('hide');m.querySelector('[data-x]').onclick=()=>m.classList.add('hide');
  m.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>act(()=>buyBase(b.dataset.buy),BT[b.dataset.buy].n[0]+' añadida al inventario').then(invPanel));
  m.querySelectorAll('[data-put]').forEach(b=>b.onclick=()=>{m.classList.add('hide');SELU=[];SELB=null;MODE={k:'place',type:b.dataset.put,rot:0};$('#app').classList.add('picking');
    if(ZC()<ZT){const cp=WORLD.prov[P.cap];centerOn(cp.x,cp.y,8)}banner('Toca dentro de tu territorio para colocar: '+BT[b.dataset.put].n[0]);panel();DIRTY=true})}
function placePanel(el){const T=BT[MODE.type];const at=MODE.at;const ok=at&&placeOk({t:MODE.type,l:1,x:at[0],y:at[1]});
  el.innerHTML=`<div class="ph"><div><small>Colocar base</small><h3>${T.n[0]}</h3></div>${closeBtn}</div><p class="mu sm">${T.d}</p>
  <p class="${at?(ok?'okm':'warn'):'mu sm'}">${at?(ok?'Buen sitio. Confirma para empezar las obras.':'No se puede aquí: tiene que ser tu territorio, en tierra y sin otras bases cerca.'):'Toca el mapa para elegir el sitio.'}</p>
  <div class="acts"><button class="btn" id="prot">↻ Girar</button><button class="btn pri" id="pok" ${ok?'':'disabled'}>Construir aquí</button></div>`;bindClose(el);
  $('#prot').onclick=()=>{MODE.rot=(MODE.rot||0)+Math.PI/8;DIRTY=true};
  $('#pok').onclick=()=>act(()=>placeBase(MODE.type,at[0],at[1],MODE.rot),'¡Obras iniciadas!').then(r=>{cancelMode();panel()})}

/* ---------- lista de fuerzas ---------- */
function forcesPanel(){const m=$('#modal');const S=S_(),t=now();const us=Object.entries(S.u||{}).filter(([i,u])=>u.o===UID);const bs=Object.entries(S.b||{}).filter(([i,b])=>b.o===UID);
  m.innerHTML=`<div class="mbox wide"><div class="ph"><div><small>Tu ejército</small><h3>Fuerzas</h3></div><button class="x" data-x>✕</button></div>
  <div class="sec">Bases · ${bs.length}</div><div class="fl2">${bs.map(([i,b])=>`<button data-gb="${i}"><b>${bName(b)}</b><small>nivel ${b.l}${(b.fin||0)>t?' · en obras':''}</small></button>`).join('')||'<p class="mu sm">Ninguna</p>'}</div>
  <div class="sec">Unidades · ${us.length}</div><div class="fl2">${us.map(([i,u])=>`<button data-gu="${i}"><b>${UT[u.t].n}</b><small>${unitStatus(S,i,u,t)}</small></button>`).join('')||'<p class="mu sm">Ninguna</p>'}</div></div>`;
  m.classList.remove('hide');m.querySelector('[data-x]').onclick=()=>m.classList.add('hide');
  m.querySelectorAll('[data-gb]').forEach(x=>x.onclick=()=>{const b=S.b[x.dataset.gb];m.classList.add('hide');SELB=x.dataset.gb;SELU=[];centerOn(b.x,b.y,Math.max(ZC(),9));panel()});
  m.querySelectorAll('[data-gu]').forEach(x=>x.onclick=()=>{const u=S.u[x.dataset.gu];const q=uPos(WORLD,S,u,t,spd());m.classList.add('hide');SELU=[x.dataset.gu];SELB=null;centerOn(q[0],q[1],Math.max(ZC(),10));panel()})}

/* ---------- despliegue (unirse) ---------- */
let DCOL=null,DNAME='';
function deployPanel(){const taken=new Set(Object.values(S_().pl||{}).map(p=>p.col));if(!DCOL||taken.has(DCOL))DCOL=COLORS.find(c=>!taken.has(c))||COLORS[0];const own=S_().own||{};
  const p=SELP>=0?WORLD.prov[SELP]:null;const ok=p&&p.land&&!own[SELP]&&!Object.keys(own).some(k=>own[k]!==UID&&tooClose(SELP,+k));
  return`<div class="ph"><div><small>Nuevo país</small><h3>Despliegue inicial</h3></div></div>
  <label class="fl">Nombre de tu país<input id="dn" maxlength="22" value="${esc(DNAME||MYNAME)}"></label>
  <div class="fl">Color de bandera</div><div class="cols">${COLORS.map(c=>`<button data-c="${c}" style="background:${c}" class="${c===DCOL?'on':''}" ${taken.has(c)?'disabled':''}></button>`).join('')}</div>
  <div class="fl">Punto de despliegue</div>
  <div class="pick ${ok?'ok':''}">${p?`<b>${esc(p.name)}</b><span>${p.land?TER[p.t].n+(p.city?' · '+CITYN[p.city]:''):'Mar'}</span>${!ok?'<em>'+(p.land?'Ocupado o demasiado cerca de otro país':'Elige tierra firme')+'</em>':''}`:'<span>Toca una provincia del mapa</span>'}</div>
  <button class="btn pri wide" id="dgo" ${ok?'':'disabled'}>Desplegar ejército</button>
  <p class="mu sm">Empiezas con tu capital, las provincias vecinas libres, un cuartel general, 2 escuadras de fusileros, ingenieros, un camión y un todoterreno. Y un campamento en el inventario para colocarlo donde quieras.</p>`}
function bindDeploy(){const el=$('#side');el.querySelector('#dn').oninput=e=>DNAME=e.target.value;
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{DCOL=b.dataset.c;panel()});
  el.querySelector('#dgo').onclick=async e=>{e.target.disabled=true;e.target.textContent='Desplegando…';
    try{const cap=SELP;await joinGame(DNAME||MYNAME,DCOL,cap);DEPLOY=false;$('#app').classList.remove('deploying');toast('Ejército desplegado. ¡Bienvenido al frente, comandante!','ok');const p=WORLD.prov[cap];SELP=-1;SELC=null;centerOn(p.x+10,p.y+6,9);panel()}
    catch(err){toast(esc(err.message||err),'bad');panel()}}}

/* ---------- barra superior ---------- */
function hud(){const P=me();const t=madrid();const night=isNight(t.h);const S=S_();
  const day=G.cfg?Math.floor((now()-G.cfg.start)/86400000)+1:1;
  let r='';if(P){const R=resOf(WORLD,S,UID,now()),rt=rateOf(WORLD,S,UID,now());const nP=Object.values(S.own||{}).filter(u=>u===UID).length;const sp=spd();
    r=`<div class="res"><span title="Dinero">💶 <b>${fN(R.m)}</b><small>+${Math.round(rt.m*sp)}/h</small></span><span title="Acero">⚙️ <b>${fN(R.s)}</b><small>+${Math.round(rt.s*sp)}/h</small></span><span title="Petróleo">🛢️ <b>${fN(R.o)}</b><small>+${Math.round(rt.o*sp)}/h</small></span><span title="Provincias">🗺️ <b>${nP}</b></span></div>`}
  $('#top').innerHTML=`<a class="logo" href="../">${LOGO}</a>${r}<div class="sp"></div>
  <div class="clock ${night?'night':''}" title="Hora de Madrid"><b>${t.t}</b><small>${night?'🌙 Noche · +25 % ataque':'☀️ Día'} · Día ${day}/30</small></div>
  ${P?`<button class="ib" id="inv" title="Inventario de bases">📦</button><button class="ib" id="frc" title="Mis fuerzas">🎖️</button><button class="ib" id="home" title="Ir a mi capital">★</button>`:''}
  ${ROOTADMIN?'<button class="ib" id="adm" title="Administración">⚙</button>':''}`;
  $('#adm')&&($('#adm').onclick=adminPanel);$('#inv')&&($('#inv').onclick=invPanel);$('#frc')&&($('#frc').onclick=forcesPanel);
  $('#home')&&($('#home').onclick=()=>{const hq=Object.values(S.b||{}).find(b=>b.o===UID&&b.t==='hq');const p=WORLD.prov[P.cap];if(hq)centerOn(hq.x,hq.y,9);else if(p)centerOn(p.x,p.y,4)})}
function legend(){const L=$('#legend');const S=S_();const pl=Object.entries(S.pl||{});const own=Object.values(S.own||{});L.innerHTML=`<div class="lt">Naciones · ${pl.length}</div>`+(pl.length?pl.map(([u,p])=>`<button data-u="${u}"><i style="background:${p.col}"></i>${esc(p.n)}<b>${own.filter(x=>x===u).length}</b></button>`).join(''):'<p class="mu sm">Nadie ha desplegado todavía.</p>');
  L.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const p=WORLD.prov[S.pl[b.dataset.u].cap];if(p)centerOn(p.x,p.y,1.4)})}
/* avisos de batallas */
let SEENLG=null;function newLogs(){const S=S_();const ks=Object.keys(S.lg||{});if(SEENLG===null){SEENLG=new Set(ks);return}
  for(const k of ks){if(SEENLG.has(k))continue;SEENLG.add(k);const l=S.lg[k];const pv=WORLD.prov[l.pv];const pn=pv?pv.name:'';
    if(l.k==='b'){if(l.a===UID)toast(l.w?`⚔️ ¡Victoria en ${esc(pn)}! Provincia conquistada. Bajas: ${l.la}`:`⚔️ Ataque fallido en ${esc(pn)}. Bajas: ${l.la}`,l.w?'ok':'bad');
      else if((l.d||[]).includes(UID))toast(l.w?`🚨 ¡${esc(nameOf(l.a))} ha conquistado ${esc(pn)}!`:`🛡️ Has rechazado un ataque de ${esc(nameOf(l.a))} en ${esc(pn)}`,l.w?'bad':'ok')}
    else if(l.a===UID)toast(`✈️ Ataque completado: ${l.hits} objetivo(s) alcanzado(s)`,'ok')}}

/* ---------- admin ---------- */
function adminPanel(){const m=$('#modal');const c=G.cfg||{};m.innerHTML=`<div class="mbox"><div class="ph"><div><small>Solo administrador</small><h3>Mando central</h3></div><button class="x" data-x>✕</button></div>
  <label class="fl">Velocidad de la partida (×)<input id="asp" type="number" min="0.25" max="60" step="0.25" value="${c.speed||1}"></label>
  <div class="row"><button class="btn" id="asv">Guardar velocidad</button><button class="btn" id="agift">Darme recursos de prueba</button></div>
  <div class="sec">Mapa</div><p class="mu sm">Semilla actual: <b>${c.seed}</b> · Temporada ${c.season||1}. Generar otro continente borra todos los países.</p>
  <div class="row"><button class="btn" id="aprev">Ver otro mapa</button><button class="btn bad" id="anew">Nueva temporada con este mapa</button></div>
  <p class="mu sm" id="aseed"></p></div>`;m.classList.remove('hide');
  let pending=null;
  m.querySelector('[data-x]').onclick=()=>{m.classList.add('hide');if(pending!=null){G.cfg.seed=c.seed;rebuild()}};
  m.querySelector('#asv').onclick=async()=>{await adminSet({speed:Math.max(.25,Math.min(60,+$('#asp').value||1))});toast('Velocidad guardada','ok')};
  m.querySelector('#agift').onclick=()=>act(adminGift,'+5000 💶 · +2500 ⚙️ · +1500 🛢️');
  m.querySelector('#aprev').onclick=()=>{pending=Math.floor(Math.random()*1e6);G.cfg.seed=pending;rebuild();$('#aseed').innerHTML=`Vista previa de la semilla <b>${pending}</b>. Pulsa “Nueva temporada” para usarla.`};
  m.querySelector('#anew').onclick=async()=>{const s=pending!=null?pending:c.seed;if(!confirm('¿Empezar una nueva temporada? Se borrarán todos los países, bases y tropas.'))return;pending=null;await adminReset(s);m.classList.add('hide');toast('Nueva temporada iniciada','ok')}}
function rebuild(){gate('loading','Generando el continente…');setTimeout(()=>{buildWorld();OWNKEY='';refreshOwners();showApp();sync()},40)}

/* ---------- arranque ---------- */
function sync(){if(!WORLD)return;DEPLOY=!!(G.cfg&&UID&&!(S_().pl&&S_().pl[UID]));$('#app').classList.toggle('deploying',DEPLOY);
  hud();legend();if(!PREV&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))panel();DIRTY=true}
function showApp(){$('#gate').classList.add('hide');$('#app').classList.remove('hide');resize()}
function start(){gate('loading');bindInput();loadImgs(()=>{DIRTY=true});
  netInit(s=>{if(s!=='in')gate(s)});
  onG(w=>{if(w==='world'){rebuild();return}if(!WORLD)return;
    if(w==='state'){refreshOwners();newLogs();if(SELP>=0&&ZC()<ZT)SELC=renderSel(WORLD,SELP)}
    sync()});
  setInterval(()=>{if(G.cfg&&WORLD){hud();tick()}},1000);
  setInterval(()=>{DIRTY=true;if(WORLD&&!PREV&&(SELU.length||SELB)&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))panel()},5000);
  setInterval(()=>{if(Object.values(S_().u||{}).some(u=>u.p)||Object.keys(S_().st||{}).length)DIRTY=true},120);
  loop()}
document.addEventListener('DOMContentLoaded',start);
</script>
</body>
</html>
