  v.innerHTML=`<div class="h1"><div><h2>Contratos</h2><p>Entrega 10 artículos de la misma rareza y recibe 1 de la rareza siguiente. Con 5 encubiertos puedes conseguir un <b style="color:var(--gold)">★ cuchillo o guantes</b>.</p></div></div>
  <div class="ctr" id="ctr">${[...Array(need)].map((_,i)=>{const it=ME.inv[CTR.sel[i]];return it?`<div class="cs f" style="--rc:${rc(rarOf(it))}">${imgTag(it)}</div>`:`<div class="cs">${i+1}</div>`}).join('')}</div>
  <div class="row wrap" style="margin-bottom:14px"><button class="btn" id="cPick">Elegir artículos</button>${CTR.sel.length?`<button class="btn" id="cClr">Vaciar</button>`:''}<span class="grow"></span>
    ${r!=null?`<span class="chip" style="color:${RAR[r].c}">${RAR[r].n} → <b style="color:${RAR[Math.min(6,r+1)].c}">${RAR[Math.min(6,r+1)].n}</b></span><span class="chip">Float medio ${avgF.toFixed(3)}</span><span class="chip">Entregas <span class="cr">${fmt(val)}</span></span>`:''}
    <button class="btn pri" id="cGo" ${CTR.sel.length===need?'':'disabled'}>Firmar contrato</button></div>
  ${r!=null?`<h3 style="margin:14px 0 10px">Posibles resultados</h3><div class="items">${ctrPool().map(c=>itemCard({id:'',w:c.w,s:c.s,f:avgF||.2},{mini:1})).join('')}</div>`:''}`;
  $('#cPick').onclick=()=>pickItems({max:need===5&&r===5?5:10,pre:CTR.sel,title:'Elige artículos de la misma rareza',hint:'Común a Encubierto',filter:it=>rarOf(it)<=5,lock:(it,sel)=>{if(!sel.size)return false;const r0=rarOf(ME.inv[[...sel][0]]);return rarOf(it)!==r0||sel.size>=ctrNeed(r0)},cb:ids=>{CTR.sel=ids;pageContracts();pumpImgs()}});
  if($('#cClr'))$('#cClr').onclick=()=>{CTR.sel=[];pageContracts()};$('#cGo').onclick=()=>doContract()}
function ctrPool(){const its=CTR.sel.map(id=>ME.inv[id]);const r=rarOf(its[0])+1;const cases=[...new Set(its.map(i=>i.o).filter(o=>CASE[o]))];const pool=[];
  (cases.length?cases:CASES.map(c=>c.id)).forEach(cid=>{const cs=CASE[cid];if(r===6)cs.g.forEach(([w,s])=>pool.push(CAT[w+'|'+s]));else cs.i.filter(e=>e[2]===r).forEach(([w,s])=>pool.push(CAT[w+'|'+s]))});
  if(!pool.length)CATL.filter(c=>c.r===r).forEach(c=>pool.push(c));return[...new Set(pool)]}
async function doContract(){const ids=CTR.sel.filter(id=>ME.inv[id]);const its=ids.map(id=>ME.inv[id]);if(its.length!==ctrNeed(rarOf(its[0])))return;SND.init();BUSY=true;$('#cGo').disabled=true;
  const pool=ctrPool();const pick=pool[Math.floor(rnd()*pool.length)];const avgF=its.reduce((a,i)=>a+i.f,0)/its.length;const f=+Math.min(.999,Math.max(0,avgF*(.85+rnd()*.3))).toFixed(5);
  const st=its.every(i=>i.st)?1:0;const out={id:uid(),w:pick.w,s:pick.s,f,st,o:'contrato',t:Date.now()};
  await removeItems(ids);await addItems([out]);$('#ctr').classList.add('go');SND.whoosh();await sleep(1300);
  CTR.sel=[];BUSY=false;const r=rarOf(out);SND.reveal(r);celebrate(r);
  modal(`<div class="lvup"><h3>Contrato firmado</h3><p class="mu">Has recibido:</p><div style="margin:14px auto;max-width:280px">${itemCard(out)}</div><button class="btn pri" data-close>Genial</button></div>`);pageContracts();pumpImgs()}

/* ---------- RANKING ---------- */
let RKT='v';
function pageRanking(){const v=$('#view');v.innerHTML=`<div class="h1"><div><h2>Ranking</h2><p>Los mejores jugadores de MCF Drop.</p></div></div>
  <div class="tabs">${[['v','Valor del inventario'],['b','Mejor drop'],['o','Cajas abiertas'],['l','Nivel']].map(([k,n])=>`<button class="chip ${RKT===k?'on':''}" data-k="${k}">${n}</button>`).join('')}</div><div class="rk" id="rkl"><div class="loader"></div></div>`;
  $$('[data-k]').forEach(b=>b.onclick=()=>{RKT=b.dataset.k;pageRanking()});
  pageListen(R_('rank'),'value',s=>{const L=Object.entries(s.val()||{}).sort((a,b)=>(b[1][RKT]||0)-(a[1][RKT]||0)).slice(0,100);
    $('#rkl').innerHTML=L.map(([u,p],i)=>`<div class="r ${u===UID?'me':''}"><span class="pos">${i+1}</span><div><b>${esc(p.n)}${u===UID?' (tú)':''}</b><small>Nivel ${p.l||1}${RKT==='b'&&p.bn?' · '+esc(p.bn):''}</small></div><b class="${RKT==='o'||RKT==='l'?'':'cr'}">${fmt(p[RKT]||0)}</b></div>`).join('')||'<div class="empty panel">Aún no hay nadie.</div>'})}

/* ---------- RECOMPENSA DIARIA ---------- */
function dailyModal(){const left=86400000-(now()-(ME.ld||0));
  if(left>0){const h=Math.floor(left/3600000),m=Math.floor(left%3600000/60000);modal(`<div class="lvup"><div class="ring">🎁</div><h3>Recompensa diaria</h3><p class="mu">Ya la has reclamado hoy. Vuelve en <b>${h} h ${m} min</b>.</p><p class="mu" style="margin-top:8px">Mientras tanto: sube de nivel abriendo cajas para conseguir créditos y cajas gratis.</p><button class="btn pri" data-close style="margin-top:14px">Vale</button></div>`);return}
  modal(`<div class="lvup"><h3>Rueda diaria</h3><p class="mu">Gira la rueda una vez al día. ¡Puede tocar una caja gratis!</p><div class="wheel"><div class="pin"></div><canvas id="wh" width="680" height="680"></canvas></div><button class="btn gold big" id="spin">Girar</button></div>`);
  const cv=$('#wh'),x=cv.getContext('2d'),N=DAILY_WHEEL.length,cols=['#1d1d22','#2a2a32'];x.translate(340,340);
  for(let i=0;i<N;i++){const a0=-Math.PI/2+i*2*Math.PI/N-Math.PI/N,a1=a0+2*Math.PI/N;const val=DAILY_WHEEL[i];const special=typeof val==='string'||val>=1000;
    x.beginPath();x.moveTo(0,0);x.arc(0,0,330,a0,a1);x.closePath();x.fillStyle=special?(typeof val==='string'?'#4b69ff':'#a8730a'):cols[i%2];x.fill();x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;x.stroke();
    x.save();x.rotate((a0+a1)/2);x.textAlign='right';x.textBaseline='middle';x.fillStyle='#fff';x.font='800 30px Inter,system-ui';x.fillText(typeof val==='string'?'CAJA':fmt(val),300,0);x.restore()}
  x.beginPath();x.arc(0,0,58,0,7);x.fillStyle='#f4f4f5';x.fill();x.fillStyle='#0b0b0d';x.font='900 30px Inter,system-ui';x.textAlign='center';x.textBaseline='middle';x.fillText('MCF',0,2);
  $('#spin').onclick=async()=>{SND.init();$('#spin').disabled=true;const tr=await R_('users/'+UID+'/ld').transaction(v=>{if(now()-(v||0)<86400000)return;return now()});if(!tr.committed){toast('Ya la has reclamado','bad');closeModal();return}
    const idx=Math.floor(rnd()*N);const turns=6*360+(360-idx*360/N)+(rnd()-.5)*(300/N);cv.style.transform=`rotate(${turns}deg)`;
    let k=0;const iv=setInterval(()=>{SND.tick();if(++k>40)clearInterval(iv)},Math.max(30,110));
    await sleep(5700);clearInterval(iv);const val=DAILY_WHEEL[idx];
    if(typeof val==='string'){await R_('users/'+UID+'/freebox/'+val).transaction(v=>(v||0)+1);SND.reveal(4);celebrate(4);$('#spin').outerHTML=`<p style="font-size:20px;font-weight:850">¡Una ${esc(CASE[val].n)} gratis!</p><a class="btn pri" href="#caja/${val}" data-close style="margin-top:10px">Abrirla ahora</a>`}
    else{await addCredits(val);SND.coin();celebrate(val>=1000?5:3);$('#spin').outerHTML=`<p style="font-size:22px;font-weight:850">+<span class="cr">${fmt(val)}</span></p><button class="btn pri" data-close style="margin-top:10px">A gastarlos</button>`}}}
function levelUpModal(w){SND.lvl();celebrate(5);modal(`<div class="lvup"><div class="ring">${w.levelUp}</div><h3>¡Subes de nivel!</h3><p class="mu">Recompensa: <span class="cr">${fmt(w.c)}</span>${w.boxes&&w.boxes.length?` y ${w.boxes.map(b=>esc(CASE[b].n)).join(', ')} gratis`:''}</p><button class="btn pri" data-close style="margin-top:14px">Seguir</button></div>`)}
function levelInfo(){const L=levelOf(ME.xp);modal(`<div class="lvup"><div class="ring">${L.l}</div><h3>Nivel ${L.l}</h3><p class="mu">${fmt(L.cur)} / ${fmt(L.need)} XP para el nivel ${L.l+1}. Ganas XP abriendo cajas.</p><p class="mu" style="margin-top:8px">Siguiente recompensa: <span class="cr">${fmt(levelReward(L.l+1).c)}</span>${levelReward(L.l+1).box?' + caja gratis':''}</p><button class="btn pri" data-close style="margin-top:14px">Vale</button></div>`)}
function profileModal(){const items=Object.values(ME.inv);const v=items.reduce((a,it)=>a+itemValue(it),0);
  modal(`<h3>${esc(ME.n)}</h3><p class="mu">${esc(FBUSER&&FBUSER.email||'')}</p><div class="kv"><span>Nivel</span><b>${levelOf(ME.xp).l}</b><span>Créditos</span><b class="cr">${fmt(ME.c)}</b><span>Inventario</span><b><span class="cr">${fmt(v)}</span> · ${items.length} artículos</b><span>Cajas abiertas</span><b>${fmt(ME.op)}</b><span>Mejor drop</span><b>${esc(ME.bestN||'—')}</b></div>
  <div class="row" style="margin:14px 0"><input class="inp grow" id="nn" value="${esc(ME.n)}" maxlength="20"><button class="btn" id="nsave">Cambiar nombre</button></div>
  <div class="row wrap"><button class="btn" id="mute">${SND.muted?'🔇 Activar sonido':'🔊 Silenciar'}</button><a class="btn" href="../">← MCF Games</a><button class="btn bad" id="out">Cerrar sesión</button></div>`);
  $('#nsave').onclick=async()=>{const n=cleanName($('#nn').value);await R_('users/'+UID+'/n').set(n);toast('Nombre cambiado','ok');closeModal();buildShell()};
  $('#mute').onclick=()=>{SND.muted=!SND.muted;LSS('muted',SND.muted);profileModal()};$('#out').onclick=()=>AUTH.signOut()}

/* ---------- ADMIN ---------- */
const ADMS={u:null,q:'',users:{}};
async function pageAdmin(){if(!STAFF){location.hash='#cajas';return}const v=$('#view');v.innerHTML=`<div class="h1"><div><h2>Panel de admin</h2><p>Créditos, artículos, eventos, moderación y permisos.</p></div><button class="btn" id="arf">Actualizar</button></div><div id="admb"><div class="loader"></div></div>`;
  $('#arf').onclick=()=>pageAdmin();const s=await R_('users').once('value');ADMS.users=s.val()||{};const st=await R_('staff').once('value');ADMS.staff=st.val()||{};if(!ADMS.u)ADMS.u=UID;admDraw()}
function admDraw(){const U=ADMS.users;const L=Object.entries(U).filter(([u,x])=>!ADMS.q||String(x.n||'').toLowerCase().includes(ADMS.q)).sort((a,b)=>(b[1].c||0)-(a[1].c||0));const sel=U[ADMS.u]||{};
  const inv=Object.entries(sel.inv||{}).map(([k,raw])=>{const it=dec(raw);if(it)it.id=k;return it}).filter(Boolean).sort((a,b)=>itemValue(b)-itemValue(a));const iv=inv.reduce((a,it)=>a+itemValue(it),0);
  $('#admb').innerHTML=`<div class="adm"><div><input class="inp" id="aq" placeholder="Buscar jugador…" value="${esc(ADMS.q)}" style="width:100%;margin-bottom:8px"><div class="ul">${L.map(([u,x])=>`<button class="${u===ADMS.u?'on':''}" data-au="${u}"><span>${esc(x.n||'?')} ${ADMS.staff[u]?'<span class="badge st">STAFF</span>':''}${x.ban?' <span class="badge">BLOQ.</span>':''}${u===UID?' (tú)':''}</span><span class="cr">${fmt(x.c||0)}</span></button>`).join('')}</div></div>
  <div><div class="card"><div class="row wrap"><div class="grow"><h3 style="font-size:20px">${esc(sel.n||'?')}${ADMS.u===UID?' (tú)':''}</h3><small class="mu">Nivel ${levelOf(sel.xp||0).l} · ${fmt(sel.op||0)} cajas · inventario <span class="cr">${fmt(iv)}</span> · ${inv.length} artículos</small></div></div>
    <h4 style="margin-top:14px">Créditos: <span class="cr">${fmt(sel.c||0)}</span></h4><div class="row wrap">${[1000,10000,100000,1000000].map(k=>`<button class="btn sm" data-ac="${k}">+${fmt(k)}</button>`).join('')}<input class="inp" id="acv" type="number" placeholder="Fijar exacto" style="width:140px"><button class="btn sm" id="acs">Fijar</button></div>
    <h4 style="margin-top:14px">Dar artículo</h4><div class="row wrap"><select class="inp" id="agi" style="max-width:260px">${CATL.slice().sort((a,b)=>b.r-a.r||(WPN[a.w].n+SKIN[a.s].n).localeCompare(WPN[b.w].n+SKIN[b.s].n)).map(c=>`<option value="${c.k}">${isGold(c.w)?'★ ':''}${esc(WPN[c.w].n)} | ${esc(SKIN[c.s].n)} (${RAR[c.r].n} · ${DEF[c.w].usd} $)</option>`).join('')}</select>
      <select class="inp" id="agw">${WEAR.map((W,i)=>`<option value="${i}">${W.n}</option>`).join('')}</select><label class="tog" id="agst"><i></i>ST™</label><button class="btn sm pri" id="ag">Dar</button><button class="btn sm" id="agall">Uno de cada ★ (cuchillos y guantes)</button><button class="btn sm" id="agjk">Todas las joyas +1.000 $</button></div>
    <h4 style="margin-top:14px">Cajas gratis</h4><div class="row wrap"><select class="inp" id="afb">${CASES.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</select><button class="btn sm" data-fb="1">+1</button><button class="btn sm" data-fb="10">+10</button></div>
    <h4 style="margin-top:14px">Moderación</h4><div class="row wrap"><button class="btn sm ${sel.ban?'ok':'bad'}" id="aban" ${ADMS.u===UID?'disabled':''}>${sel.ban?'Desbloquear':'Bloquear'}</button><button class="btn sm bad" id="arst">Reiniciar cuenta</button>
      <button class="btn sm ${ADMS.staff[ADMS.u]?'bad':''}" id="astf" ${ADMS.u===UID?'disabled':''}>${ADMS.staff[ADMS.u]?'Quitar permisos de admin':'Hacer admin (acceso total)'}</button></div></div>
  <div class="card"><h4>Inventario (toca un artículo para quitarlo)</h4><div class="items" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${inv.map(it=>itemCard(it,{mini:1,attr:'data-take="1"'})).join('')||'<span class="mu">Vacío</span>'}</div></div>
  <div class="card"><h4>Evento global</h4><p class="mu" style="margin-bottom:10px">${eventOn()&&(luckNow()>1||discNow()||CFG.xp2)?'Hay un evento activo.':'No hay evento activo.'}</p>
    <div class="row wrap"><label class="mu">Suerte</label><select class="inp" id="el">${[1,1.5,2,3,5,10].map(k=>`<option value="${k}" ${+CFG.luck===k?'selected':''}>x${k}</option>`).join('')}</select>
    <label class="mu">Descuento</label><select class="inp" id="ed">${[0,.1,.25,.5,.75].map(k=>`<option value="${k}" ${+CFG.disc===k?'selected':''}>${k*100}%</option>`).join('')}</select>
    <label class="tog ${CFG.xp2?'on':''}" id="ex"><i></i>XP doble</label><select class="inp" id="eh">${[1,3,6,12,24,48,168].map(h=>`<option value="${h}">${h<24?h+' h':h/24+' días'}</option>`).join('')}</select></div>
    <div class="row" style="margin-top:8px"><input class="inp grow" id="em" placeholder="Mensaje del evento (opcional)" value="${esc(CFG.msg||'')}"><button class="btn pri" id="eon">Activar</button><button class="btn" id="eoff">Terminar</button></div></div></div></div>`;
  const U_=ADMS.u;const re=async()=>{const s=await R_('users/'+U_).once('value');ADMS.users[U_]=s.val()||{};admDraw();pumpImgs()};
  let qt;$('#aq').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{ADMS.q=e.target.value.toLowerCase();admDraw();const q=$('#aq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},250)};
  $$('[data-au]').forEach(b=>b.onclick=()=>{ADMS.u=b.dataset.au;admDraw();pumpImgs()});
  $$('[data-ac]').forEach(b=>b.onclick=async()=>{await ADM.credits(U_,+b.dataset.ac);toast('Créditos añadidos','ok');re()});
  $('#acs').onclick=async()=>{const v=+$('#acv').value;if(v>=0){await ADM.setCredits(U_,v);toast('Créditos fijados','ok');re()}};
  let ast=0;$('#agst').onclick=()=>{ast=ast?0:1;$('#agst').classList.toggle('on',!!ast)};
  $('#ag').onclick=async()=>{const[w,s]=$('#agi').value.split('|');const W=WEAR[+$('#agw').value];await ADM.give(U_,{id:uid(),w,s,f:isNW(w)?0:+(W.a+(W.b-W.a)*rnd()).toFixed(5),st:isNW(w)||DEF[w].st0?0:ast,o:'regalo',t:Date.now()});toast('Artículo entregado','ok');re()};
  $('#agall').onclick=async()=>{for(const c of CATL.filter(c=>c.r===6&&isGold(c.w)))await ADM.give(U_,{id:uid(),w:c.w,s:c.s,f:+(rnd()*.07).toFixed(5),st:DEF[c.w].t==='Cuchillo'&&!DEF[c.w].st0?1:0,o:'regalo',t:Date.now()});toast('Entregados todos los ★','ok');re()};
  $('#agjk').onclick=async()=>{for(const c of CATL.filter(c=>c.r===6&&!isGold(c.w)))await ADM.give(U_,{id:uid(),w:c.w,s:c.s,f:defF(c.w),st:0,o:'regalo',t:Date.now()});toast('Entregadas todas las joyas','ok');re()};
  $$('[data-fb]').forEach(b=>b.onclick=async()=>{await ADM.freebox(U_,$('#afb').value,+b.dataset.fb);toast('Cajas gratis añadidas','ok');re()});
  $('#aban').onclick=async()=>{await ADM.ban(U_,!ADMS.users[U_].ban);re()};
  $('#arst').onclick=()=>{modal(`<h3>¿Reiniciar la cuenta de ${esc(ADMS.users[U_].n)}?</h3><p class="mu">Se borra el inventario y vuelve a 1.000 créditos y nivel 1. No se puede deshacer.</p><div class="row end" style="margin-top:14px"><button class="btn" data-close>Cancelar</button><button class="btn bad" id="rsy">Reiniciar</button></div>`);$('#rsy').onclick=async()=>{await ADM.reset(U_);closeModal();toast('Cuenta reiniciada','ok');re()}};
  $('#astf').onclick=async()=>{const on=!ADMS.staff[U_];await ADM.staff(U_,on);ADMS.staff[U_]=on||undefined;toast(on?'Ahora es admin':'Ya no es admin','ok');admDraw()};
  $$('[data-take]').forEach(b=>b.onclick=async()=>{await ADM.take(U_,b.dataset.iid);toast('Artículo quitado');re()});
  let ex=!!CFG.xp2;$('#ex').onclick=()=>{ex=!ex;$('#ex').classList.toggle('on',ex)};
  $('#eon').onclick=async()=>{await ADM.config({luck:+$('#el').value,disc:+$('#ed').value,xp2:ex?1:0,msg:$('#em').value.slice(0,120),until:now()+(+$('#eh').value)*3600000});toast('Evento activado para todos','ok');admDraw()};
  $('#eoff').onclick=async()=>{await ADM.config({luck:1,disc:0,xp2:0,msg:'',until:0});toast('Evento terminado');admDraw()}}

/* ---------- inicio ---------- */
document.addEventListener('pointerdown',()=>SND.init(),{once:true});
function boot(){showGate('loading');
  if(!window.firebase){showGate('out');$('#gate p').innerHTML='No se ha podido conectar con el servidor. Comprueba tu conexión y recarga.';return}
  netInit((st,e)=>{if(st==='out')showGate('out');else if(st==='loading')showGate('loading');else if(st==='error')showGate('error',e)});
  on(w=>{if(w==='first'){if(ME.ban){showGate('ban');return}showApp();if(ME.fresh){setTimeout(()=>modal(`<div class="lvup"><div class="ring">🎁</div><h3>¡Bienvenido a MCF Drop, ${esc(ME.n)}!</h3><p class="mu">Te regalamos <span class="cr">1.000</span> créditos para empezar. Abre tu primera caja, gira la rueda diaria y sube de nivel para ganar más.</p><a class="btn pri" href="#caja/${CASES[6].id}" data-close style="margin-top:14px">Abrir mi primera caja</a></div>`),600)}}})}
boot();
</script>
</body>
