<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MCF Drop</title>
<meta name="theme-color" content="#08080a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{--bg:#08080a;--p1:#101013;--p2:#16161a;--p3:#1f1f25;--p4:#2a2a32;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f4f4f5;--mu:#8e8e98;--mu2:#5f5f69;
  --r0:#b0c3d9;--r1:#5e98d9;--r2:#4b69ff;--r3:#8847ff;--r4:#d32ce6;--r5:#eb4b4b;--r6:#ffc93c;--ok:#3ad07a;--bad:#ff5a5f;--gold:#ffc93c;--rad:14px;--top:64px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;user-select:none;-webkit-user-drag:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a2a30;border-radius:10px;border:3px solid var(--bg)}
.hide{display:none!important}
.bgfx{position:fixed;inset:0;z-index:-1;background:radial-gradient(1200px 600px at 80% -10%,rgba(255,255,255,.05),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(255,255,255,.035),transparent 60%),var(--bg)}
.bgfx:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.4px);background-size:24px 24px;mask-image:linear-gradient(#000,transparent 70%)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;background:var(--p3);border:1px solid var(--line);font-weight:650;transition:transform .12s,background .15s,border-color .15s,opacity .15s;white-space:nowrap}
.btn:hover{background:var(--p4);border-color:var(--line2)}.btn:active{transform:scale(.97)}
.btn.pri{background:#f4f4f5;color:#0b0b0d;border-color:#fff}.btn.pri:hover{background:#fff}
.btn.big{height:52px;padding:0 26px;font-size:16px;border-radius:14px}
.btn.gold{background:linear-gradient(180deg,#ffd76a,#e2a521);color:#2a1a00;border-color:#ffe08a;box-shadow:0 8px 30px rgba(255,190,40,.25)}
.btn.ok{background:var(--ok);color:#03210f;border-color:transparent}.btn.bad{background:rgba(255,90,95,.14);color:#ff8a8e;border-color:rgba(255,90,95,.3)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.chip{height:32px;padding:0 12px;border-radius:99px;background:var(--p2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mu);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:#f4f4f5;color:#0b0b0d;border-color:#fff}
.inp{height:40px;padding:0 12px;border-radius:11px;background:var(--p2);border:1px solid var(--line);outline:none;min-width:0}
.inp:focus{border-color:var(--line2);background:var(--p3)}
.cr{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums;font-weight:750}
.cr:before{content:"";width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8,#ffc93c 45%,#a8730a);box-shadow:0 0 0 1.5px rgba(0,0,0,.25) inset}

/* puerta de acceso */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px;text-align:center}
.gate .box{width:min(440px,100%);min-width:0;margin:0 auto}
.gate .logo{margin:0 auto 18px;width:120px;height:120px}
.gate h1{font-size:44px;letter-spacing:-.04em;font-weight:850}
.gate p{color:var(--mu);margin:10px 0 24px;line-height:1.5}
.gate .reel-demo{height:90px;margin:0 0 26px;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--line);background:var(--p1)}
.gate .reel-demo .strip{display:flex;gap:6px;padding:6px;animation:demo 22s linear infinite}
.gate .reel-demo .strip>div{flex:none;width:120px;height:76px;border-radius:9px;background:var(--p2);position:relative;overflow:hidden}
.gate .reel-demo .strip img{width:100%;height:100%;object-fit:contain}
.gate .reel-demo .strip>div:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
@keyframes demo{to{transform:translateX(-50%)}}
.loader{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.1);border-top-color:#fff;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* cabecera */
.top{position:sticky;top:0;z-index:40;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(8,8,10,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:17px;letter-spacing:-.02em;white-space:nowrap}
.brand .mk{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#f4f4f5,#9a9aa3);display:grid;place-items:center;color:#0b0b0d;font-weight:900;font-size:15px;box-shadow:0 4px 18px rgba(255,255,255,.12)}
.brand small{font-weight:600;color:var(--mu);font-size:12px}
.nav{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{height:36px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:7px;color:var(--mu);font-weight:650;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s;position:relative}
.nav a:hover{color:var(--tx);background:var(--p2)}
.nav a.on{color:var(--tx);background:var(--p3)}
.nav a .dot{position:absolute;top:6px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.nav svg{width:17px;height:17px}
.tr{margin-left:auto;display:flex;align-items:center;gap:10px}
.wallet{height:40px;padding:0 14px 0 12px;border-radius:12px;background:var(--p2);border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:15px}
.wallet.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.08);border-color:rgba(255,201,60,.6)}}
.lvl{position:relative;width:40px;height:40px;cursor:pointer}
.lvl svg{width:40px;height:40px;transform:rotate(-90deg)}
.lvl b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:850}
.gift{width:40px;height:40px;border-radius:12px;background:var(--p2);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;position:relative}
.gift.ready{background:linear-gradient(180deg,#ffd76a,#e2a521);border-color:#ffe08a;animation:giftp 1.6s ease-in-out infinite}
@keyframes giftp{50%{box-shadow:0 0 0 6px rgba(255,201,60,.18),0 0 26px rgba(255,201,60,.5);transform:rotate(-6deg) scale(1.05)}}
.me{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 4px;border-radius:12px;background:var(--p2);border:1px solid var(--line);font-weight:650;max-width:170px}
.me .av{width:32px;height:32px;border-radius:9px;background:linear-gradient(145deg,#3a3a44,#1d1d22);display:grid;place-items:center;font-weight:850}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* drops en directo */
.feed{height:74px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
.feed .lbl{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--mu);padding-right:6px;text-transform:uppercase}
.feed .lbl i{width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 10px var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.feed .list{display:flex;gap:8px;overflow:hidden}
.fd{flex:none;width:132px;height:58px;border-radius:10px;background:var(--p1);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:center;animation:fdin .6s cubic-bezier(.2,.9,.3,1.2)}
.fd:before{content:"";position:absolute;inset:0;background:radial-gradient(120px 60px at 50% 120%,var(--rc),transparent 70%);opacity:.32}
.fd:after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc)}
.fd img{width:72px;height:40px;object-fit:contain;position:relative;margin-left:6px}
.fd div{position:relative;font-size:10.5px;line-height:1.25;min-width:0;padding-right:6px}
.fd b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd span{color:var(--mu)}
@keyframes fdin{from{transform:translateX(-60px) scale(.8);opacity:0}}

/* vista */
.view{max-width:1320px;margin:0 auto;padding:22px 18px 110px}
.h1{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 18px;flex-wrap:wrap}
.h1 h2{font-size:28px;font-weight:850;letter-spacing:-.03em}
.h1 p{color:var(--mu);margin-top:4px}
.panel{background:var(--p1);border:1px solid var(--line);border-radius:18px}
.banner{border-radius:18px;padding:16px 20px;margin-bottom:18px;display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,rgba(255,201,60,.16),rgba(255,201,60,.03));border:1px solid rgba(255,201,60,.3)}
.banner b{color:var(--gold)}
.empty{padding:50px 20px;text-align:center;color:var(--mu)}

/* cajas */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.case{position:relative;border-radius:18px;background:var(--p1);border:1px solid var(--line);padding:14px 14px 16px;text-align:left;overflow:hidden;transition:transform .2s,border-color .2s,background .2s}
.case:before{content:"";position:absolute;inset:-40% -20% auto;height:80%;background:radial-gradient(closest-side,var(--cc),transparent);opacity:.18;transition:opacity .25s}
.case:hover{transform:translateY(-4px);border-color:var(--line2);background:var(--p2)}
.case:hover:before{opacity:.38}
.case img{width:100%;aspect-ratio:320/250;object-fit:contain;position:relative;transition:transform .35s cubic-bezier(.2,.9,.3,1.3);filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))}
.case:hover img{transform:scale(1.06) rotate(-2deg)}
.case h3{position:relative;font-size:16px;font-weight:800;margin-top:6px}
.case p{position:relative;color:var(--mu);font-size:12.5px;margin:3px 0 12px;min-height:34px;line-height:1.4}
.case .row{position:relative;display:flex;align-items:center;justify-content:space-between}
.case .free{position:absolute;top:12px;left:12px;z-index:2;background:var(--ok);color:#03210f;font-size:11px;font-weight:850;padding:4px 8px;border-radius:99px}
.case .tag{position:absolute;top:12px;right:12px;z-index:2;font-size:11px;font-weight:800;padding:4px 8px;border-radius:99px;background:rgba(255,201,60,.16);color:var(--gold);border:1px solid rgba(255,201,60,.3)}
.price{height:34px;padding:0 12px;border-radius:10px;background:var(--p3);display:inline-flex;align-items:center;font-size:14px}
.price s{color:var(--mu2);margin-right:4px;font-size:12px}

/* abrir caja */
.opener{display:grid;grid-template-columns:1fr;gap:18px}
.stage{position:relative;border-radius:22px;overflow:hidden;background:radial-gradient(700px 300px at 50% 0%,rgba(255,255,255,.05),transparent),var(--p1);border:1px solid var(--line);padding:22px;min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.stage .glow{position:absolute;inset:0;background:radial-gradient(500px 260px at 50% 45%,var(--cc),transparent 70%);opacity:.22;pointer-events:none}
.stage .bigcase{width:min(360px,80%);position:relative;filter:drop-shadow(0 30px 40px rgba(0,0,0,.6));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-1.5deg)}}
.stage .bigcase.shake{animation:shake .7s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-2px,0) rotate(-1deg)}20%,80%{transform:translate(4px,0) rotate(2deg)}30%,50%,70%{transform:translate(-8px,0) rotate(-3deg) scale(1.03)}40%,60%{transform:translate(8px,0) rotate(3deg) scale(1.06)}100%{transform:scale(1.25);opacity:0}}
.stage h2{position:relative;font-size:26px;font-weight:850;letter-spacing:-.03em;margin-top:8px}
.stage .sub{position:relative;color:var(--mu);margin-top:4px}
.controls{position:relative;display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center}
.seg{display:flex;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{width:38px;height:34px;border-radius:9px;font-weight:750;color:var(--mu)}
.seg button.on{background:#f4f4f5;color:#0b0b0d}
.tog{display:flex;align-items:center;gap:8px;color:var(--mu);font-weight:600;font-size:13px;cursor:pointer}
.tog i{width:36px;height:22px;border-radius:99px;background:var(--p4);position:relative;transition:background .2s}
.tog i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on i{background:var(--ok)}.tog.on i:after{transform:translateX(14px)}

/* ruleta */
.reels{display:flex;flex-direction:column;gap:10px;width:100%;position:relative}
.reel{position:relative;height:150px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#0c0c0f,#121216);border:1px solid var(--line)}
.reels.n2 .reel,.reels.n3 .reel{height:120px}.reels.n4 .reel,.reels.n5 .reel{height:96px}
.reel .strip{position:absolute;top:0;bottom:0;left:0;display:flex;gap:6px;padding:8px 0;will-change:transform}
.reel .cell{flex:none;width:var(--cw,170px);height:100%;border-radius:10px;background:linear-gradient(180deg,var(--p2),var(--p1));position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.04)}
.reel .cell:before{content:"";position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 110%,var(--rc),transparent 70%);opacity:.35}
.reel .cell:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rc);box-shadow:0 0 14px var(--rc)}
.reel .cell img{position:absolute;inset:6px 6px 10px;width:calc(100% - 12px);height:calc(100% - 16px);object-fit:contain}
.reel .cell.gold{background:linear-gradient(180deg,#3a2c08,#1a1406)}
.reel .cell.gold .q{position:absolute;inset:0;display:grid;place-items:center;font-size:44px;font-weight:900;color:var(--gold);text-shadow:0 0 22px rgba(255,201,60,.7)}
.reels.n4 .reel .cell.gold .q,.reels.n5 .reel .cell.gold .q{font-size:30px}
.reel .mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(180deg,#ffd76a,#fff,#ffd76a);box-shadow:0 0 18px rgba(255,215,106,.9);z-index:3}
.reel .mark:before,.reel .mark:after{content:"";position:absolute;left:50%;margin-left:-9px;border:9px solid transparent}
.reel .mark:before{top:0;border-top-color:#ffd76a}.reel .mark:after{bottom:0;border-bottom-color:#ffd76a}
.reel .fadeL,.reel .fadeR{position:absolute;top:0;bottom:0;width:22%;z-index:2;pointer-events:none}
.reel .fadeL{left:0;background:linear-gradient(90deg,#0b0b0e,transparent)}.reel .fadeR{right:0;background:linear-gradient(-90deg,#0b0b0e,transparent)}
.reel .cell.win{animation:winc 1.2s ease-out forwards;z-index:1}
@keyframes winc{0%{transform:scale(1)}25%{transform:scale(1.08);box-shadow:0 0 0 2px var(--rc),0 0 40px var(--rc)}100%{transform:scale(1.04);box-shadow:0 0 0 2px var(--rc),0 0 30px var(--rc)}}
.flash{position:fixed;inset:0;z-index:90;pointer-events:none;background:radial-gradient(circle at 50% 45%,var(--rc),transparent 65%);animation:flash 1.1s ease-out forwards}
@keyframes flash{0%{opacity:0}12%{opacity:.85}100%{opacity:0}}
.rays{position:fixed;left:50%;top:45%;width:1400px;height:1400px;margin:-700px 0 0 -700px;z-index:89;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,201,60,.16) 0 6deg,transparent 6deg 18deg);animation:rays 3s linear forwards;mask-image:radial-gradient(circle,#000 10%,transparent 60%)}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:rotate(60deg) scale(1.1)}}
canvas.confetti{position:fixed;inset:0;z-index:95;pointer-events:none}

/* tarjeta de artículo */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.it{position:relative;border-radius:14px;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;transform-style:preserve-3d;text-align:left;width:100%}
.it:before{content:"";position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 100%,var(--rc),transparent 70%);opacity:.22;transition:opacity .2s}
.it:hover{border-color:var(--line2);box-shadow:0 16px 40px rgba(0,0,0,.45)}
.it:hover:before{opacity:.4}
.it .im{position:relative;aspect-ratio:5/2.6;display:grid;place-items:center;padding:8px 8px 0}
.it .im img{width:100%;height:100%;object-fit:contain;transition:transform .25s;filter:drop-shadow(0 8px 10px rgba(0,0,0,.4))}
.it:hover .im img{transform:scale(1.07) translateZ(20px)}
.it .sh{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.13) 45%,transparent 60%);transform:translateX(var(--sx,-100%));transition:transform .1s;pointer-events:none}
.it .tx{position:relative;padding:6px 11px 10px}
.it .tx small{display:block;color:var(--mu);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tx b{display:block;font-size:13px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ft{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px}
.it .wr{color:var(--mu);font-weight:700;font-size:11px}
.it .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
.it .stb{position:absolute;top:8px;left:8px;font-size:10px;font-weight:850;padding:2px 6px;border-radius:6px;background:#cf6a32;color:#fff;z-index:1}
.it .sel{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.3);z-index:1;display:grid;place-items:center;font-size:13px;font-weight:900}
.it.on{border-color:#fff;box-shadow:0 0 0 1px #fff inset}
.it.on .sel{background:#fff;color:#000;border-color:#fff}
.it.dim{opacity:.35;pointer-events:none}
.it.mini .im{aspect-ratio:5/2.4}.it.mini .tx{padding:4px 9px 8px}.it.mini .tx b{font-size:12px}

/* resultado */
.result{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;position:relative}
.result .won{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.wonc{width:230px;border-radius:18px;padding:12px;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);position:relative;overflow:hidden;animation:wonin .7s cubic-bezier(.2,.9,.3,1.25) both}
.wonc:before{content:"";position:absolute;inset:0;background:radial-gradient(100% 80% at 50% 100%,var(--rc),transparent 70%);opacity:.45}
.wonc img{position:relative;width:100%;aspect-ratio:5/2;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
.wonc .nm{position:relative;margin-top:6px}.wonc .nm small{color:var(--rc);font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.wonc .nm b{display:block;font-size:15px;margin-top:2px}.wonc .nm span{color:var(--mu);font-size:12px}
.wonc .vv{position:relative;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
@keyframes wonin{from{transform:scale(.5) translateY(30px);opacity:0}}

/* contenido de caja */
.contents h3{font-size:16px;font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.odds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.odds span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--p2);border:1px solid var(--line);display:flex;gap:6px;align-items:center}
.odds i{width:9px;height:9px;border-radius:3px;background:var(--rc)}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--p1);border:1px solid var(--line2);border-radius:22px;padding:22px;position:relative;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
.mbox.wide{width:min(980px,100%)}
@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}}
.mbox .x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:10px;background:var(--p3);font-size:18px;color:var(--mu)}
.mbox h3{font-size:22px;font-weight:850;letter-spacing:-.02em;margin-bottom:6px}
.mbox .mu{color:var(--mu);line-height:1.5}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.row.end{justify-content:flex-end}.grow{flex:1}
.inspect{position:relative;border-radius:16px;background:radial-gradient(80% 90% at 50% 100%,var(--rcA),transparent 70%),linear-gradient(180deg,#141418,#0d0d10);border:1px solid var(--line);perspective:900px;height:260px;display:grid;place-items:center;overflow:hidden;cursor:grab;margin:12px 0}
.inspect img{width:92%;transition:transform .08s;filter:drop-shadow(0 26px 24px rgba(0,0,0,.55))}
.floatbar{position:relative;height:8px;border-radius:8px;background:linear-gradient(90deg,#3ad07a 0 7%,#7cd03a 7% 15%,#d0c43a 15% 38%,#d0863a 38% 45%,#d04a3a 45%);margin:16px 0 6px}
.floatbar i{position:absolute;top:-5px;width:3px;height:18px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:12px 0}
.kv span{color:var(--mu)}

/* toasts */
.toasts{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--p2);border:1px solid var(--line2);border-radius:12px;padding:11px 14px;box-shadow:0 14px 40px rgba(0,0,0,.5);font-weight:600;max-width:340px;animation:tin .35s cubic-bezier(.2,.9,.3,1.3)}
.toast.ok{border-color:rgba(58,208,122,.4)}.toast.bad{border-color:rgba(255,90,95,.45)}
@keyframes tin{from{transform:translateY(20px) scale(.9);opacity:0}}

/* tabs internas */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}

/* mercado */
.mk .it .tx .ft .cr{font-size:13px}
.lst-seller{font-size:11px;color:var(--mu);margin-top:4px}

/* intercambios */
.tradecols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tradecols .panel{padding:12px;min-height:200px}
.tradecols h4{font-size:13px;color:var(--mu);margin-bottom:10px;display:flex;justify-content:space-between}
.tcard{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--p1);border:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.tcard .side{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tcard .side img{width:82px;height:38px;object-fit:contain;background:var(--p2);border-radius:8px;border-bottom:2px solid var(--rc)}
.tcard .arrow{font-size:20px;color:var(--mu)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pl{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--p1);border:1px solid var(--line);text-align:left}
.pl:hover{background:var(--p2)}
.pl .av{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#3a3a44,#1d1d22);display:grid;place-items:center;font-weight:850}
.pl small{display:block;color:var(--mu);font-size:12px}

/* batallas */
.blist{display:flex;flex-direction:column;gap:10px}
.bcard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--p1);border:1px solid var(--line);flex-wrap:wrap}
.bcard .bc{display:flex;gap:4px}
.bcard .bc img{width:54px;height:42px;object-fit:contain}
.bcard .slots{display:flex;gap:6px}
.bcard .slot{width:34px;height:34px;border-radius:10px;background:var(--p3);display:grid;place-items:center;font-weight:800;font-size:12px;border:1px dashed var(--line2)}
.bcard .slot.f{border-style:solid;background:linear-gradient(145deg,#3a3a44,#1d1d22)}
.bstate{font-size:11px;font-weight:800;padding:4px 8px;border-radius:99px;background:var(--p3);color:var(--mu)}
.bstate.run{background:rgba(255,90,95,.16);color:#ff8a8e}.bstate.open{background:rgba(58,208,122,.14);color:var(--ok)}
.arena{display:grid;gap:10px}
.arena .col{background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:10px;position:relative;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.arena .col.win{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 40px rgba(255,201,60,.25)}
.arena .col.lose{opacity:.55}
.arena .who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.arena .who .av{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,#3a3a44,#1d1d22);display:grid;place-items:center;font-weight:850;font-size:12px}
.arena .who b{flex:1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vreel{position:relative;height:150px;border-radius:12px;overflow:hidden;background:#0c0c0f;border:1px solid var(--line)}
.vreel .vstrip{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;gap:6px;padding:0 6px;will-change:transform}
.vreel .vcell{flex:none;height:70px;border-radius:9px;background:var(--p2);position:relative;overflow:hidden}
.vreel .vcell:after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc)}
.vreel .vcell img{width:100%;height:100%;object-fit:contain;padding:4px}
.vreel .vcell.gold .q{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--gold)}
.vreel .hl{position:absolute;left:0;right:0;top:50%;height:74px;margin-top:-37px;border:2px solid rgba(255,215,106,.85);border-radius:11px;box-shadow:0 0 20px rgba(255,215,106,.35);z-index:2;pointer-events:none}
.vreel .fT,.vreel .fB{position:absolute;left:0;right:0;height:30%;z-index:1;pointer-events:none}
.vreel .fT{top:0;background:linear-gradient(#0c0c0f,transparent)}.vreel .fB{bottom:0;background:linear-gradient(transparent,#0c0c0f)}
.arena .got{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.arena .got div{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 6px;border-radius:8px;background:var(--p2);border-left:3px solid var(--rc);animation:fdin .4s}
.arena .got img{width:44px;height:22px;object-fit:contain}
.arena .got span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arena .total{font-size:18px;font-weight:850;margin-top:8px;text-align:center}
.bhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.rounds{display:flex;gap:6px}
.rounds div{width:54px;height:46px;border-radius:10px;background:var(--p2);border:1px solid var(--line);display:grid;place-items:center;opacity:.45;transition:all .3s}
.rounds div.cur{opacity:1;border-color:var(--gold);transform:scale(1.08)}.rounds div.done{opacity:.8}
.rounds img{width:44px}
.countdown{font-size:64px;font-weight:900;text-align:center;padding:30px;letter-spacing:-.04em;animation:pop .5s}

/* mejorador */
.upg{display:grid;grid-template-columns:1fr 340px 1fr;gap:16px;align-items:start}
.dial{position:relative;width:300px;height:300px;margin:0 auto}
.dial canvas{width:100%;height:100%}
.dial .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dial .c b{font-size:40px;font-weight:900;letter-spacing:-.03em}
.dial .c span{color:var(--mu);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.slotbox{min-height:150px;border-radius:16px;border:1px dashed var(--line2);display:grid;place-items:center;color:var(--mu);padding:10px;background:var(--p1)}
.mults{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}

/* contratos */
.ctr{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.ctr .cs{aspect-ratio:5/3.6;border-radius:12px;border:1px dashed var(--line2);background:var(--p1);display:grid;place-items:center;color:var(--mu2);font-weight:800;position:relative;overflow:hidden}
.ctr .cs img{width:90%;height:70%;object-fit:contain}
.ctr .cs.f{border-style:solid;border-color:var(--line)}
.ctr .cs.f:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--rc)}
.ctr.go .cs.f{animation:suck 1.2s cubic-bezier(.6,0,.4,1) forwards}
@keyframes suck{to{transform:scale(.2) translateY(40px);opacity:0}}

/* ranking */
.rk{display:flex;flex-direction:column;gap:6px}
.rk .r{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--p1);border:1px solid var(--line)}
.rk .r.me{border-color:var(--line2);background:var(--p2)}
.rk .pos{font-size:18px;font-weight:900;color:var(--mu);text-align:center}
.rk .r:nth-child(1) .pos{color:#ffc93c}.rk .r:nth-child(2) .pos{color:#d6dbe3}.rk .r:nth-child(3) .pos{color:#d58a4e}
.rk small{color:var(--mu);font-size:12px;display:block}

/* rueda diaria */
.wheel{position:relative;width:min(340px,80vw);aspect-ratio:1;margin:10px auto 18px}
.wheel canvas{width:100%;height:100%;transition:transform 5.5s cubic-bezier(.12,.75,.15,1)}
.wheel .pin{position:absolute;left:50%;top:-6px;margin-left:-14px;border:14px solid transparent;border-top:24px solid #fff;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));z-index:2}
.lvup{text-align:center}
.lvup .ring{width:150px;height:150px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:58px;font-weight:900;background:radial-gradient(circle,#2a2a32,#121216);border:3px solid #fff;box-shadow:0 0 50px rgba(255,255,255,.25);animation:lvp 1s cubic-bezier(.2,.9,.3,1.4)}

.adm .ul{max-height:70vh;overflow:auto;display:flex;flex-direction:column;gap:6px}

.adm .card{padding:16px;border-radius:16px;background:var(--p1);border:1px solid var(--line);margin-bottom:12px}
.adm h4{font-size:14px;margin-bottom:10px}
.badge{font-size:10.5px;font-weight:850;padding:3px 7px;border-radius:6px;background:var(--p3);color:var(--mu)}
.badge.st{background:rgba(255,201,60,.16);color:var(--gold)}

/* móvil */
.tabbar{display:none}
@media (max-width:900px){

  .nav{display:none}
  .top{padding:0 12px;gap:8px}

  .me{padding:0 4px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(10,10,12,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:650;color:var(--mu);text-decoration:none;padding:5px 0;border-radius:10px;position:relative}
  .tabbar a.on{color:var(--tx);background:var(--p2)}
  .tabbar svg{width:21px;height:21px}
  .tabbar a .dot{position:absolute;top:3px;right:30%;width:7px;height:7px;border-radius:50%;background:var(--bad)}
  .view{padding:16px 12px 110px}
  .h1 h2{font-size:23px}
  .cases{grid-template-columns:repeat(2,1fr);gap:10px}
  .case{padding:10px 10px 12px}.case p{display:none}.case h3{font-size:14px}
  .items{grid-template-columns:repeat(2,1fr);gap:8px}
  .reel{height:118px}.reel .cell{--cw:130px}
  .upg{grid-template-columns:1fr}
  .tradecols{grid-template-columns:1fr}
  .adm{grid-template-columns:1fr}
  .ctr{grid-template-columns:repeat(5,1fr);gap:5px}
  .feed{height:64px}.fd{width:118px;height:50px}.fd img{width:60px}
  .wallet{padding:0 10px;font-size:14px}
  .stage{padding:16px;min-height:300px}
  .arena{grid-template-columns:repeat(2,minmax(0,1fr))!important}
}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function genFloat(r){let x=r(),acc=0;for(const W of WEAR){acc+=W.p;if(x<acc)return +(W.a+(W.b-W.a)*r()).toFixed(5)}return +(.45+.55*r()).toFixed(5)}

function caseOdds(cs,luck){const p=PROF[cs.prof].slice();const has=p.map((v,i)=>i===6?cs.g.length>0:cs.i.some(x=>x[2]===i));
  for(let i=0;i<7;i++){if(!has[i])p[i]=0;if(i>=4&&luck>1)p[i]*=luck}const t=p.reduce((a,b)=>a+b,0);return p.map(v=>v/t)}

function rollCase(cs,r,luck){const od=caseOdds(cs,luck||1);let x=r(),acc=0,rr=2;for(let i=0;i<7;i++){acc+=od[i];if(x<acc){rr=i;break}}
  let w,s;if(rr===6){[w,s]=pickGold(cs,r)}else{const pool=cs.i.filter(e=>e[2]===rr);[w,s]=pool[Math.floor(r()*pool.length)]}
  const d=DEF[w];const stOk=!d.nw&&!d.st0&&!d.sv&&d.t!=='Guantes';const st=stOk&&r()<ST_CHANCE;const f=d.nw?0:genFloat(r);return{w,s,f,st:st?1:0,o:cs.id}}
function caseEV(cs){const R=mulberry(hashStr(cs.id));let s=0;const N=6000;for(let i=0;i<N;i++)s+=itemValue(rollCase(cs,R,1));return s/N}

const luckNow=()=>eventOn()?Math.max(1,+CFG.luck||1):1;
const discNow=()=>eventOn()?Math.min(.8,Math.max(0,+CFG.disc||0)):0;
const xpMult=()=>eventOn()&&CFG.xp2?2:1;
const casePrice=cs=>Math.max(1,Math.round(cs.price*(1-discNow())));
function levelOf(xp){let l=1,need=xpNeed(1),acc=0;while(xp>=acc+need){acc+=need;l++;need=xpNeed(l)}return{l,cur:xp-acc,need}}
const listeners=[];const on=(fn)=>listeners.push(fn);const emit=(what)=>listeners.forEach(f=>{try{f(what)}catch(e){console.error(e)}});

function netInit(onState){
  firebase.initializeApp(FB_CFG);AUTH=firebase.auth();DB=firebase.database();
  DB.ref('.info/serverTimeOffset').on('value',s=>{TOFF=s.val()||0});
  AUTH.onAuthStateChanged(async u=>{
    if(!u||u.isAnonymous){FBUSER=null;UID=null;onState('out');return}
    FBUSER=u;UID=u.uid;onState('loading');
    try{
      const a=await DB.ref('admins/'+UID).once('value').catch(()=>null);ROOTADMIN=!!(a&&a.val()===true);
      /* si las reglas de MCF Drop no están publicadas, usamos la zona abierta 'salas' */
      ROOTP=await DB.ref('drop/config').once('value').then(()=>'drop',()=>'salas/mcfdrop');
      if(ROOTP==='drop'){const mine=await R_('users/'+UID).once('value');if(!mine.exists()){const old=await DB.ref('salas/mcfdrop/users/'+UID).once('value').catch(()=>null);if(old&&old.exists())await R_('users/'+UID).set(old.val())}}
      const st=await R_('staff/'+UID).once('value').catch(()=>null);STAFF=ROOTADMIN||!!(st&&st.val()===true);
      const snap=await R_('users/'+UID).once('value');
      if(!snap.exists()){await R_('users/'+UID).set({n:mcfName(u),c:1000,xp:0,lvc:1,ld:0,op:0,best:0,bestN:'',t:TS()});ME.fresh=true}
      R_('users/'+UID).on('value',s=>{const v=s.val()||{};ME.n=v.n||mcfName(u);ME.c=v.c||0;ME.xp=v.xp||0;ME.lvc=v.lvc||1;ME.ld=v.ld||0;ME.op=v.op||0;ME.best=v.best||0;ME.bestN=v.bestN||'';ME.ban=!!v.ban;ME.fb=v.freebox||{};
        const inv={},bad={};Object.entries(v.inv||{}).forEach(([k,raw])=>{const it=dec(raw);if(it){it.id=k;inv[k]=it}else bad['inv/'+k]=null});if(Object.keys(bad).length)R_('users/'+UID).update(bad).catch(()=>{});ME.inv=inv;const first=!ME.loaded;ME.loaded=true;emit(first?'first':'me')});
      R_('config').on('value',s=>{CFG=Object.assign({luck:1,disc:0,xp2:0,msg:'',until:0},s.val()||{});emit('cfg')});
      R_('payouts/'+UID).on('child_added',s=>claimPayout(s));
      watchTrades();
      onState('in');
    }catch(e){console.error(e);onState('error',e)}
  });
}
/* ---------- créditos, inventario, xp ---------- */
async function addCredits(d){const r=await R_('users/'+UID+'/c').transaction(c=>{c=c||0;if(c+d<0)return;return Math.round(c+d)});return r.committed}
async function spend(n){if(ME.c<n)return false;return addCredits(-n)}
function addItems(items){const up={};items.forEach(it=>{if(!it.id)it.id=uid();if(!it.t)it.t=Date.now();up['inv/'+it.id]=enc(it)});return R_('users/'+UID).update(up)}
function removeItems(ids){const up={};ids.forEach(id=>up['inv/'+id]=null);return R_('users/'+UID).update(up)}
async function addXP(n){n=Math.round(n*xpMult());const before=levelOf(ME.xp).l;await R_('users/'+UID+'/xp').transaction(x=>(x||0)+n);
  const after=levelOf(ME.xp+n).l;if(after>before&&after>ME.lvc){const rewards=[];let c=0;for(let l=Math.max(before,ME.lvc)+1;l<=after;l++){const r=levelReward(l);c+=r.c;rewards.push(r)}
    const ok=await R_('users/'+UID+'/lvc').transaction(v=>{if((v||1)>=after)return;return after});if(ok.committed){await addCredits(c);const boxes=rewards.filter(r=>r.box).map(r=>r.box);
      if(boxes.length)await R_('users/'+UID+'/freebox').transaction(o=>{o=o||{};boxes.forEach(b=>o[b]=(o[b]||0)+1);return o});emit({levelUp:after,c,boxes})}}}
async function useFreeBox(id){const r=await R_('users/'+UID+'/freebox/'+id).transaction(v=>{if(!v)return;return v-1||null});return r.committed}
let rankT=0;function rankSoon(){clearTimeout(rankT);rankT=setTimeout(()=>{if(!UID)return;const items=Object.values(ME.inv);const v=items.reduce((a,it)=>a+itemValue(it),0);
  R_('rank/'+UID).set({n:ME.n,v,b:ME.best,bn:ME.bestN,o:ME.op,l:levelOf(ME.xp).l,t:TS()}).catch(()=>{})},1500)}
on(w=>{if(w==='me'||w==='first')rankSoon()});

/* ---------- abrir cajas ---------- */
async function openCases(cs,n,free){
  const price=casePrice(cs)*n;
  if(free){if(!(await useFreeBox(cs.id)))return{err:'No te quedan cajas gratis'}}
  else if(!(await spend(price)))return{err:'No tienes créditos suficientes'};
  const L=luckNow();const items=[];for(let i=0;i<n;i++){const it=rollCase(cs,rnd,L);it.id=uid();it.t=Date.now();items.push(it)}
  await addItems(items);
  const best=items.reduce((a,b)=>itemValue(b)>itemValue(a)?b:a);const bv=itemValue(best);
  const up={op:(ME.op||0)+n};if(bv>ME.best){up.best=bv;up.bestN=itemName(best)}await R_('users/'+UID).update(up);
  items.filter(it=>rarOf(it)>=4).forEach(it=>R_('feed').push({n:ME.n,it:enc(it),v:itemValue(it),c:cs.id,t:TS()}));
  addXP(Math.max(5,Math.round(cs.price/8))*n);
  return{items};
}

async function listItem(id,price){const it=ME.inv[id];if(!it)return{err:'No tienes ese artículo'};price=Math.max(1,Math.round(price));
  const ref=R_('market').push();await removeItems([id]);await ref.set({s:UID,sn:ME.n,it:enc(it),p:price,v:itemValue(it),r:rarOf(it),t:TS()});return{ok:1}}
async function cancelListing(lid){const ref=R_('market/'+lid);const s=await ref.once('value');const L=s.val();if(!L||L.s!==UID||L.b)return{err:'Ya no está disponible'};
  await ref.remove();const it=dec(L.it);if(it)await addItems([it]);return{ok:1}}
async function buyListing(lid){const ref=R_('market/'+lid);const s0=await ref.once('value');const L0=s0.val();if(!L0||L0.b)return{err:'Ya se ha vendido'};if(L0.s===UID)return{err:'Es tu anuncio'};
  if(ME.c<L0.p)return{err:'No tienes créditos suficientes'};
  const tr=await ref.transaction(L=>{if(!L)return L;if(L.b)return;L.b=UID;L.bn=ME.n;return L});if(!tr.committed||!tr.snapshot.val()||tr.snapshot.val().b!==UID)return{err:'Alguien lo ha comprado antes'};
  if(!(await spend(L0.p))){await ref.update({b:null,bn:null});return{err:'No tienes créditos suficientes'}}
  const it=dec(L0.it);it.id=uid();await addItems([it]);
  await R_('payouts/'+L0.s).push({a:L0.p,n:itemName(it),bn:ME.n,t:TS()});await ref.remove();return{it}}
async function claimPayout(s){const v=s.val();if(!v)return;const r=await s.ref.transaction(x=>{if(!x||x.done)return;x.done=true;return x});if(!r.committed)return;
  await addCredits(v.a);await s.ref.remove();emit({sold:v})}
/* ---------- intercambios ---------- */
const TRADES={in:{},out:{}};
function watchTrades(){
  const q1=R_('trades').orderByChild('b').equalTo(UID),q2=R_('trades').orderByChild('a').equalTo(UID);
  q1.on('value',s=>{TRADES.in=s.val()||{};emit('trades')});
  q2.on('value',s=>{TRADES.out=s.val()||{};emit('trades');Object.entries(TRADES.out).forEach(([id,t])=>settleOut(id,t))});
}
async function sendTrade(toUid,toName,giveIds,wantItems){const give={};for(const id of giveIds){const it=ME.inv[id];if(!it)return{err:'Falta un artículo tuyo'};give[id]=enc(it)}
  const want={};wantItems.forEach(it=>want[it.id]=enc(it));if(!giveIds.length&&!wantItems.length)return{err:'Elige algún artículo'};
  await removeItems(giveIds);const ref=R_('trades').push();await ref.set({a:UID,an:ME.n,b:toUid,bn:cleanName(toName),give,want,st:'p',t:TS()});return{ok:1}}
async function answerTrade(id,accept){const ref=R_('trades/'+id);const s=await ref.once('value');const T=s.val();if(!T||T.b!==UID||T.st!=='p')return{err:'La oferta ya no está activa'};
  if(!accept){await ref.update({st:'no'});return{ok:1}}
  const wantIds=Object.keys(T.want||{});for(const wid of wantIds)if(!ME.inv[wid])return{err:'Ya no tienes alguno de los artículos que te piden'};
  const tr=await ref.child('st').transaction(st=>st==='p'?'ok':undefined);if(!tr.committed)return{err:'La oferta ya no está activa'};
  await removeItems(wantIds);const got=Object.values(T.give||{}).map(dec).filter(Boolean).map(it=>(it.id=uid(),it));await addItems(got);return{ok:1,got}}
async function cancelTrade(id){const ref=R_('trades/'+id);const tr=await ref.child('st').transaction(st=>st==='p'?'x':undefined);return tr.committed?{ok:1}:{err:'Ya la han respondido'}}
async function settleOut(id,T){
  if(T.st==='ok'){const tr=await R_('trades/'+id+'/st').transaction(st=>st==='ok'?'done':undefined);if(!tr.committed)return;
    const got=Object.values(T.want||{}).map(dec).filter(Boolean).map(it=>(it.id=uid(),it));await addItems(got);emit({tradeDone:T})}
  else if(T.st==='no'||T.st==='x'){const tr=await R_('trades/'+id+'/st').transaction(st=>(st==='no'||st==='x')?'back':undefined);if(!tr.committed)return;
    const back=Object.values(T.give||{}).map(dec).filter(Boolean);await addItems(back);if(T.st==='no')emit({tradeNo:T})}
}
/* ---------- batallas ---------- */
const ROUND_MS=6200,BATTLE_DELAY=3500;
const normB=B=>{if(!B)return B;B.cs=Array.isArray(B.cs)?B.cs.filter(Boolean):Object.values(B.cs||{});const pl={},src=B.pl||{};Object.keys(src).forEach(k=>{if(src[k])pl[k]=src[k]});B.pl=pl;if(B.tot&&!Array.isArray(B.tot))B.tot=Object.values(B.tot);return B};
function battleCost(cs){return cs.reduce((a,id)=>a+casePrice(CASE[id]),0)}
function battleRolls(B){const out=[];const n=B.n;for(let i=0;i<n;i++){out[i]=B.cs.map((cid,r)=>{const g=mulberry((B.seed>>>0)^((i+1)*2654435761)^((r+1)*40503));const it=rollCase(CASE[cid],g,1);it.id='b'+i+'r'+r;return it})}return out}
function battleWinner(B){const rolls=battleRolls(B);const tot=rolls.map(rs=>rs.reduce((a,it)=>a+itemValue(it),0));const max=Math.max(...tot);const tied=tot.map((v,i)=>v===max?i:-1).filter(i=>i>=0);
  return{w:tied[(B.seed>>>3)%tied.length],tot,rolls}}
async function createBattle(cases,n){const cost=battleCost(cases);if(!(await spend(cost)))return{err:'No tienes créditos suficientes'};
  const ref=R_('battles').push();await ref.set({h:UID,hn:ME.n,cs:cases,n,cost,pl:{0:{u:UID,n:ME.n}},st:'open',t:TS()});return{id:ref.key}}
async function joinBattle(id,slot){const ref=R_('battles/'+id);const s=await ref.once('value');const B=normB(s.val());if(!B||B.st!=='open')return{err:'La batalla ya ha empezado'};
  if(Object.values(B.pl||{}).some(p=>p.u===UID))return{err:'Ya estás dentro'};if(ME.c<B.cost)return{err:'No tienes créditos suficientes'};
  const tr=await ref.child('pl/'+slot).transaction(p=>{if(p)return;return{u:UID,n:ME.n}});if(!tr.committed)return{err:'Ese sitio ya está ocupado'};
  if(!(await spend(B.cost))){await ref.child('pl/'+slot).remove();return{err:'No tienes créditos suficientes'}}
  maybeStart(id);return{ok:1}}
async function fillBots(id){const ref=R_('battles/'+id);const s=await ref.once('value');const B=normB(s.val());if(!B||B.h!==UID||B.st!=='open')return;
  const up={};const used=Object.values(B.pl||{}).map(p=>p.n);let bi=Math.floor(rnd()*BOTS.length);for(let i=0;i<B.n;i++)if(!(B.pl||{})[i]){let nm=BOTS[bi++%BOTS.length];while(used.includes(nm))nm=BOTS[bi++%BOTS.length];used.push(nm);up['pl/'+i]={bot:1,n:nm}}
  await ref.update(up);maybeStart(id)}
async function maybeStart(id){const ref=R_('battles/'+id);await ref.transaction(B=>{if(!B||B.st!=='open')return;const c=Object.values(B.pl||{}).filter(Boolean).length;if(c<B.n)return;B.st='run';B.seed=Math.floor(rnd()*4294967295);B.t0=Date.now()+TOFF;return B})}
async function cancelBattle(id){const ref=R_('battles/'+id);const tr=await ref.transaction(B=>{if(!B||B.st!=='open'||B.h!==UID)return;B.st='cancel';return B});return tr.committed}
async function battleRefund(id,B){const slot=Object.entries(B.pl||{}).find(([i,p])=>p.u===UID);if(!slot)return;const tr=await R_('battles/'+id+'/pl/'+slot[0]+'/rf').transaction(v=>v?undefined:true);if(tr.committed)await addCredits(B.cost)}
async function battleLeave(id,B){/* salir antes de empezar: devuelve el coste */const slot=Object.entries(B.pl||{}).find(([i,p])=>p.u===UID);if(!slot||B.st!=='open')return;
  const tr=await R_('battles/'+id).transaction(X=>{if(!X||X.st!=='open'||!X.pl||!X.pl[slot[0]]||X.pl[slot[0]].u!==UID)return;delete X.pl[slot[0]];return X});if(tr.committed)await addCredits(B.cost)}
async function battleFinish(id,B){const res=battleWinner(B);await R_('battles/'+id).transaction(X=>{if(!X||X.st!=='run')return;X.st='end';X.w=res.w;X.tot=res.tot;return X});
  const s=await R_('battles/'+id).once('value');const E=normB(s.val());if(!E||E.st!=='end')return;const wp=E.pl[E.w];
  if(wp&&wp.u===UID){const tr=await R_('battles/'+id+'/cl').transaction(v=>v?undefined:true);if(tr.committed){const all=res.rolls.flat().map(it=>({...it,id:uid(),t:Date.now()}));await addItems(all);emit({battleWon:E,items:all})}}}

function confetti(colors,n){const cv=document.createElement('canvas');cv.className='confetti';const D=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*D;cv.height=innerHeight*D;document.body.appendChild(cv);const x=cv.getContext('2d');x.scale(D,D);
  const P=[];for(let i=0;i<(n||160);i++)P.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.42,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,w:5+Math.random()*7,h:3+Math.random()*5,c:colors[i%colors.length]});
  const t0=performance.now();const st=()=>{const t=performance.now()-t0;x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.38;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-t/2600);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(t<2700)requestAnimationFrame(st);else cv.remove()};st()}

  if(r>=5){confetti(r===6?['#ffc93c','#fff3b0','#ffffff','#e2a521']:[col,'#ffffff','#ff9aa0'],r===6?260:160)}
  if(r===6){const y=document.createElement('div');y.className='rays';document.body.appendChild(y);setTimeout(()=>y.remove(),3100)}}

/* Ruleta horizontal */
async function spinReels(cs,items,fast){
  const st=$('#stageIn');const n=items.length;const box=document.createElement('div');box.className='reels n'+n;st.innerHTML='';st.appendChild(box);
  const mobile=innerWidth<900;const cw=n===1?(mobile?130:180):n<=3?(mobile?110:150):(mobile?92:124);const gap=6,WIN=52,LEN=60;
  const strips=items.map((win,ri)=>{const cells=[];for(let i=0;i<LEN;i++)cells.push(i===WIN?win:rollCase(cs,rnd,1));return cells});
  /* pre-renderizar */
  await preload(strips.flat().map(it=>itemSrc(it.w)),2500);
  const reels=strips.map((cells,ri)=>{const r=document.createElement('div');r.className='reel';r.style.setProperty('--cw',cw+'px');
    r.innerHTML=`<div class="strip">${cells.map((it,i)=>{const rr=rarOf(it);return rr===6&&i!==WIN||(rr===6&&i===WIN)?`<div class="cell gold" style="--rc:${rc(6)}" data-i="${i}"><div class="q">★</div></div>`:`<div class="cell" style="--rc:${rc(rr)}" data-i="${i}">${imgTag(it)}</div>`}).join('')}</div><div class="mark"></div><div class="fadeL"></div><div class="fadeR"></div>`;
    box.appendChild(r);return r});
  pumpImgs();await sleep(40);
  const W=reels[0].clientWidth;const dur=fast?1500:6800;
  await Promise.all(reels.map((r,ri)=>new Promise(res=>{const strip=r.querySelector('.strip');const jitter=(rnd()-.5)*cw*.8;
    const target=WIN*(cw+gap)+cw/2-W/2+jitter;const t0=performance.now()+ri*(fast?60:220);const D=dur+ri*(fast?80:260);let lastIdx=-1;
    const ease=p=>1-Math.pow(1-p,4.6);
    const step=()=>{const t=performance.now()-t0;if(t<0){requestAnimationFrame(step);return}const p=Math.min(1,t/D);const x=target*ease(p);strip.style.transform=`translate3d(${-x}px,0,0)`;
      const idx=Math.floor((x+W/2)/(cw+gap));if(idx!==lastIdx){lastIdx=idx;if(ri===0)SND.tick()}
      if(p<1)requestAnimationFrame(step);else{const c=strip.querySelector(`[data-i="${WIN}"]`);const it=items[ri];if(rarOf(it)===6){c.innerHTML=imgTag(it);c.classList.remove('gold');pumpImgs()}c.classList.add('win');res()}};requestAnimationFrame(step)})));
  const best=Math.max(...items.map(rarOf));SND.reveal(best);celebrate(best);await sleep(fast?400:1100);
}

function inspectModal(it,o){o=o||{};const r=rarOf(it),own=!!(it.id&&ME.inv[it.id]);const v=itemValue(it);
  const m=modal(`<div style="color:${RAR[r].c};font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase">${RAR[r].n}${it.st?' · ST™ (contador)':''}</div><h3>${esc(itemName(it))}</h3>
    <div class="inspect" id="insp" style="--rcA:${RAR[r].c}55">${imgTag(it,'id="inspImg"')}</div>
    ${o.cat?`<p class="mu">Puede salir en: ${CAT[it.w+'|'+it.s].cases.map(c=>esc(CASE[c].n)).join(', ')}.</p><p class="mu" style="margin-top:6px">${isNW(it.w)?`Valor <span class="cr">${fmt(itemValue(it))}</span>`:`Valor aproximado según desgaste: ${WEAR.map((W,i)=>`${W.k} <span class="cr">${fmt(itemValue({w:it.w,s:it.s,f:(W.a+W.b)/2}))}</span>`).join(' · ')}`}</p><p class="mu" style="margin-top:6px">En el mercado de Steam: ${DEF[it.w].usd.toLocaleString('es-ES',{minimumFractionDigits:2})} $ (${DEF[it.w].nw?'':WEAR[DEF[it.w].lw].n+' · '}${fmt(DEF[it.w].sale)} en venta)</p>`:
    `${isNW(it.w)?'':`<div class="floatbar"><i style="left:calc(${(it.f*100).toFixed(2)}% - 1.5px)"></i></div>`}
    <div class="kv"><span>Tipo</span><b>${esc(DEF[it.w].t)}</b><span>Desgaste</span><b>${wearTxt(it)}</b>${isNW(it.w)?'':`<span>Float</span><b>${it.f.toFixed(6)}</b>`}<span>Steam</span><b>${DEF[it.w].usd.toLocaleString('es-ES',{minimumFractionDigits:2})} $</b><span>Origen</span><b>${esc(it.o&&CASE[it.o]?CASE[it.o].n:it.o==='tienda'?'Tienda':it.o==='contrato'?'Contrato':it.o==='mejora'?'Mejorador':it.o==='regalo'?'Regalo del admin':'—')}</b><span>Valor</span><b class="cr">${fmt(v)}</b></div>`}
    ${own?`<div class="row wrap" style="margin-top:14px"><button class="btn" id="iSell">Vender · <span class="cr">${fmt(Math.floor(v*QUICK))}</span></button><button class="btn" id="iList">Poner en el mercado</button><button class="btn" id="iUp">Mejorar</button>${rarOf(it)<=5?'<button class="btn" id="iCt">Contrato</button>':''}</div>`:''}`);
  const box=$('#insp'),img=$('#inspImg');let drag=null,ry=0,rx=0;
  box.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ry,rx};box.setPointerCapture(e.pointerId)};
  box.onpointermove=e=>{if(!drag){const b=box.getBoundingClientRect();const px=(e.clientX-b.left)/b.width-.5,py=(e.clientY-b.top)/b.height-.5;img.style.transform=`rotateY(${px*22}deg) rotateX(${-py*14}deg) scale(1.02)`;return}
    ry=drag.ry+(e.clientX-drag.x)*.5;rx=Math.max(-35,Math.min(35,drag.rx-(e.clientY-drag.y)*.3));img.style.transform=`rotateY(${ry}deg) rotateX(${rx}deg) scale(1.05)`};
  box.onpointerup=()=>{drag=null};
  if(own){$('#iSell').onclick=async()=>{const g=await quickSell([it.id]);SND.coin();toast(`Vendido por <span class="cr">${fmt(g)}</span>`,'ok');closeModal()};
    $('#iList').onclick=()=>listModal(it);$('#iUp').onclick=()=>{UPG.inp=[it.id];closeModal();location.hash='#mejorador'};
    if($('#iCt'))$('#iCt').onclick=()=>{CTR.sel=CTR.sel.filter(x=>ME.inv[x]&&rarOf(ME.inv[x])===rarOf(it));if(!CTR.sel.includes(it.id))CTR.sel.push(it.id);closeModal();location.hash='#contratos'}}
}
function listModal(it){const v=itemValue(it);modal(`<h3>Poner en el mercado</h3><p class="mu">${esc(itemName(it))} · valor de referencia <span class="cr">${fmt(v)}</span>. Otros jugadores podrán comprarlo; cuando se venda, recibes los créditos aunque no estés conectado.</p>
  <div class="row" style="margin:16px 0"><input class="inp grow" id="lp" type="number" min="1" value="${Math.round(v*1.05)}"><button class="btn sm" data-m=".9">-10%</button><button class="btn sm" data-m="1">Valor</button><button class="btn sm" data-m="1.2">+20%</button></div>
  <div class="row end"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="lgo">Publicar anuncio</button></div>`);
  $$('[data-m]').forEach(b=>b.onclick=()=>$('#lp').value=Math.round(v*+b.dataset.m));
  $('#lgo').onclick=async()=>{const p=+$('#lp').value;if(!(p>0))return;const r=await listItem(it.id,p);if(r.err)toast(r.err,'bad');else{SND.coin();toast('Anuncio publicado en el mercado','ok');closeModal()}}}

/* ---------- INVENTARIO ---------- */
const INVF={q:'',r:-1,sort:'val',sel:false,picked:new Set()};
function pageInventory(){const v=$('#view');let items=Object.values(ME.inv);const total=items.reduce((a,it)=>a+itemValue(it),0);
  if(INVF.q){const q=INVF.q.toLowerCase();items=items.filter(it=>itemName(it).toLowerCase().includes(q))}
  if(INVF.r>=0)items=items.filter(it=>rarOf(it)===INVF.r);
  items.sort(INVF.sort==='val'?(a,b)=>itemValue(b)-itemValue(a):INVF.sort==='new'?(a,b)=>(b.t||0)-(a.t||0):(a,b)=>rarOf(b)-rarOf(a)||itemValue(b)-itemValue(a));
  INVF.picked.forEach(id=>{if(!ME.inv[id])INVF.picked.delete(id)});
  const pv=[...INVF.picked].reduce((a,id)=>a+Math.floor(itemValue(ME.inv[id])*QUICK),0);
  v.innerHTML=`<div class="h1"><div><h2>Inventario</h2><p>${Object.keys(ME.inv).length} artículos · valor total <span class="cr">${fmt(total)}</span></p></div>
    <div class="row"><button class="btn ${INVF.sel?'pri':''}" id="selT">${INVF.sel?'Cancelar selección':'Seleccionar'}</button></div></div>
    <div class="tools"><input class="inp" id="iq" placeholder="Buscar…" value="${esc(INVF.q)}" style="width:200px">
    <button class="chip ${INVF.r<0?'on':''}" data-rf="-1">Todas</button>${RAR.map((R,i)=>`<button class="chip ${INVF.r===i?'on':''}" data-rf="${i}" style="${INVF.r===i?'':`color:${R.c}`}">${R.n}</button>`).join('')}
    <select class="inp" id="isort" style="margin-left:auto"><option value="val">Más valiosos</option><option value="new">Más nuevos</option><option value="rar">Rareza</option></select></div>
    ${INVF.sel?`<div class="banner" style="background:var(--p2);border-color:var(--line2)"><b style="color:var(--tx)">${INVF.picked.size} seleccionados</b><span class="cr">${fmt(pv)}</span><div class="row" style="margin-left:auto"><button class="btn sm" id="selAll">Todo lo visible</button><button class="btn sm pri" id="sellSel" ${INVF.picked.size?'':'disabled'}>Vender seleccionados</button></div></div>`:''}
    ${items.length?`<div class="items">${items.map(it=>itemCard(it,{selectable:INVF.sel,sel:INVF.picked.has(it.id)})).join('')}</div>`:`<div class="empty panel">${Object.keys(ME.inv).length?'Nada coincide con el filtro.':'Tu inventario está vacío. <a href="#cajas" style="color:#fff">Abre tu primera caja</a>.'}</div>`}`;
  $('#isort').value=INVF.sort;$('#isort').onchange=e=>{INVF.sort=e.target.value;pageInventory();pumpImgs()};
  let qt;$('#iq').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{INVF.q=e.target.value;pageInventory();pumpImgs();const q=$('#iq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},250)};
  $$('[data-rf]').forEach(b=>b.onclick=()=>{INVF.r=+b.dataset.rf;pageInventory();pumpImgs()});
  $('#selT').onclick=()=>{INVF.sel=!INVF.sel;INVF.picked.clear();pageInventory();pumpImgs()};
  if($('#selAll'))$('#selAll').onclick=()=>{items.forEach(it=>INVF.picked.add(it.id));pageInventory();pumpImgs()};
  if($('#sellSel'))$('#sellSel').onclick=async()=>{const ids=[...INVF.picked];const g=await quickSell(ids);INVF.picked.clear();INVF.sel=false;SND.coin();toast(`Has vendido ${ids.length} artículos por <span class="cr">${fmt(g)}</span>`,'ok')};
  $$('#view .it').forEach(b=>b.onclick=()=>{const it=ME.inv[b.dataset.iid];if(!it)return;if(INVF.sel){INVF.picked.has(it.id)?INVF.picked.delete(it.id):INVF.picked.add(it.id);SND.click();pageInventory();pumpImgs()}else inspectModal(it)})}

/* ---------- MERCADO ---------- */
let MK={tab:'jug',q:'',sort:'new',data:{}};
function pageMarket(tab){if(tab)MK.tab=tab;const v=$('#view');
  v.innerHTML=`<div class="h1"><div><h2>Mercado</h2><p>Compra a otros jugadores, vende lo tuyo o compra directamente en la tienda.</p></div></div>
  <div class="tabs">${[['jug','Jugadores'],['tienda','Tienda'],['mios','Mis anuncios']].map(([k,n])=>`<button class="chip ${MK.tab===k?'on':''}" data-t="${k}">${n}</button>`).join('')}</div><div id="mkb"></div>`;
  $$('[data-t]').forEach(b=>b.onclick=()=>{MK.tab=b.dataset.t;location.hash='#mercado/'+MK.tab});
  if(MK.tab==='tienda')return shopView();
  pageListen(R_('market').limitToLast(300),'value',s=>{MK.data=s.val()||{};marketList()})}
function marketList(){const box=$('#mkb');if(!box)return;let L=Object.entries(MK.data).map(([id,x])=>({id,...x,it:dec(x.it)})).filter(x=>x.it&&!x.b);
  L=MK.tab==='mios'?L.filter(x=>x.s===UID):L;if(MK.q){const q=MK.q.toLowerCase();L=L.filter(x=>itemName(x.it).toLowerCase().includes(q))}
  L.sort(MK.sort==='new'?(a,b)=>(b.t||0)-(a.t||0):MK.sort==='lo'?(a,b)=>a.p-b.p:(a,b)=>b.p-a.p);
  box.innerHTML=`<div class="tools"><input class="inp" id="mq" placeholder="Buscar arma o skin…" value="${esc(MK.q)}" style="width:240px"><select class="inp" id="ms"><option value="new">Más recientes</option><option value="lo">Precio ↑</option><option value="hi">Precio ↓</option></select>
    <span class="chip" style="margin-left:auto">${L.length} anuncios</span></div>
    ${L.length?`<div class="items mk">${L.map(x=>{const v=itemValue(x.it);const d=Math.round((x.p/v-1)*100);return itemCard({...x.it,id:x.id},{price:x.p,sub:`${x.s===UID?'Tu anuncio':'de '+esc(x.sn)} · <span style="color:${d<=0?'var(--ok)':'var(--mu)'}">${d<=0?d+'% bajo valor':'+'+d+'%'}</span>`})}).join('')}</div>`:`<div class="empty panel">${MK.tab==='mios'?'No tienes anuncios. Ponlos desde tu inventario.':'Todavía no hay anuncios. ¡Sé el primero en vender algo!'}</div>`}`;
  $('#ms').value=MK.sort;$('#ms').onchange=e=>{MK.sort=e.target.value;marketList();pumpImgs()};
  let qt;$('#mq').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{MK.q=e.target.value;marketList();pumpImgs();const q=$('#mq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},250)};
  $$('#mkb .it').forEach(b=>b.onclick=()=>{const x=MK.data[b.dataset.iid];if(!x)return;const it=dec(x.it);const mine=x.s===UID;
    modal(`<h3>${esc(itemName(it))}</h3><p class="mu">${mine?'Es tu anuncio.':`Lo vende <b>${esc(x.sn)}</b>.`} Valor de referencia <span class="cr">${fmt(itemValue(it))}</span> · ${wearTxt(it)}${isNW(it.w)?'':' · float '+it.f.toFixed(4)}</p>
      <div class="inspect" style="--rcA:${RAR[rarOf(it)].c}55;height:200px">${imgTag(it)}</div>
      <div class="row end">${mine?`<button class="btn bad" id="mc">Retirar anuncio</button>`:`<span class="grow">Tienes <span class="cr">${fmt(ME.c)}</span></span><button class="btn pri big" id="mb">Comprar · <span class="cr">${fmt(x.p)}</span></button>`}</div>`);
    if(mine)$('#mc').onclick=async()=>{const r=await cancelListing(b.dataset.iid);toast(r.err||'Anuncio retirado; el artículo vuelve a tu inventario',r.err?'bad':'ok');closeModal()};
    else $('#mb').onclick=async()=>{$('#mb').disabled=true;const r=await buyListing(b.dataset.iid);if(r.err){SND.bad();toast(r.err,'bad');closeModal();return}SND.coin();celebrate(Math.min(4,rarOf(r.it)));toast('¡Comprado! Ya está en tu inventario','ok');closeModal()}});
  pumpImgs()}
let SHOP={q:'',r:-1};
function shopView(){const box=$('#mkb');let L=CATL.slice();if(SHOP.q){const q=SHOP.q.toLowerCase();L=L.filter(c=>(WPN[c.w].n+' '+SKIN[c.s].n).toLowerCase().includes(q))}if(SHOP.r>=0)L=L.filter(c=>c.r===SHOP.r);
  L.sort((a,b)=>b.r-a.r||baseVal(b.w)-baseVal(a.w));
  box.innerHTML=`<div class="tools"><input class="inp" id="sq" placeholder="Buscar…" value="${esc(SHOP.q)}" style="width:220px"><button class="chip ${SHOP.r<0?'on':''}" data-sr="-1">Todas</button>${RAR.map((R,i)=>`<button class="chip ${SHOP.r===i?'on':''}" data-sr="${i}" style="${SHOP.r===i?'':`color:${R.c}`}">${R.n}</button>`).join('')}</div>
  <p class="mu" style="margin-bottom:12px">La tienda siempre tiene todo, pero cobra un ${Math.round((SHOP_MARKUP-1)*100)}% más que el valor. En el mercado de jugadores suele salir más barato.</p>
  <div class="items">${L.map(c=>itemCard({id:'',w:c.w,s:c.s,f:defF(c.w)},{price:shopPrice(c.w,c.s,isNW(c.w)?0:DEF[c.w].lw,0),attr:`data-shop="${c.w}|${c.s}"`})).join('')}</div>`;
  let qt;$('#sq').oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{SHOP.q=e.target.value;shopView();const q=$('#sq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},250)};
  $$('[data-sr]').forEach(b=>b.onclick=()=>{SHOP.r=+b.dataset.sr;shopView()});
  $$('[data-shop]').forEach(b=>b.onclick=()=>shopModal(...b.dataset.shop.split('|')));pumpImgs()}
function shopModal(w,s){let wi=DEF[w].lw,st=0;const nw=isNW(w),stOk=!nw&&!DEF[w].st0&&!DEF[w].sv&&DEF[w].t!=='Guantes';const draw=()=>{const p=shopPrice(w,s,wi,st);const it={w,s,f:(WEAR[wi].a+WEAR[wi].b)/2,st};
  modal(`<h3>${esc(itemName(it))}</h3><p class="mu">${nw?'Sin desgaste.':'Elige el desgaste. Cuanto más nuevo, más caro.'}</p><div class="inspect" style="--rcA:${RAR[rarOf(it)].c}55;height:200px">${imgTag(it)}</div>
    ${nw?'':`<div class="tabs">${WEAR.map((W,i)=>`<button class="chip ${i===wi?'on':''}" data-wi="${i}">${W.n}</button>`).join('')}${stOk?`<button class="chip ${st?'on':''}" id="stT">StatTrak™</button>`:''}</div>`}
    <div class="row end"><span class="grow">Tienes <span class="cr">${fmt(ME.c)}</span></span><button class="btn pri big" id="sb">Comprar · <span class="cr">${fmt(p)}</span></button></div>`);
  $$('[data-wi]').forEach(b=>b.onclick=()=>{wi=+b.dataset.wi;draw()});if($('#stT'))$('#stT').onclick=()=>{st=st?0:1;draw()};
  $('#sb').onclick=async()=>{$('#sb').disabled=true;const r=await shopBuy(w,s,wi,st);if(r.err){SND.bad();toast(r.err,'bad');draw();return}SND.coin();toast('Comprado. Ya está en tu inventario','ok');closeModal()}};draw()}

/* ---------- INTERCAMBIOS ---------- */
let PLAYERS={};
function pageTrades(){const v=$('#view');const inc=Object.entries(TRADES.in).filter(([,t])=>t.st==='p').sort((a,b)=>(b[1].t||0)-(a[1].t||0));const out=Object.entries(TRADES.out).filter(([,t])=>t.st==='p');
  const hist=Object.entries(TRADES.in).concat(Object.entries(TRADES.out)).filter(([,t])=>t.st!=='p').sort((a,b)=>(b[1].t||0)-(a[1].t||0)).slice(0,8);
  const tcard=([id,t],mode)=>{const g=Object.values(t.give||{}).map(dec).filter(Boolean),w=Object.values(t.want||{}).map(dec).filter(Boolean);const gv=g.reduce((a,i)=>a+itemValue(i),0),wv=w.reduce((a,i)=>a+itemValue(i),0);
    const side=(L)=>L.length?L.map(it=>`<span style="--rc:${rc(rarOf(it))}" title="${esc(itemName(it))}">${imgTag(it)}</span>`).join(''):'<span class="mu">nada</span>';
    const st={ok:'Aceptado',done:'Completado',no:'Rechazado',x:'Cancelado',back:'Devuelto'}[t.st]||'';
    return`<div class="tcard"><div style="min-width:140px"><b>${mode==='in'?esc(t.an)+' te ofrece':mode==='out'?'Para '+esc(t.bn):esc(t.a===UID?'Para '+t.bn:t.an)}</b><small style="display:block;color:var(--mu)">${st||new Date(t.t||0).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div>
      <div class="side">${side(mode==='in'?g:g)}</div><span class="arrow">⇄</span><div class="side">${side(w)}</div>
      <div style="margin-left:auto;text-align:right"><small class="mu">${mode==='in'?'Recibes':'Das'} <span class="cr">${fmt(mode==='in'?gv:gv)}</span> · ${mode==='in'?'das':'pides'} <span class="cr">${fmt(wv)}</span></small>
      <div class="row end" style="margin-top:6px">${mode==='in'?`<button class="btn sm bad" data-no="${id}">Rechazar</button><button class="btn sm ok" data-ok="${id}">Aceptar</button>`:mode==='out'?`<button class="btn sm" data-cx="${id}">Cancelar</button>`:''}</div></div></div>`};
  v.innerHTML=`<div class="h1"><div><h2>Intercambios</h2><p>Ofrece tus artículos a cualquier jugador de MCF. El intercambio solo se hace si los dos aceptan.</p></div><button class="btn pri" id="newT">Nuevo intercambio</button></div>
    <h3 style="margin:6px 0 10px">Recibidas ${inc.length?`<span class="badge st">${inc.length}</span>`:''}</h3>${inc.length?inc.map(x=>tcard(x,'in')).join(''):'<div class="empty panel" style="padding:24px">No tienes ofertas pendientes.</div>'}
    <h3 style="margin:22px 0 10px">Enviadas</h3>${out.length?out.map(x=>tcard(x,'out')).join(''):'<div class="empty panel" style="padding:24px">No has enviado ofertas.</div>'}
    ${hist.length?`<h3 style="margin:22px 0 10px">Historial</h3>${hist.map(x=>tcard(x,'h')).join('')}`:''}`;
  $('#newT').onclick=()=>pickPlayer();
  $$('[data-ok]').forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await answerTrade(b.dataset.ok,true);if(r.err){toast(r.err,'bad');return}SND.coin();celebrate(Math.max(0,...(r.got||[]).map(rarOf)));toast('¡Intercambio hecho! Revisa tu inventario','ok')});
  $$('[data-no]').forEach(b=>b.onclick=async()=>{await answerTrade(b.dataset.no,false);toast('Oferta rechazada')});
  $$('[data-cx]').forEach(b=>b.onclick=async()=>{const r=await cancelTrade(b.dataset.cx);toast(r.err||'Oferta cancelada; recuperas tus artículos',r.err?'bad':'ok')});pumpImgs()}
async function pickPlayer(){const s=await R_('rank').once('value');PLAYERS=s.val()||{};const L=Object.entries(PLAYERS).filter(([u])=>u!==UID).sort((a,b)=>(b[1].v||0)-(a[1].v||0));
  modal(`<h3>¿Con quién quieres intercambiar?</h3><input class="inp" id="pq" placeholder="Buscar jugador…" style="width:100%;margin:10px 0 14px"><div class="players" id="pll"></div>`,'wide');
  const draw=q=>{$('#pll').innerHTML=L.filter(([,p])=>!q||String(p.n||'').toLowerCase().includes(q)).map(([u,p])=>`<button class="pl" data-u="${u}"><span class="av">${esc(String(p.n||'?').charAt(0).toUpperCase())}</span><div><b>${esc(p.n)}</b><small>Nivel ${p.l||1} · inventario <span class="cr">${fmt(p.v||0)}</span></small></div></button>`).join('')||'<div class="empty">No hay más jugadores todavía.</div>';
    $$('#pll [data-u]').forEach(b=>b.onclick=()=>tradeComposer(b.dataset.u,PLAYERS[b.dataset.u].n))};draw('');$('#pq').oninput=e=>draw(e.target.value.toLowerCase())}
async function tradeComposer(tu,tn){const s=await R_('users/'+tu+'/inv').once('value');const theirs=Object.entries(s.val()||{}).map(([k,raw])=>{const it=dec(raw);if(it)it.id=k;return it}).filter(Boolean).sort((a,b)=>itemValue(b)-itemValue(a));
  const give=new Set(),want=new Set();const mine=Object.values(ME.inv).sort((a,b)=>itemValue(b)-itemValue(a));
  const draw=()=>{const gv=[...give].reduce((a,id)=>a+itemValue(ME.inv[id]),0),wv=[...want].reduce((a,id)=>a+itemValue(theirs.find(t=>t.id===id)),0);
    modal(`<h3>Intercambio con ${esc(tn)}</h3><p class="mu">Marca lo que das y lo que quieres. ${esc(tn)} recibirá la oferta y decidirá.</p>
    <div class="tradecols" style="margin-top:14px"><div class="panel"><h4><span>Tú das (${give.size})</span><span class="cr">${fmt(gv)}</span></h4><div class="items" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${mine.map(it=>itemCard(it,{mini:1,selectable:1,sel:give.has(it.id),attr:'data-g="1"'})).join('')||'<span class="mu">Inventario vacío</span>'}</div></div>
    <div class="panel"><h4><span>Tú recibes (${want.size})</span><span class="cr">${fmt(wv)}</span></h4><div class="items" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${theirs.map(it=>itemCard(it,{mini:1,selectable:1,sel:want.has(it.id),attr:'data-w="1"'})).join('')||'<span class="mu">No tiene artículos</span>'}</div></div></div>
    <div class="row end" style="margin-top:14px"><button class="btn" data-close>Cancelar</button><button class="btn pri" id="tsend" ${give.size||want.size?'':'disabled'}>Enviar oferta</button></div>`,'wide');
    $$('[data-g]').forEach(b=>b.onclick=()=>{const id=b.dataset.iid;give.has(id)?give.delete(id):give.add(id);const y=$('.mbox').scrollTop;draw();$('.mbox').scrollTop=y});
