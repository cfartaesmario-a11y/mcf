<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCF Games</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="MCF Games: juegos rápidos y adictivos de MCF Workspace.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cg transform='translate(8 8) scale(2) rotate(45 12 12)'%3E%3Cpath fill='%23fff' d='M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#000;--sheet:#101010;--sheet-2:#191919;--line:#262626;--ink:#F2F2F2;--ink-2:#A3A3A3;--ink-3:#626262;
  --red:#FF5C63;--ok:#4ADE80;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.4px);background-size:22px 22px;background-attachment:fixed}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:8px}

/* ---------- Portada ---------- */
.hub{max-width:1080px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top,0px)) clamp(16px,4vw,40px) calc(40px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.logo svg{width:22px;height:22px}
.tright{display:flex;align-items:center;gap:8px;position:relative}
.top{position:relative}
.wsbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;color:var(--ink-2);transition:color .15s,border-color .15s,transform .2s}
.wsbtn svg{width:18px;height:18px}
.wsbtn:hover,.wsbtn[aria-expanded=true]{color:var(--ink);border-color:#3a3a3a}
.wsbtn[aria-expanded=true]{transform:rotate(45deg)}
.wspanel{position:absolute;right:0;top:54px;z-index:40;width:min(360px,calc(100vw - 24px));background:#0c0c0c;border:1px solid #2a2a2a;border-radius:26px;padding:16px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.02) inset;animation:wsin .18s ease;transform-origin:top right}
@keyframes wsin{from{opacity:0;transform:scale(.96) translateY(-6px)}}
.wshead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 14px;border-bottom:1px solid #1f1f1f;margin-bottom:14px}
.wslogo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em}
.wslogo .pl{width:30px;height:30px;border-radius:10px;background:#fff;color:#000;display:grid;place-items:center}
.wslogo .pl svg{width:16px;height:16px}
.wslogo small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--ink-3);letter-spacing:0}
.wsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wsapp{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 10px;border-radius:18px;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;text-align:center;border:1px solid transparent;background:none}
.wsapp:hover{background:#161616;border-color:#232323}
.wsapp.here{background:#151515;border-color:#2c2c2c}
.wsico{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--g);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.25)}
.wsico svg{width:24px;height:24px;color:#fff}
.wsapp.soon .wsico{filter:grayscale(.85) brightness(.55)}
.wsapp.soon{color:var(--ink-3);cursor:default}
.wstag{position:absolute;top:6px;right:6px;font-size:9.5px;font-weight:800;letter-spacing:.02em;border-radius:99px;padding:2px 6px;background:#1f1f1f;color:var(--ink-2)}
.wsapp.here .wstag{background:#fff;color:#000}
.wsfoot{margin-top:12px;padding:12px 6px 2px;border-top:1px solid #1f1f1f;color:var(--ink-3);font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{white-space:nowrap}
@media (max-width:520px){.dlab{display:none}.acct{padding:4px}.acct.login{padding:8px 13px}.streak{padding:7px 11px}.logo{font-size:19px}.wspanel{right:-4px}}
.wsfoot a{color:var(--ink);font-weight:700;text-decoration:none}
.acct{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:4px 12px 4px 4px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.acct .av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#000;display:grid;place-items:center;font-weight:800;font-size:13px}
.acct.login{padding:7px 13px}
.streak{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:7px 13px;font-weight:600;font-size:14px}
.feat{position:relative;border-radius:28px;overflow:hidden;min-height:clamp(300px,42vw,420px);display:flex;align-items:flex-end;margin-bottom:34px;border:1px solid #1f1f1f;background:#0b1420}
.fimg{position:absolute;inset:0;background-image:var(--img);background-size:cover;background-position:center;transform:scale(1.02);transition:transform 6s ease}
.feat:hover .fimg{transform:scale(1.07)}
.fshade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.05) 100%),linear-gradient(0deg,rgba(0,0,0,.7),transparent 55%)}
.fbody{position:relative;padding:clamp(22px,4vw,44px);max-width:560px}
.fkick{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#FFC21A;margin-bottom:10px}
.feat h1{font-family:var(--display);font-weight:800;font-size:clamp(42px,7vw,72px);letter-spacing:-.045em;line-height:.9;margin:0}
.feat p{color:rgba(255,255,255,.8);font-size:16px;line-height:1.5;margin:12px 0 20px}
.fact{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.fplay{border:0;background:#fff;color:#000;font-weight:800;font-size:16px;border-radius:99px;padding:13px 24px;box-shadow:0 10px 30px -10px rgba(255,255,255,.5)}
.fplay:hover{transform:translateY(-1px)}
.fbest{color:rgba(255,255,255,.7);font-size:14px}.fbest b{color:#fff}
.shead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.shead h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chipf{flex:none;border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chipf.on{background:#fff;color:#000;border-color:#fff}
.hero{margin-bottom:26px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,9vw,88px);line-height:.88;letter-spacing:-.05em;margin:0}
.hero h1 span{display:block;color:var(--ink-3)}
.hero p{color:var(--ink-2);font-size:16px;max-width:520px;margin:14px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}.atitle{font-size:19px;left:11px;bottom:9px}.cbody{padding:10px 11px 12px}.cdesc{font-size:12.5px}.cbest{font-size:12px}.play{padding:6px 11px;font-size:12.5px}.acat{top:8px;left:8px;font-size:10.5px}.abadge{top:8px;right:8px;font-size:10px;padding:3px 7px}.feat p{font-size:14.5px}}
.card{position:relative;text-align:left;border:1px solid #1f1f1f;background:#0d0d0d;border-radius:22px;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s ease,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:#3a3a3a}
.card:active{transform:scale(.98)}
.art{aspect-ratio:16/10;position:relative;overflow:hidden;background:var(--g)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card:hover .art img{transform:scale(1.06)}
.ashade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.25) 45%,rgba(0,0,0,.05) 100%)}
.acat{position:absolute;top:12px;left:12px;font-size:11.5px;font-weight:700;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-radius:99px;padding:4px 10px}
.abadge{position:absolute;top:12px;right:12px;font-size:11.5px;font-weight:700;background:#FFC21A;color:#000;border-radius:99px;padding:4px 10px}
.atitle{position:absolute;left:16px;right:16px;bottom:12px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5);line-height:1}
.art canvas{position:absolute;inset:0;width:100%;height:100%}
.cbody{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.cname{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.cdesc{color:var(--ink-2);font-size:14px;line-height:1.4}
.cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.cdesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cbest{font-size:13px;color:var(--ink-3);font-weight:600}
.cbest b{color:var(--ink)}
.play{background:var(--ink);color:#000;border-radius:99px;padding:7px 15px;font-weight:700;font-size:14px}
.badge{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--ink-2);font-family:var(--body);letter-spacing:0}
.foot{color:var(--ink-3);font-size:13px;margin-top:28px;text-align:center}

/* ---------- Pantalla de juego ---------- */
.stage{position:fixed;inset:0;z-index:20;background:#000;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#0d1a36}
.ghud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;pointer-events:none;z-index:3}
.ghud>*{pointer-events:auto}
.back{display:flex;align-items:center;gap:6px;border:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border-radius:99px;padding:8px 13px;font-weight:700;font-size:14px}
.gscore{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,52px);color:#fff;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.25);pointer-events:none}
.gbest{background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:99px;padding:8px 13px;font-weight:700;font-size:13px;color:#fff;pointer-events:none}
.back.solo{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
.msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none;z-index:2;width:min(92vw,520px)}
.msg b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,54px);letter-spacing:-.03em;line-height:1}
.msg span{display:block;margin-top:10px;font-weight:600;opacity:.85}
.over{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px;animation:fade .2s ease}
.obox{width:min(380px,100%);background:var(--sheet);border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center}
.obox h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0;color:var(--ink-2)}
.obig{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;letter-spacing:-.04em;margin:10px 0 2px}
.orec{display:inline-block;background:#FFC21A;color:#000;font-weight:800;border-radius:99px;padding:4px 12px;font-size:13px;margin:6px 0}
.osub{color:var(--ink-2);font-size:14px;margin-bottom:18px}
.obtns{display:flex;gap:8px}
.obtns button{flex:1;border-radius:14px;padding:13px;font-weight:700;border:1px solid var(--line);background:var(--sheet-2)}
.obtns .pri{background:var(--ink);color:#000;border-color:var(--ink)}
.modes{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(0,0,0,.6);padding:20px}
.mbox{width:min(380px,100%);display:flex;flex-direction:column;gap:10px;text-align:center}
.mbox h2{font-family:var(--display);font-weight:800;font-size:34px;margin:0 0 6px;color:#fff;letter-spacing:-.03em}
.mbox button{border:1px solid var(--line);background:var(--sheet);border-radius:18px;padding:16px;font-weight:700;font-size:16px;text-align:left}
.mbox button small{display:block;color:var(--ink-2);font-weight:500;font-size:13px;margin-top:3px}
/* Mates */
.quiz{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:90px 18px 30px;z-index:1}
.qtime{width:min(520px,90vw);height:10px;border-radius:99px;background:#1d1d1d;overflow:hidden}
.qtime i{display:block;height:100%;background:linear-gradient(90deg,#FFC21A,#FF5C63);border-radius:99px}
.qq{font-family:var(--display);font-weight:800;font-size:clamp(52px,13vw,96px);letter-spacing:-.04em;line-height:1;color:#fff}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(520px,92vw)}
.qopts button{border:0;border-radius:20px;padding:22px 10px;font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);color:#000;transition:transform .08s}
.qopts button:active{transform:scale(.96)}
.qopts button.bad{animation:shake .3s}
.qstreak{color:#FFC21A;font-weight:800;font-size:16px;min-height:1.2em}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>

<main class="hub" id="hub">
  <div class="top">
    <div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><g transform="rotate(45 12 12)"><path fill="currentColor" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></g></svg>MCF Games</div>
    <div class="tright"><button class="wsbtn" id="wsBtn" aria-label="MCF Workspace" aria-expanded="false" aria-controls="wsPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="5" cy="5" r="2.2"/><circle cx="12" cy="5" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/></g></svg></button><div id="acct"></div></div>
    <div class="wspanel" id="wsPanel" role="dialog" aria-label="MCF Workspace" hidden></div>
  </div>
  <section class="feat" id="feat"></section>
  <div class="shead"><h2>Todos los juegos</h2><div class="chips" id="chips"></div></div>
  <section class="grid" id="grid"></section>
  <p class="foot">Los récords se guardan en este dispositivo. Pronto: rankings y partidas online con tu cuenta MCF.</p>
</main>

<div class="stage" id="stage" hidden>
  <canvas id="cv"></canvas>
  <div class="ghud" id="ghud"><button class="back" data-exit>← Juegos</button><div class="gscore" id="gscore">0</div><div class="gbest" id="gbest">Récord 0</div></div>
  <div class="msg" id="gmsg" hidden><b></b><span></span></div>
  <div id="glayer"></div>
</div>

<script>
/* ============================== Base ============================== */
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cv=$('cv'),cx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0);if(CUR&&CUR.resize)CUR.resize()}
addEventListener('resize',resize);

/* Sonido */
let AC=null;function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d=.08,type='sine',v=.08,slide=0){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const SFX={tap:()=>tone(520,.05,'square',.05),good:()=>{tone(660,.07,'triangle',.08);setTimeout(()=>tone(990,.09,'triangle',.07),60)},bad:()=>tone(160,.25,'sawtooth',.07,-80),perfect:()=>{tone(880,.06,'triangle',.08);setTimeout(()=>tone(1320,.1,'triangle',.08),60)},over:()=>{tone(300,.2,'triangle',.08,-150);setTimeout(()=>tone(200,.3,'triangle',.07,-100),150)},win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.12,'triangle',.08),i*90))}};

/* Récords y racha */
const bestKey=id=>'mcfgames.best.'+(window.MCFUSER?MCFUSER.uid+'.':'')+id;
const getBest=id=>LS.get(bestKey(id),null);
function setBest(id,v,lowerIsBetter){const b=getBest(id);const better=b==null||(lowerIsBetter?v<b:v>b);if(better)LS.set(bestKey(id),v);return better}
function dayStr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function touchStreak(){const s=LS.get('mcfgames.streak',{n:0,last:''});const t=new Date(),today=dayStr(t),y=new Date(t);y.setDate(t.getDate()-1);
  if(s.last===today)return s.n;s.n=s.last===dayStr(y)?s.n+1:1;s.last=today;LS.set('mcfgames.streak',s);return s.n}
function showStreak(){const s=LS.get('mcfgames.streak',{n:0,last:''});const t=new Date(),y=new Date(t);y.setDate(t.getDate()-1);const alive=s.last===dayStr(t)||s.last===dayStr(y);$('streakN').textContent=alive?s.n:0}

/* ============================== Motor común ============================== */
let CUR=null,CURID=null,raf=0,last=0,running=false;
const HUD={score(v){$('gscore').textContent=v},best(t){$('gbest').textContent=t},msg(t,s){const m=$('gmsg');if(!t){m.hidden=true;return}m.hidden=false;m.querySelector('b').textContent=t;m.querySelector('span').textContent=s||''},hud(show){$('ghud').style.display=show?'flex':'none'}};
function loop(now){raf=requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||0);last=now;if(CUR&&running){CUR.update&&CUR.update(dt);CUR.draw&&CUR.draw()}}
function openGame(id){au();const g=GAMES.find(x=>x.id===id);if(!g)return;$('hub').hidden=true;$('stage').hidden=false;$('glayer').innerHTML='';HUD.msg('');HUD.hud(true);
  CURID=id;CUR=g;resize();const b=getBest(id);HUD.best('Récord '+(b==null?'—':g.fmt?g.fmt(b):b));HUD.score(0);
  if(g.iframe){cv.style.display='none';HUD.hud(false);g.start();return}cv.style.display='block';
  if(g.modes){showModes(g);return}g.start();running=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function exitGame(){running=false;cancelAnimationFrame(raf);if(CUR&&CUR.stop)CUR.stop();CUR=null;$('glayer').innerHTML='';$('stage').hidden=true;$('hub').hidden=false;renderHub()}
function gameOver(value,{label,sub,lowerIsBetter,shown}={}){running=false;SFX.over();const g=CUR;const rec=value!=null&&setBest(g.id,value,lowerIsBetter);if(rec)SFX.win();
  const L=$('glayer');const ov=document.createElement('div');ov.className='over';
  ov.innerHTML=`<div class="obox"><h2>${label||'Puntuación'}</h2><div class="obig">${shown!=null?shown:value}</div>${rec?'<div class="orec">¡Nuevo récord!</div>':''}<div class="osub">${sub||('Récord: '+(g.fmt?g.fmt(getBest(g.id)):getBest(g.id)))}</div><div class="obtns"><button data-exit>Juegos</button><button class="pri" data-again>Otra vez</button></div></div>`;
  L.appendChild(ov);setTimeout(()=>ov.querySelector('[data-again]').focus(),50);
  const b=getBest(g.id);HUD.best('Récord '+(b==null?'—':g.fmt?g.fmt(b):b))}
function again(){$('glayer').innerHTML='';HUD.msg('');if(CUR.modes&&CUR.mode==null){showModes(CUR);return}CUR.start(CUR.mode);running=true;last=performance.now()}
function showModes(g){running=false;const L=$('glayer');L.innerHTML=`<div class="modes"><div class="mbox"><h2>${g.name}</h2>${g.modes.map(([k,t,d])=>`<button data-mode="${k}">${t}<small>${d}</small></button>`).join('')}<button data-exit style="text-align:center">← Juegos</button></div></div>`}
document.addEventListener('click',e=>{if(e.target.closest('[data-exit]')){exitGame();return}if(e.target.closest('[data-again]')){again();return}
  const m=e.target.closest('[data-mode]');if(m&&CUR){$('glayer').innerHTML='';CUR.mode=m.dataset.mode;CUR.start(CUR.mode);running=true;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
  const c=e.target.closest('[data-game]');if(c)openGame(c.dataset.game)});
/* Entradas */
const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{e.preventDefault();au();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,t:performance.now()});if(CUR&&running&&CUR.down)CUR.down(e.clientX,e.clientY,e)});
addEventListener('pointerup',e=>{const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(CUR&&running&&CUR.up)CUR.up(e.clientX,e.clientY,p,e)});
addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);if(CUR&&running&&CUR.up)CUR.up(e.clientX,e.clientY,null,e)});
addEventListener('keydown',e=>{if($('stage').hidden)return;if(e.key==='Escape'){exitGame();return}
  if((e.key===' '||e.key==='Enter')&&$('glayer').querySelector('.over')){e.preventDefault();again();return}
  if(CUR&&running&&CUR.key){if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(!e.repeat)CUR.key(e.key,true)}});
addEventListener('keyup',e=>{if(CUR&&running&&CUR.key)CUR.key(e.key,false)});
document.addEventListener('visibilitychange',()=>{last=performance.now()});

  start(){const html=new TextDecoder().decode(Uint8Array.from(atob(VUELO_B64),c=>c.charCodeAt(0)));const f=document.createElement('iframe');f.title='Despegue';f.setAttribute('allow','autoplay');f.srcdoc=html;
    const L=$('glayer');L.appendChild(f);const b=document.createElement('button');b.className='back solo';b.dataset.exit='';b.textContent='← Juegos';L.appendChild(b);setTimeout(()=>f.focus(),300)},

GAMES.push({id:'torre',name:'Torre',icon:'🏗️',desc:'Toca para soltar cada bloque. Lo que sobresale se corta. Encaja perfecto para hacer combo.',g:'linear-gradient(160deg,#ff8a4c,#7a1e3a)',
  start(){const T=this;T.bw=Math.min(W*.62,340);T.bh=Math.max(20,Math.min(30,H/26));T.stack=[{x:(W-T.bw)/2,w:T.bw}];T.cam=0;T.camT=0;T.debris=[];T.combo=0;T.score=0;T.dead=false;T.fx=[];T.newBlock();HUD.score(0);HUD.msg('Toca para soltar','')},
  newBlock(){const T=this,top=T.stack[T.stack.length-1];const from=Math.random()<.5?-1:1;T.mov={w:top.w,x:from<0?-top.w:W,dir:-from,sp:Math.min(520,190+T.score*9)}},
  hue(i){return (20+i*9)%360},
  yOf(i){return H*.72-i*this.bh},
  down(){const T=this;if(T.dead)return;HUD.msg('');const top=T.stack[T.stack.length-1],m=T.mov;const l=Math.max(m.x,top.x),r=Math.min(m.x+m.w,top.x+top.w);const ov=r-l;
    if(ov<=0){T.debris.push({x:m.x,w:m.w,i:T.stack.length,vy:0,y:0,rot:0,vr:rand(-2,2)});T.dead=true;setTimeout(()=>gameOver(T.score,{label:'Altura'}),700);SFX.bad();return}
    let nx=l,nw=ov;if(Math.abs(m.x-top.x)<4){nx=top.x;nw=top.w;T.combo++;SFX.perfect();T.fx.push({i:T.stack.length,t:.5});if(T.combo>=3&&nw<T.bw){nw=Math.min(T.bw,nw+10);nx=Math.max(0,nx-5)}}
    else{T.combo=0;SFX.tap();const cutX=m.x<top.x?m.x:r,cutW=m.w-ov;T.debris.push({x:cutX,w:cutW,i:T.stack.length,vy:0,y:0,rot:0,vr:(m.x<top.x?-1:1)*rand(1,3)})}
    T.stack.push({x:nx,w:nw});T.score++;HUD.score(T.score);if(T.combo>=2)HUD.msg('¡Perfecto x'+T.combo+'!','');T.newBlock()},
  key(k,d){if(d&&(k===' '||k==='Enter'||k==='ArrowDown'))this.down()},
  update(dt){const T=this;if(!T.dead){const m=T.mov;m.x+=m.dir*m.sp*dt;if(m.x>W-m.w*.2&&m.dir>0)m.dir=-1;if(m.x<-m.w*.8&&m.dir<0)m.dir=1}
    T.camT=Math.max(0,(T.stack.length-8)*T.bh);T.cam+=(T.camT-T.cam)*Math.min(1,dt*6);
    T.debris.forEach(d=>{d.vy+=1400*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt});T.debris=T.debris.filter(d=>d.y<H*2);T.fx.forEach(f=>f.t-=dt);T.fx=T.fx.filter(f=>f.t>0)},
  block(x,y,w,i,a=1){const h=this.bh,c=cx;c.globalAlpha=a;c.fillStyle=`hsl(${this.hue(i)} 75% 58%)`;c.fillRect(x,y,w,h);c.fillStyle=`hsl(${this.hue(i)} 70% 44%)`;c.fillRect(x,y+h*.72,w,h*.28);c.fillStyle='rgba(255,255,255,.25)';c.fillRect(x,y,w,3);c.globalAlpha=1},
  draw(){const T=this,c=cx;const g=c.createLinearGradient(0,0,0,H);const hh=T.hue(T.stack.length);g.addColorStop(0,`hsl(${hh} 45% 16%)`);g.addColorStop(1,`hsl(${(hh+40)%360} 50% 6%)`);c.fillStyle=g;c.fillRect(0,0,W,H);
    c.save();c.translate(0,T.cam);T.stack.forEach((b,i)=>T.block(b.x,T.yOf(i),b.w,i));
    T.fx.forEach(f=>{const b=T.stack[f.i];if(!b)return;c.strokeStyle=`rgba(255,255,255,${f.t*2})`;c.lineWidth=3;c.strokeRect(b.x-6*(1-f.t),T.yOf(f.i)-6*(1-f.t),b.w+12*(1-f.t),T.bh+12*(1-f.t))});
    if(!T.dead){const m=T.mov;T.block(m.x,T.yOf(T.stack.length),m.w,T.stack.length)}

  start(){const T=this;T.lv=1;T.score=0;T.lives=3;T.pw=Math.min(W*.26,130);T.px=W/2;T.build();T.ball();HUD.score(0);HUD.msg('Arrastra para mover · toca para lanzar','')},
  build(){const T=this;const cols=Math.max(6,Math.min(10,Math.floor(W/60))),rows=Math.min(8,3+T.lv);const bw=(Math.min(W,620)-20)/cols,ox=(W-bw*cols)/2;T.bricks=[];
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)T.bricks.push({x:ox+c*bw+2,y:90+r*24,w:bw-4,h:20,hp:r<T.lv-2?2:1,col:`hsl(${(r*36+T.lv*30)%360} 75% 58%)`})},
  ball(){const T=this;T.b={x:T.px,y:H-80,vx:0,vy:0,r:8,stuck:true}},
  down(x){const T=this;HUD.msg('');T.px=clamp(x,T.pw/2,W-T.pw/2);if(T.b.stuck){T.b.stuck=false;const sp=Math.min(760,380+T.lv*40);T.b.vx=rand(-.5,.5)*sp;T.b.vy=-sp}},
  drag(x){this.px=clamp(x,this.pw/2,W-this.pw/2)},
  key(k,d){this.keys=this.keys||{};this.keys[k]=d;if(d&&k===' ')this.down(this.px)},
  update(dt){const T=this;const K=T.keys||{};if(K.ArrowLeft)T.px-=640*dt;if(K.ArrowRight)T.px+=640*dt;T.px=clamp(T.px,T.pw/2,W-T.pw/2);const b=T.b;
    if(b.stuck){b.x=T.px;b.y=H-80;return}const st=Math.ceil(Math.hypot(b.vx,b.vy)*dt/6);for(let s=0;s<st;s++){b.x+=b.vx*dt/st;b.y+=b.vy*dt/st;
      if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<70+b.r){b.y=70+b.r;b.vy=Math.abs(b.vy)}
      if(b.vy>0&&b.y+b.r>=H-66&&b.y<H-50&&Math.abs(b.x-T.px)<T.pw/2+b.r){const sp=Math.hypot(b.vx,b.vy),a=(b.x-T.px)/(T.pw/2)*1.05;b.vx=Math.sin(a)*sp;b.vy=-Math.cos(a)*sp;SFX.tap()}
      for(const k of T.bricks){if(k.hp>0&&b.x+b.r>k.x&&b.x-b.r<k.x+k.w&&b.y+b.r>k.y&&b.y-b.r<k.y+k.h){k.hp--;const ox=Math.min(b.x+b.r-k.x,k.x+k.w-(b.x-b.r)),oy=Math.min(b.y+b.r-k.y,k.y+k.h-(b.y-b.r));if(ox<oy)b.vx*=-1;else b.vy*=-1;if(k.hp<=0){T.score+=10*T.lv;HUD.score(T.score);SFX.good()}else SFX.tap();break}}}
    T.bricks=T.bricks.filter(k=>k.hp>0);if(!T.bricks.length){T.lv++;SFX.win();HUD.msg('¡Nivel '+T.lv+'!','');setTimeout(()=>HUD.msg(''),900);T.build();T.ball()}
    if(b.y>H+20){T.lives--;SFX.bad();if(T.lives<=0){T.lives=0;b.vy=0;b.vx=0;b.y=H+100;setTimeout(()=>gameOver(T.score,{label:'Puntos',sub:'Nivel '+T.lv}),300);T.b.stuck=true;T.b.dead=true}else T.ball()}},
  draw(){const T=this,c=cx;c.fillStyle='#03140b';c.fillRect(0,0,W,H);T.bricks.forEach(k=>{c.fillStyle=k.col;c.globalAlpha=k.hp>1?1:.85;c.beginPath();c.roundRect(k.x,k.y,k.w,k.h,5);c.fill();if(k.hp>1){c.strokeStyle='#fff';c.lineWidth=2;c.stroke()}});c.globalAlpha=1;
    c.fillStyle='#e8fff2';c.beginPath();c.roundRect(T.px-T.pw/2,H-66,T.pw,14,7);c.fill();if(!T.b.dead){c.fillStyle='#ffc21a';c.shadowColor='#ffc21a';c.shadowBlur=14;c.beginPath();c.arc(T.b.x,T.b.y,T.b.r,0,7);c.fill();c.shadowBlur=0}
    c.font='18px system-ui';c.textAlign='left';c.fillText('⚪'.repeat(T.lives),14,H-20)}});

const CATS={"vuelo": "Arcade", "torre": "Habilidad", "reflejos": "Reflejos", "serpiente": "Arcade", "esquiva": "Arcade", "carretera": "Arcade", "topos": "Habilidad", "memoria": "Puzle", "diana": "Habilidad", "pong": "Deportes", "2048": "Puzle", "salta": "Arcade", "rompe": "Arcade"};
const HERO_BG=COVERS.vuelo;
let HUBF='Todos';
function bestTxt(g){const b=getBest(g.id);return g.bestText?g.bestText():(b==null?'Sin jugar':'Récord <b>'+(g.fmt?g.fmt(b):b)+'</b>')}
function renderHub(){
  const f=GAMES.find(g=>g.id==='vuelo');
  $('feat').innerHTML=`<div class="fimg" style="--img:url('${COVERS.vuelo}'),url('${HERO_BG}')"></div><div class="fshade"></div><div class="fbody"><span class="fkick">Destacado</span><h1>${f.name}</h1><p>${f.desc}</p><div class="fact"><button class="fplay" data-game="vuelo">▶ Jugar ahora</button><span class="fbest">${bestTxt(f)}</span></div></div>`;
  const cats=['Todos','Arcade','Habilidad','Puzle','Reflejos','Deportes','2 jugadores'];
  $('chips').innerHTML=cats.map(c=>`<button class="chipf ${HUBF===c?'on':''}" data-hf="${c}">${c}</button>`).join('');
  const list=GAMES.filter(g=>HUBF==='Todos'||(HUBF==='2 jugadores'?g.badge:CATS[g.id]===HUBF));
  $('grid').innerHTML=list.map(g=>`<button class="card" data-game="${g.id}" style="--g:${g.g}"><div class="art"><img src="${COVERS[g.id]}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"><div class="ashade"></div><span class="acat">${CATS[g.id]}</span>${g.badge?`<span class="abadge">👥 ${g.badge}</span>`:''}<div class="atitle">${g.name}</div></div><div class="cbody"><div class="cdesc">${g.desc}</div><div class="cfoot"><span class="cbest">${bestTxt(g)}</span><span class="play">Jugar</span></div></div></button>`).join('')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-hf]');if(c){HUBF=c.dataset.hf;renderHub()}});
function drawArts(){}
const plane=(c,x,y,r,s=1,col='#fff',w='#2e8bff')=>{c.save();c.translate(x,y);c.rotate(r);c.scale(s,s);c.fillStyle=col;c.beginPath();c.ellipse(0,0,24,7,0,0,7);c.fill();c.fillStyle=w;c.beginPath();c.moveTo(-6,0);c.lineTo(-15,-13);c.lineTo(-9,-13);c.lineTo(4,0);c.fill();c.beginPath();c.moveTo(-18,-2);c.lineTo(-24,-11);c.lineTo(-20,-11);c.lineTo(-13,-2);c.fill();c.restore()};
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.rect(x,y,w,h)}}
renderAcct();renderHub();
</script>
