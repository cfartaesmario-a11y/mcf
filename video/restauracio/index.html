<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Restauració · Història</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23b4472f'/%3E%3Cpath d='M9 7l9 5-9 5z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#0f0d0b;--card:#1b1714;--ink:#f3ece2;--mu:#b9ab98;--ac:#d7a04a;--line:rgba(243,236,226,.12)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(120% 80% at 50% 0,#2a201a,var(--bg));color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
header a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px}
header a:hover{background:rgba(255,255,255,.06)}
main{max-width:1100px;margin:0 auto;padding:22px 16px 40px}
.tag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700}
h1{margin:4px 0 4px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,5vw,46px);line-height:1.1}
p{color:var(--mu);margin:0 0 18px}
.player{position:relative;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.55);border:1px solid var(--line)}
video{display:block;width:100%;aspect-ratio:16/9;background:#000}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--mu)}
.err{margin-top:12px;color:#ffb4a6}
</style>
</head>
<body>
<header><a href="../../">← MCF Workspace</a></header>
<main>
  <span class="tag">Història · Tema 1</span>
  <h1>La Restauració</h1>
  <p>Vídeo de classe per repassar el tema.</p>
  <div class="player"><video id="v" controls playsinline preload="metadata" poster="poster.jpg"></video></div>
  <div class="meta"><span>⏱ 25 min 45 s</span><span>Full HD 1080p</span><span id="pos"></span></div>
  <div class="err" id="err" hidden></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
(function(){
  var v=document.getElementById('v'),src='hls/index.m3u8',K='mcf.video.restauracio.t';
  function err(m){var e=document.getElementById('err');e.textContent=m;e.hidden=false}
  if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src}
  else if(window.Hls&&Hls.isSupported()){var h=new Hls({maxBufferLength:30});h.loadSource(src);h.attachMedia(v);h.on(Hls.Events.ERROR,function(_,d){if(d.fatal)err('No se ha podido cargar el vídeo. Revisa la conexión y recarga la página.')})}
  else err('Este navegador no puede reproducir el vídeo. Prueba con Chrome, Edge o Safari.');
  // seguir por donde lo dejaste
  var saved=0;try{saved=+localStorage.getItem(K)||0}catch(e){}
  v.addEventListener('loadedmetadata',function(){if(saved>5&&saved<v.duration-10){v.currentTime=saved;document.getElementById('pos').textContent='▶ Continúas donde lo dejaste'}});
  var last=0;v.addEventListener('timeupdate',function(){if(Math.abs(v.currentTime-last)>5){last=v.currentTime;try{localStorage.setItem(K,String(Math.floor(v.currentTime)))}catch(e){}}});
})();
</script>
</body>
</html>
