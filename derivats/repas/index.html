function baseList(mode){

const IDLE=60000;           // si passes 60 s sense tocar res, el rellotge s'atura

function testOn(){return S.test&&!S.test.finished;}
function commit(){
  if(!testOn()||t0===null)return;
  const now=Date.now(),end=Math.min(now,lastAct+IDLE);
  if(end>t0)S.test.elapsed+=end-t0;
  t0=now>lastAct+IDLE?null:now;
}
function activeNow(){commit();return testOn()?S.test.elapsed:0;}

function estimate(){
  const T=S.test;let pool=T.samples.length>=5?T.samples.slice(-25):S.speed.concat(T.samples).slice(-25);
  if(pool.length<3)return null;
  const rates=pool.map(s=>s.ms/s.b).sort((a,b)=>a-b);const med=rates[Math.floor(rates.length/2)];
  const f=pool.filter(s=>s.ms/s.b<=med*2.5);
  const rate=f.reduce((a,s)=>a+s.ms,0)/f.reduce((a,s)=>a+s.b,0);  // ms per buit
  const rem=list();if(!rem.length)return {rate,left:0,initial:T.samples.length<5};
  const cur=rem[0],spent=activeNow()-qStart;
  const restB=rem.slice(1).reduce((a,it)=>a+blanks(it),0);
  const left=rate*restB+Math.max(0,rate*blanks(cur)-spent);
  return {rate,left,initial:T.samples.length<5};
}
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?h+" h "+String(m).padStart(2,"0")+" min":m+" min "+String(r).padStart(2,"0")+" s";};
const clock=ms=>{const d=new Date(Date.now()+ms);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};

function tick(){
  if(!testOn()||!$("m-el"))return;
  const T=S.test,el=activeNow();

  $("m-state").textContent=t0===null?"En pausa (toca una tecla)":"";
  const e=estimate();
  if(!e){$("m-left").textContent="calculant…";$("m-eta").textContent="—";$("m-rate").textContent="en respons "+Math.max(1,3-S.speed.length-T.samples.length)+" més";}
  else{$("m-left").textContent=fmt(e.left)+(e.initial?" ≈":"");$("m-eta").textContent=clock(e.left);
    const avgB=T.queue.reduce((a,id)=>a+(BYID[id]?blanks(BYID[id]):0),0)/total;$("m-rate").textContent=(e.rate*avgB/1000).toFixed(1).replace(".",",")+" s/preg.";}
  if(Date.now()-lastSave>5000){lastSave=Date.now();save();}
}
setInterval(tick,500);

/* ---------- pantalla ---------- */
function render(){
  L=list();
  if(testOn())idx=0;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===(S.test?S.test.mode:S.mode)));
  if(idx>=L.length)idx=Math.max(0,L.length-1);
  renderTestbar();
  const card=$("card");checked=false;retype=false;
  if(S.test&&S.test.finished){renderSummary();renderMap();stats();return;}
  if(!L.length){card.innerHTML='<div class="empty">'+(S.mode==="bad"?"Cap errada pendent. Bona feina!":"No hi ha preguntes.")+'</div>';renderMap();stats();return;}
  const it=L[idx];
  let k=0;
  const html=esc(it.text).replace(/\((?:[^()]|\([^()]*\))*\)/g,m=>'<span class="hint">'+m+'</span>').replace(/\{\}/g,()=>{const id="in-"+(k);k++;return '<input id="'+id+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Paraula derivada '+k+'">';});
  const pos=testOn()?(Object.keys(S.test.done).length+1)+' / '+S.test.queue.length+' · test':(idx+1)+' / '+L.length;
  card.innerHTML=
   '<div class="meta"><span>'+pos+' · '+label(it)+'</span><span class="tag">'+it.cat+'</span></div>'+
   '<p class="sentence">'+html+'</p>'+
   '<div id="fb" hidden></div>'+
   '<div class="actions">'+(testOn()?'':'<button class="btn" id="prev" aria-label="Anterior">←</button>')+'<button class="btn primary" id="go">Comprova</button><button class="btn" id="skip">'+(testOn()?'Deixa-la per al final':'Salta →')+'</button></div>'+
   '<div class="kbd">Enter per comprovar · Enter de nou per passar a la següent</div>';
  const ins=[...card.querySelectorAll("input")];
  ins.forEach((inp,i)=>{
    inp.addEventListener("input",()=>{inp.style.width=Math.max(9,inp.value.length+2)+"ch";});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(checked)next();else if(retype){const r=document.querySelector(".rt-in:not(.ok)");if(r)r.focus();}else if(i<ins.length-1&&!ins[i+1].value)ins[i+1].focus();else check();}});
  });
  $("go").onclick=()=>checked?next():retype?checkRetype():check();
  $("skip").onclick=skip;
  if($("prev"))$("prev").onclick=()=>{idx=(idx-1+L.length)%L.length;S.pos[S.mode]=idx;save();render();};
  if(ins[0])setTimeout(()=>ins[0].focus({preventScroll:true}),0);
  qStart=activeNow();
  renderMap();stats();
}
function renderSummary(){
  const T=S.test;let ok=0,w=0,b=0;Object.values(T.res).forEach(r=>{if(r==="ok")ok++;else if(r==="warn")w++;else b++;});
  const n=Object.keys(T.done).length;
  $("card").innerHTML='<div class="summary"><h2>Test acabat</h2>'+
   '<div class="sgrid"><div class="m"><small>Temps total</small><b>'+fmt(T.elapsed)+'</b></div>'+
   '<div class="m"><small>Per pregunta</small><b>'+(n?(T.elapsed/n/1000).toFixed(1).replace(".",","):"0")+' s</b></div>'+
   '<div class="m s-ok"><small>Bé</small><b>'+ok+'</b></div><div class="m s-warn"><small>Accent</small><b>'+w+'</b></div><div class="m s-bad"><small>Malament</small><b>'+b+'</b></div></div>'+
   '<div class="actions">'+(b?'<button class="btn primary" id="sbad">Repassa les '+b+' errades</button>':'')+'<button class="btn" id="sclose">Tanca</button></div></div>';
  $("sclose").onclick=()=>{S.test=null;save();render();};
  if($("sbad"))$("sbad").onclick=()=>{S.test=null;S.mode="bad";idx=0;save();render();};
}

function check(){
  const it=L[idx];const ins=[...document.querySelectorAll("#card input")];
  let worst="ok";const notes=[],rs=[];
  ins.forEach((inp,i)=>{
    const v=norm(inp.value);const alts=it.ans[i];
    let r="bad";
    if(alts.some(a=>norm(a)===v))r="ok";
    else if(v&&alts.some(a=>loose(a)===loose(v))){r="warn";const a=alts.find(a=>loose(a)===loose(v));notes.push({t:"warn",w:a,u:inp.value});}
    else notes.push({t:"bad",w:alts.join(" / "),u:inp.value});
    inp.classList.add(r);inp.readOnly=true;rs.push(r);
    if(r==="bad")worst="bad";else if(r==="warn"&&worst!=="bad")worst="warn";
  });
  S.res[it.id]=worst;if(testOn())S.test.res[it.id]=worst;save();checked=worst==="ok";
  const fb=$("fb");fb.hidden=false;fb.className="fb "+worst;
  let h="";
  if(worst==="ok")h="<strong>Correcte!</strong>";
  else if(worst==="warn")h="<strong>Bé, però vigila l'accent</strong>";
  else h="<strong>No és correcte</strong>";
  notes.forEach(n=>{
    if(n.t==="warn")h+='<span>Has escrit <b>'+esc(n.u)+'</b>. Porta accent o signe: <span class="ans"><b>'+esc(n.w)+'</b></span></span>';
    else h+='<span>Resposta: <span class="ans"><b>'+esc(n.w)+'</b></span>'+(n.u?' (has escrit '+esc(n.u)+')':'')+'</span>';
  });
  if(worst==="ok"&&it.ans.some(a=>a.length>1))h+='<span>També val: '+it.ans.map(a=>a.join(" / ")).join(" · ")+'</span>';
  fb.innerHTML=h;
  $("skip").hidden=true;
  if(worst==="ok"){$("go").textContent="Següent →";$("go").focus({preventScroll:true});}
  else{
    retype=true;
    const box=document.createElement("div");box.className="retype";
    box.innerHTML='<span class="rt-label">Ara escriu-la bé per recordar-la</span><div class="rt-row">'+
      rs.map((r,i)=>r==="ok"?"":'<input class="rt-in" data-i="'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escriu bé la paraula '+(i+1)+'">').join("")+
      '</div><span class="rt-msg" id="rt-msg" hidden></span>';
    fb.after(box);
    const rins=[...box.querySelectorAll(".rt-in")];
    rins.forEach((ri,j)=>{
      ri.addEventListener("input",()=>{ri.classList.remove("bad");ri.style.width=Math.max(12,ri.value.length+2)+"ch";});
      ri.addEventListener("keydown",e=>{if(e.key!=="Enter")return;e.preventDefault();
        if(checked)return next();
        if(j<rins.length-1&&!rins[j+1].value)rins[j+1].focus();else checkRetype();});
    });
    $("go").textContent="Comprova de nou";
    setTimeout(()=>rins[0].focus({preventScroll:true}),0);
  }
  renderMap();stats();
}
function checkRetype(){
  const it=L[idx];const rins=[...document.querySelectorAll(".rt-in")];let all=true;
  rins.forEach(ri=>{const alts=it.ans[+ri.dataset.i];const good=alts.some(a=>norm(a)===norm(ri.value));
    ri.classList.toggle("ok",good);ri.classList.toggle("bad",!good);if(good)ri.readOnly=true;else all=false;});
  const msg=$("rt-msg");
  if(all){retype=false;checked=true;msg.hidden=false;msg.className="rt-msg ok";msg.textContent="Molt bé, ara ja la saps.";
    $("go").textContent="Següent →";$("go").focus({preventScroll:true});}
  else{msg.hidden=false;msg.className="rt-msg bad";msg.textContent="Encara no. Copia-la exactament, amb accents.";
    const f=rins.find(r=>!r.classList.contains("ok"));if(f){f.focus();f.select();}}
}
function next(){
  if(testOn()){
    const it=L[0];
    if(checked){
      const ms=Math.min(activeNow()-qStart,120000),smp={ms,b:blanks(it)};
      if(ms>800){S.test.samples.push(smp);S.speed.push(smp);if(S.speed.length>60)S.speed=S.speed.slice(-60);}
      S.test.done[it.id]=true;
      if(!list().length)finishTest();
      save();render();return;
    }
    return skip();
  }
  if(S.mode==="bad"&&checked&&S.res[L[idx].id]!=="bad"){S.pos[S.mode]=idx;save();render();return;}
  idx=(idx+1)%Math.max(1,L.length);S.pos[S.mode]=idx;save();render();
}
function skip(){
  if(testOn()){
    if(checked)return next();
    const id=L[0].id,q=S.test.queue;q.splice(q.indexOf(id),1);q.push(id);save();render();return;
  }
  idx=(idx+1)%Math.max(1,L.length);S.pos[S.mode]=idx;save();render();
}
function renderMap(){
  const m=$("map");m.innerHTML="";
  const inTest=!!S.test;
  $("maptitle").textContent=inTest?"Preguntes del test":S.mode==="bad"?"Errades pendents":"Preguntes";
  const items=inTest?S.test.queue.map(id=>BYID[id]).filter(Boolean):L;
  const cur=L[idx];
  items.forEach((it,i)=>{const b=document.createElement("button");b.textContent=it.src==="p"&&(inTest?S.test.mode:S.mode)==="all"?"P"+it.n:it.n;
    const r=inTest?S.test.res[it.id]:S.res[it.id];if(r&&(!inTest||S.test.done[it.id]))b.classList.add(r);if(!inTest||!S.test.finished)if(cur&&it.id===cur.id)b.classList.add("cur");
    b.setAttribute("aria-label",label(it));
    if(inTest)b.disabled=true;else b.onclick=()=>{idx=i;S.pos[S.mode]=idx;save();render();window.scrollTo({top:0,behavior:"smooth"});};
    m.appendChild(b);});
}
function stats(){
  const base=S.mode==="bad"&&!S.test?ITEMS:S.test?S.test.queue.map(id=>BYID[id]).filter(Boolean):list();
  let ok=0,w=0,b=0;base.forEach(it=>{const r=S.res[it.id];if(r==="ok")ok++;else if(r==="warn")w++;else if(r==="bad")b++;});
  const tot=base.length||1;
  $("st-done").textContent=(ok+w+b)+"/"+base.length;$("st-ok").textContent=ok;$("st-warn").textContent=w;$("st-bad").textContent=b;
  $("b-ok").style.width=ok/tot*100+"%";$("b-warn").style.width=w/tot*100+"%";$("b-bad").style.width=b/tot*100+"%";
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(testOn())return;S.test=null;S.mode=b.dataset.mode;idx=S.pos[S.mode]||0;save();render();});
$("shuffle").checked=!!S.shuffle;
$("shuffle").onchange=e=>{S.shuffle=e.target.checked;S.order={};idx=0;S.pos={};save();render();};
function resetUI(){
  const z=$("resetzone");
  z.innerHTML='<span class="confirm">Segur? <button class="linkbtn" id="yes">Sí, esborra</button><button class="linkbtn" id="no" style="color:var(--muted)">No</button></span>';
  $("yes").onclick=()=>{S.res={};S.pos={};S.order={};S.test=null;idx=0;save();z.innerHTML='<button class="linkbtn" id="reset">Esborrar progrés</button>';$("reset").onclick=resetUI;render();};
  $("no").onclick=()=>{z.innerHTML='<button class="linkbtn" id="reset">Esborrar progrés</button>';$("reset").onclick=resetUI;};
}
$("reset").onclick=resetUI;
idx=S.pos[S.mode]||0;
if(testOn()&&!document.hidden)t0=Date.now();
render();
</script>

</body></html>
