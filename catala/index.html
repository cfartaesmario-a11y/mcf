<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tema 2 · El Catalanisme</title>
<meta name="theme-color" content="#0a0a0a">
<script>
/* se borra solo a las 50 h de subirlo: jue 5 nov 2026, 22:56 UTC */
if (!(Date.now() < Date.UTC(2026, 10, 5, 22, 56))) location.replace('/mcf/');
</script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0a0a;color:#f2f2f3;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{display:flex;align-items:center;gap:12px;padding:14px 18px;max-width:1100px;margin:0 auto}
.bar a{color:#cfcfd3;text-decoration:none;font-weight:700;font-size:14px;border:1px solid #2a2a2e;border-radius:10px;padding:8px 12px}
.bar a:hover{border-color:#555}
.bar h1{font-size:clamp(17px,2.4vw,22px);margin:0;flex:1;min-width:0}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px 40px}
video{width:100%;border-radius:14px;background:#000;display:block;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.note{color:#8a8a90;font-size:13px;margin:14px 2px 0;line-height:1.5}
#lock{position:fixed;inset:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
#lock .card{width:100%;max-width:340px;text-align:center}
#lock h2{font-size:19px;margin:0 0 6px}
#lock p{color:#8a8a90;font-size:13px;margin:0 0 18px}
#lock input{width:100%;font-size:24px;letter-spacing:8px;text-align:center;padding:14px;border-radius:12px;border:1px solid #2a2a2e;background:#141416;color:#f2f2f3;outline:none}
#lock input:focus{border-color:#d4b24a}
#lock button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:linear-gradient(145deg,#d4b24a,#9a1f1f);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
#lock .err{color:#ff7a7a;font-size:13px;height:16px;margin-top:10px}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="lock">
  <div class="card">
    <h2>Vídeo protegido</h2>
    <p>Introduce el código para ver el vídeo</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••">
    <button id="go">Entrar</button>
    <div class="err" id="err"></div>
  </div>
</div>
<div id="app" class="hidden">
  <div class="bar"><a href="/mcf/">‹ MCF Workspace</a><h1>Tema 2 · El Catalanisme</h1></div>
  <div class="wrap">
    <video id="vid" controls playsinline preload="none"></video>
    <p class="note">Vídeo temporal: se borrará solo a las 50 horas de haberlo subido.</p>
  </div>
</div>
<script>
(function(){
  var CODE='2009', lock=document.getElementById('lock'), app=document.getElementById('app');
  function open(){
    lock.classList.add('hidden'); app.classList.remove('hidden');
    var v=document.getElementById('vid'); if(!v.src) v.src='catalanisme.mp4';
    try{sessionStorage.setItem('catala.ok','1');}catch(e){}
  }
  try{ if(sessionStorage.getItem('catala.ok')==='1'){ open(); } }catch(e){}
  var pw=document.getElementById('pw'), err=document.getElementById('err');
  function check(){
    if(pw.value===CODE){ err.textContent=''; open(); }
    else{ err.textContent='Código incorrecto'; pw.value=''; pw.focus(); }
  }
  document.getElementById('go').addEventListener('click',check);
  pw.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
  if(lock.classList.contains('hidden')===false) pw.focus();
})();
</script>
</body>
</html>
