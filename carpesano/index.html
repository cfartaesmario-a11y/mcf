<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="favicon.svg"><meta name="theme-color" content="#18181a"><style>html,body{margin:0;padding:0}[hidden]{display:none!important}</style></head><body>
<title>MCF Carpesano</title>
<meta name="description" content="MCF Carpesano: apuntes a mano con boli y fosforito, ordenados por separadores y guardados en tu cuenta MCF.">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital@1&display=swap">
<style>
/* Layout: fondo neutro y sobrio con la hoja A4 en el centro, barra arriba y estuche abajo; el carpesano se abre encima. */
:root{
  --chrome:#f4f4f5; --chrome-2:#e7e7ea; --line:#d4d4d8; --text:#18181b; --muted:#62626a;
  --accent:#18181b; --accent-ink:#ffffff; --panel:#ffffff; --danger:#b3261e; --ok:#2f7d4f;
  --tray-1:#18181a; --tray-2:#0f0f10;
  --stage:#2a2a2d; --stage-ink:#ececee;
  --board:#d8d8dc; --board-2:#c9c9ce; --sheet:#fbfbf8; --cover:#2b2b2f; --cover-2:#1d1d20;
  --shadow:0 14px 40px rgba(0,0,0,.22);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --chrome:#18181a; --chrome-2:#252528; --line:#34343a; --text:#ececee; --muted:#9b9ba3;
  --accent:#f2f2f3; --accent-ink:#111113; --panel:#222225; --danger:#ff8a80; --ok:#7fd3a0;
  --board:#2e2e33; --board-2:#26262a; --sheet:#f1f1ee;
  --shadow:0 14px 40px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --chrome:#18181a; --chrome-2:#252528; --line:#34343a; --text:#ececee; --muted:#9b9ba3;
  --accent:#f2f2f3; --accent-ink:#111113; --panel:#222225; --danger:#ff8a80; --ok:#7fd3a0;
  --board:#2e2e33; --board-2:#26262a; --sheet:#f1f1ee;
  --shadow:0 14px 40px rgba(0,0,0,.55); color-scheme:dark}
/* el fondo de la mesa lo elige la persona: grafito, negro o gris claro */
:root[data-bg="black"]{--stage:#09090a; --stage-ink:#ececee}
:root[data-bg="light"]{--stage:#e4e4e7; --stage-ink:#18181b}

[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#app{overflow:hidden}
body{background:var(--chrome);color:var(--text);font-family:var(--f-ui);font-size:14px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:6px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.grp{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.spacer{flex:1 1 auto;min-width:8px}
.btn{height:40px;min-width:40px;border-radius:10px;border:1px solid transparent;background:transparent;
  font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;white-space:nowrap}
.btn:hover{background:var(--chrome-2)}
.btn:disabled{opacity:.35;cursor:default;background:transparent}
.btn.on{background:var(--chrome-2);border-color:var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line)}
.btn svg{width:20px;height:20px;flex:0 0 auto}
.binder-btn{gap:8px;padding-left:6px}
.binder-btn .mini-binder{width:26px;height:30px;border-radius:3px 5px 5px 3px;background:linear-gradient(90deg,var(--cover-2) 0 22%,var(--cover) 22%);position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.binder-btn .mini-binder::after{content:"";position:absolute;left:9px;right:4px;top:9px;height:8px;background:#f3efe6;border-radius:1px}
.title-wrap{display:flex;flex-direction:column;min-width:0;flex:0 1 auto;padding:0 6px}
.note-title{font-family:var(--f-display);font-weight:600;font-size:16px;border:0;background:none;text-align:left;padding:2px 4px;border-radius:6px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-title:hover{background:var(--chrome-2)}
.title-input{font-family:var(--f-display);font-weight:600;font-size:16px;border:1px solid var(--accent);border-radius:6px;padding:2px 6px;background:var(--panel);color:var(--text);width:240px;-webkit-user-select:text;user-select:text}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:0 4px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.status.saved i{background:var(--ok)} .status.saving i{background:#e0a100} .status.error i{background:var(--danger)}
.status.error{color:var(--danger)}
.pager{font-variant-numeric:tabular-nums;font-weight:600;min-width:44px;text-align:center;font-size:13px}

/* ---------- mesa y hoja ---------- */
#stage{position:relative;overflow:hidden;touch-action:none;background:var(--stage)}
#stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.paper{position:absolute;left:0;top:0;z-index:1;pointer-events:none;
  box-shadow:0 1px 2px rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.35)}
#cHl,#cLive.hl{mix-blend-mode:multiply}
#cInk,#cLive.pen{-webkit-mask-image:var(--grain);mask-image:var(--grain);-webkit-mask-size:90px 90px;mask-size:90px 90px}
.sel{position:absolute;border:calc(1.5px * var(--iz,1)) dashed #2f6fd6;border-radius:4px;pointer-events:none;box-sizing:border-box}
.sel .handle{position:absolute;right:-12px;bottom:-12px;width:22px;height:22px;border-radius:50%;background:#2f6fd6;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transform:scale(var(--iz,1));transform-origin:50% 50%}
.sel-bar{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:var(--shadow);pointer-events:auto;white-space:nowrap}
.sel-bar .btn{height:34px;font-size:13px}
.zoomctl{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;z-index:5;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:3px}
.zoomctl .btn{height:36px;min-width:38px;font-size:18px}
.zoomctl #zPct{font-size:13px;font-variant-numeric:tabular-nums;min-width:64px}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(28,24,36,.86);color:#f4f0fa;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.4;max-width:min(520px,calc(100% - 32px));text-align:center;z-index:6;transition:opacity .4s}

/* ---------- estuche ---------- */
.tray{position:relative;height:122px;display:flex;align-items:flex-end;gap:4px;overflow-x:auto;overflow-y:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(180deg,var(--tray-1),var(--tray-2));
  box-shadow:inset 0 8px 14px rgba(0,0,0,.45);border-top:1px solid rgba(255,255,255,.06);scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.tray-sec{display:flex;align-items:flex-end;gap:4px;flex:0 0 auto;height:100%;position:relative;padding-top:20px}
.tray-sec>.lbl{position:absolute;top:6px;left:2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:600;white-space:nowrap}
.tray-div{width:1px;align-self:stretch;margin:14px 10px 10px;background:rgba(255,255,255,.1);flex:0 0 auto}
.tool{position:relative;flex:0 0 auto;border:0;background:none;padding:0;width:30px;height:150px;transform:translateY(58px);transition:transform .22s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.tool.wide{width:38px}
.tool.chip{width:56px}
.tool:hover{transform:translateY(50px)}
.tool.on{transform:translateY(16px)}
.tool svg{width:100%;height:100%;display:block;overflow:visible}
.tool .swatch-dot{position:absolute;left:50%;top:-8px;width:10px;height:10px;border-radius:50%;transform:translateX(-50%);border:2px solid rgba(255,255,255,.8);display:none}
.tool.custom .swatch-dot{display:block}
.tray-info{margin-left:auto;align-self:center;color:rgba(255,255,255,.7);font-size:12px;line-height:1.35;padding-left:16px;flex:0 0 auto;text-align:right}
.tray-info b{color:#fff;font-weight:600;display:block;font-size:13px}

/* ---------- popovers y diálogos ---------- */
.pop{position:fixed;z-index:75;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px;max-width:calc(100vw - 32px);max-height:calc(100% - 140px);overflow:auto}
.pop h3{font-family:var(--f-display);font-size:15px;margin:0 0 10px;font-weight:600}
.pop h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;font-weight:600}
.pop h4:first-of-type{margin-top:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.paper-opt{width:84px;border:2px solid transparent;border-radius:10px;background:none;padding:4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500}
.paper-opt canvas{width:72px;height:96px;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.paper-opt.on{border-color:var(--accent)}
.color-opt{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;font-size:12px;width:74px;padding:2px}
.color-opt span{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);display:block}
.color-opt.on span{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--accent)}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0}
.switch{position:relative;width:46px;height:28px;flex:0 0 auto}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:14px;background:var(--line);transition:.2s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.seg{display:flex;background:var(--chrome-2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;width:min(500px,calc(100vw - 60px))}
.ins{border:1px solid var(--line);background:var(--chrome);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.ins:hover{border-color:var(--accent)}
.ins svg{width:64px;height:44px;color:var(--text)}
.stepper{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--chrome);font-weight:700}
.stepper output{min-width:20px;text-align:center;font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.sw.on{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--accent)}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:2px}
.danger{color:var(--danger)}

.scrim{position:fixed;inset:0;z-index:80;background:rgba(18,12,28,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:20px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto}
.dlg h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 4px;text-wrap:balance}
.dlg p{color:var(--muted);margin:0 0 14px;line-height:1.45}
.dlg label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.dlg input[type=text]{width:100%;box-sizing:border-box;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--chrome);color:var(--text);padding:0 12px;font:500 16px var(--f-ui);-webkit-user-select:text;user-select:text}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.sec-pick{display:flex;flex-wrap:wrap;gap:8px}
.sec-chip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--chrome);border-radius:10px;padding:8px 12px 8px 8px;font-weight:600}
.sec-chip i{width:10px;height:22px;border-radius:3px}
.sec-chip.on{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 1px var(--accent)}
.newsec{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.newsec input[type=text]{flex:1 1 160px;height:40px}

/* ---------- carpesano: pestañas arriba, hojas debajo ---------- */
.binder{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;
  background:var(--stage);color:var(--stage-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.b-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding-bottom:18px}
.b-bar h2{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0;color:var(--stage-ink)}
.b-bar .btn{background:var(--panel);color:var(--text);border-color:var(--line);justify-self:start}
.b-bar .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;justify-self:end}
.b-tabs{display:flex;align-items:flex-end;gap:6px;overflow-x:auto;padding:0 10px;scrollbar-width:none;flex:0 0 auto}
.b-tabs::-webkit-scrollbar{display:none}
.b-tab{border:0;border-radius:10px 10px 0 0;padding:0 18px;min-height:46px;font-weight:600;font-size:15px;color:#fff;background:var(--c);
  display:flex;align-items:center;gap:8px;white-space:nowrap;flex:0 0 auto;filter:saturate(.7) brightness(.8);transition:min-height .15s}
.b-tab.on{filter:none;min-height:54px}
.b-tab .n{font-size:12px;font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.b-tab .dots{display:none;margin-left:2px;width:28px;height:28px;border-radius:8px;align-items:center;justify-content:center;background:rgba(0,0,0,.18);font-weight:700}
.b-tab.on .dots{display:inline-flex}
.b-tab.add{background:none;color:var(--stage-ink);border:1.5px dashed currentColor;border-bottom:0;opacity:.6;filter:none;font-size:22px;font-weight:400;padding:0 16px}
.b-page{flex:1;min-height:0;overflow:auto;background:var(--sheet);border-radius:12px;border-top:6px solid var(--c,#5b5b62);padding:22px;-webkit-overflow-scrolling:touch;color:#18181b}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px;align-content:start}
.sheet{border:0;background:none;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left;color:#18181b;position:relative}
.sheet .thumb{position:relative;width:100%;aspect-ratio:210/297;max-width:100%;background:#fbfbf8;box-shadow:0 1px 2px rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.12);border-radius:2px;overflow:hidden;transition:transform .2s}
.sheet:hover .thumb{transform:translateY(-3px)}
.sheet .thumb img{width:100%;height:100%;display:block;object-fit:cover}
.sheet b{font-size:14px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet.current .thumb{box-shadow:0 0 0 2px #18181b,0 6px 14px rgba(0,0,0,.12)}
.sheet .more{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:8px;border:0;background:rgba(255,255,255,.94);box-shadow:0 1px 3px rgba(0,0,0,.25);font-weight:800;color:#18181b;display:flex;align-items:center;justify-content:center}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:60px 10px;color:#62626a;text-align:center}
.empty strong{font-size:18px;font-weight:600;color:#18181b}
.tbl-prev{display:block;width:100%;max-width:300px;height:auto;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);margin:4px auto 6px;background:#fbfbf8}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:4px 0;margin-bottom:6px}
.menu-pop{min-width:200px;padding:6px}
.menu-pop button{display:flex;width:100%;border:0;background:none;border-radius:8px;padding:10px 12px;font-weight:600;text-align:left}
.menu-pop button:hover{background:var(--chrome-2)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:#231d2e;color:#f6f2fb;padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.flyer{position:fixed;z-index:90;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.3);border-radius:2px}

@media (max-width:720px){
  .note-title{max-width:140px}
  .b-page{padding:14px}
  .sheets{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
</style>

<div id="app">
  <header class="top">
    <div class="grp">
      <button class="btn binder-btn" id="openBinder" title="Abrir el carpesano"><span class="mini-binder"></span>Carpesano</button>
    </div>
    <div class="title-wrap">
      <button class="note-title" id="noteTitle" title="Cambiar el título">Apuntes</button>
      <div class="status" id="status"><i></i><span>Sin guardar</span></div>
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <button class="btn" id="undo" title="Deshacer (dos dedos)" aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="btn" id="redo" title="Rehacer" aria-label="Rehacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="grp">
      <button class="btn" id="paperBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M5 8h14M5 13h14M5 18h14M10 3v18M15 3v18" opacity=".55"/></svg>Hoja</button>
      <button class="btn" id="insertBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="1"/><path d="M3 9h18M9 4v14"/></svg>Insertar</button>
    </div>
    <div class="grp">
      <button class="btn" id="prevPage" aria-label="Página anterior">‹</button>
      <span class="pager" id="pager">1 / 1</span>
      <button class="btn" id="nextPage" aria-label="Página siguiente">›</button>
      <button class="btn" id="addPage" title="Añadir página" aria-label="Añadir página"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="grp">
      <a class="btn" id="mcfAcc" href="https://cfartaesmario-a11y.github.io/mcf/" title="MCF Workspace" style="text-decoration:none;color:inherit">MCF</a>
      <button class="btn ghost" id="saveIn">Guardar en…</button>
      <button class="btn primary" id="finish">Terminar</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="cPaper"></canvas>

function encStroke(s){const p=s.pts,o=[];let px=0,py=0,pp=0;
  for(let i=0;i<p.length;i+=3){const x=Math.round(p[i]*2),y=Math.round(p[i+1]*2),q=Math.round(p[i+2]*15);
    o.push((x-px).toString(36),(y-py).toString(36),(q-pp).toString(36));px=x;py=y;pp=q}
  return{t:s.t,c:s.c,w:s.w,d:o.join(',')}}
function decStroke(e){const a=e.d?e.d.split(','):[],p=[];let x=0,y=0,q=0;
  for(let i=0;i+2<a.length;i+=3){x+=parseInt(a[i],36);y+=parseInt(a[i+1],36);q+=parseInt(a[i+2],36);p.push(x/2,y/2,q/15)}
  return{t:e.t,c:e.c,w:e.w,pts:p}}
const encPage=pg=>JSON.stringify({s:pg.strokes.map(encStroke),sh:pg.shapes});
function decPage(str){if(!str)return blankPage();try{const o=JSON.parse(str);return{strokes:(o.s||[]).map(decStroke),shapes:o.sh||[]}}catch(e){return blankPage()}}

class CloudStore{
  constructor(db,id){this.kind='cloud';this.root=db.doc('data/users/'+id+'/binder');this.notes=this.root.collection('notes')}
  async getBinder(){const s=await this.root.get();return s.exists?s.data():null}
  async setBinder(b){await this.root.set(b)}
  async listNotes(){const q=await this.notes.orderBy('updated','desc').limit(1000).get();return q.docs.map(d=>Object.assign({id:d.id},d.data()))}
  async loadNote(id){const ref=this.notes.doc(id);const m=await ref.get();if(!m.exists)throw new Error('missing');
    const meta=m.data();const cs=await ref.collection('chunks').limit(1000).get();const map={};cs.docs.forEach(d=>{map[d.id]=(d.data()||{}).d||''});
    const pages=[];for(let i=0;i<meta.pages;i++){let s='';for(let j=0;j<((meta.chunks||[])[i]||0);j++)s+=map['p'+i+'_'+j]||'';pages.push(s)}
    return{meta,pages}}
  async saveNote(n,strs){const ref=this.notes.doc(n.id),cc=ref.collection('chunks');const old=n.chunks||[];const ch=old.slice(0,n.pages.length);while(ch.length<n.pages.length)ch.push(0);
    for(const k of Object.keys(strs)){const i=+k;const parts=split(strs[k]);
      for(let j=0;j<parts.length;j++)await cc.doc('p'+i+'_'+j).set({d:parts[j]});
      for(let j=parts.length;j<(old[i]||0);j++)await cc.doc('p'+i+'_'+j).delete();ch[i]=parts.length}
    for(let i=n.pages.length;i<old.length;i++)for(let j=0;j<(old[i]||0);j++)await cc.doc('p'+i+'_'+j).delete();
    n.chunks=ch;await ref.set(metaOf(n))}
  async deleteNote(id,meta){const ref=this.notes.doc(id),ch=(meta&&meta.chunks)||[];
    for(let i=0;i<ch.length;i++)for(let j=0;j<ch[i];j++)await ref.collection('chunks').doc('p'+i+'_'+j).delete();await ref.delete()}
}
class McfStore{
  constructor(db,uid){this.kind='cloud';this.r=db.ref('mcf/'+uid)}
  k(s){return this.r.child(s)}
  async getBinder(){const v=(await this.k('cp_binder').get()).val();return v?JSON.parse(v):null}
  async setBinder(b){await this.k('cp_binder').set(JSON.stringify(b))}
  async listNotes(){const s=await this.r.orderByKey().startAt('cp_m_').endAt('cp_m_\uf8ff').get();const out=[];
    s.forEach(c=>{try{out.push(Object.assign({id:c.key.slice(5)},JSON.parse(c.val())))}catch(e){}});return out.sort((a,b)=>b.updated-a.updated)}
  async loadNote(id){const m=(await this.k('cp_m_'+id).get()).val();if(!m)throw new Error('missing');const meta=JSON.parse(m);const pages=[];
    for(let i=0;i<meta.pages;i++){const n=(meta.chunks||[])[i]||0;const parts=await Promise.all([...Array(n)].map((_,j)=>this.k('cp_p_'+id+'_'+i+'_'+j).get().then(x=>x.val()||'')));pages.push(parts.join(''))}
    return{meta,pages}}
  async saveNote(n,strs){const up={},old=n.chunks||[],ch=old.slice(0,n.pages.length);while(ch.length<n.pages.length)ch.push(0);
    for(const k of Object.keys(strs)){const i=+k,parts=split(strs[k]);parts.forEach((p,j)=>up['cp_p_'+n.id+'_'+i+'_'+j]=p);for(let j=parts.length;j<(old[i]||0);j++)up['cp_p_'+n.id+'_'+i+'_'+j]=null;ch[i]=parts.length}
    for(let i=n.pages.length;i<old.length;i++)for(let j=0;j<(old[i]||0);j++)up['cp_p_'+n.id+'_'+i+'_'+j]=null;
    n.chunks=ch;up['cp_m_'+n.id]=JSON.stringify(metaOf(n));await this.r.update(up)}
  async deleteNote(id,meta){const up={['cp_m_'+id]:null},ch=(meta&&meta.chunks)||[];ch.forEach((c,i)=>{for(let j=0;j<c;j++)up['cp_p_'+id+'_'+i+'_'+j]=null});await this.r.update(up)}
}
class LocalStore{
  static open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('carpesano',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(new LocalStore(r.result));r.onerror=()=>rej(r.error)})}
  constructor(db){this.kind='local';this.db=db}
  tx(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction('kv',mode),s=t.objectStore('kv');const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error)})}
  get(k){return this.tx('readonly',s=>s.get(k))}
  put(k,v){return this.tx('readwrite',s=>{s.put(v,k)})}
  del(k){return this.tx('readwrite',s=>{s.delete(k)})}
  async getBinder(){return (await this.get('binder'))||null}
  async setBinder(b){await this.put('binder',b)}
  listNotes(){return new Promise((res,rej)=>{const t=this.db.transaction('kv','readonly'),s=t.objectStore('kv');const out=[];
    const rq=s.openCursor(IDBKeyRange.bound('meta:','meta:￿'));rq.onsuccess=()=>{const c=rq.result;if(c){out.push(Object.assign({id:c.key.slice(5)},c.value));c.continue()}else res(out.sort((a,b)=>b.updated-a.updated))};rq.onerror=()=>rej(rq.error)})}
  async loadNote(id){const meta=await this.get('meta:'+id);if(!meta)throw new Error('missing');const pages=[];for(let i=0;i<meta.pages;i++)pages.push((await this.get('page:'+id+':'+i))||'');return{meta,pages}}
  async saveNote(n,strs){for(const k of Object.keys(strs))await this.put('page:'+n.id+':'+k,strs[k]);
    const old=(n.chunks||[]).length;for(let i=n.pages.length;i<old;i++)await this.del('page:'+n.id+':'+i);
    n.chunks=n.pages.map(()=>1);await this.put('meta:'+n.id,metaOf(n))}
  async deleteNote(id,meta){const c=(meta&&meta.pages)||0;for(let i=0;i<c;i++)await this.del('page:'+id+':'+i);await this.del('meta:'+id)}
}
class MemStore{constructor(){this.kind='memory';this.m=new Map();this.b=null}

  async deleteNote(id){this.m.delete(id)}}

let store=null,binder=null,notesIndex=[];
let readyResolve;const storeReady=new Promise(r=>readyResolve=r);
let chain=Promise.resolve();
const enqueue=fn=>{const p=chain.catch(()=>{}).then(fn);chain=p;return p};
const defaultBinder=()=>({label:'Mis apuntes',sections:[{id:'general',name:'General',color:SEC_COLORS[4]}]});

async function initStore(){
  let st=null;
  try{
    if(window.firebase&&firebase.initializeApp){
      if(!firebase.apps.length)firebase.initializeApp(MCF_FB);
      const u=await Promise.race([new Promise(r=>{const off=firebase.auth().onAuthStateChanged(x=>{off();r(x)})}),new Promise(r=>setTimeout(()=>r(null),6000))]);
      if(u&&!u.isAnonymous){MCFUSER=u;st=new McfStore(firebase.database(),u.uid)}
    }
  }catch(e){st=null}
  let local=null;
  try{local=await LocalStore.open()}catch(e){local=null}
  if(!st)st=local||new MemStore();
  store=st;
  try{binder=(await store.getBinder())||defaultBinder()}catch(e){binder=defaultBinder()}
  if(!binder.sections||!binder.sections.length)binder.sections=defaultBinder().sections;
  try{notesIndex=await store.listNotes()}catch(e){notesIndex=[]}
  // apuntes que se guardaron en este navegador antes de conectar con la cuenta: se suben al carpesano
  if(store.kind==='cloud'&&local){
    try{const lb=await local.getBinder();const ln=await local.listNotes();
      if(ln.length){
        if(lb)for(const s of lb.sections||[])if(!binder.sections.some(x=>x.id===s.id))binder.sections.push(s);
        await store.setBinder(binder);
        for(const m of ln){if(notesIndex.some(x=>x.id===m.id))continue;const {meta,pages}=await local.loadNote(m.id);
          const n={id:m.id,...meta,pages:pages.map(()=>blankPage()),chunks:[]};const strs={};pages.forEach((s,i)=>strs[i]=s);
          await store.saveNote(n,strs);notesIndex.push(Object.assign({id:m.id},metaOf(n)));await local.deleteNote(m.id,meta)}
        notesIndex.sort((a,b)=>b.updated-a.updated);toast('Tus apuntes de este navegador ya están en el carpesano')}
    }catch(e){console.warn(e)}
  }
  readyResolve();
  updateStoreChip();updateAcc();
  const last=ls.get('carpesano.last');
  if(!hasContent(note)&&!note.saved&&last&&notesIndex.some(n=>n.id===last))openNote(last,true);
  if(note.saved)updateSaveButtons();
}

// tf = [escala, desplazamiento x, desplazamiento y] en píxeles reales del lienzo
function renderPaper(ctx,tf,n,thumb){
  const C=lineColor(n.color),k=tf[0];
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.setTransform(k,0,0,k,tf[1],tf[2]);
  ctx.fillStyle=PAPER_BG;ctx.fillRect(0,0,W,H);
  if(!thumb){ctx.save();ctx.globalAlpha=.045;ctx.globalCompositeOperation='multiply';
    const pat=ctx.createPattern(fiber,'repeat');try{pat.setTransform(new DOMMatrix().scale(Math.max(.2,Math.min(4,1.4/k))))}catch(e){}
    ctx.fillStyle=pat;ctx.fillRect(0,0,W,H);ctx.restore()}
  const lw=1.1/k*Math.min(2.5,Math.max(1,k/1.4));
  const vline=(x,col,w)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()};
  const hline=(y,col,w)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()};
  const grid=(step,col,w,every,strong)=>{for(let i=1;i*step<W;i++)vline(i*step,every&&i%every===0?strong:col,w);for(let i=1;i*step<H;i++)hline(i*step,every&&i%every===0?strong:col,w)};
  switch(n.paper){
    case 'sq5':grid(5*U,C.line,lw);break;
    case 'sq4':grid(4*U,C.line,lw);break;
    case 'mm':grid(U,C.line.replace(/[\d.]+\)$/,m=>(parseFloat(m)*.5)+')'),lw*.7);grid(5*U,C.line,lw);grid(10*U,C.strong,lw*1.3);break;
    case 'lines':for(let y=30*U;y<H-8*U;y+=8*U)hline(y,C.strong,lw);break;
    case 'dots':ctx.fillStyle=C.strong;for(let x=5*U;x<W;x+=5*U)for(let y=5*U;y<H;y+=5*U){ctx.beginPath();ctx.arc(x,y,Math.max(lw*1.3,1.4/k),0,7);ctx.fill()}break;
  }

  if(cur.t==='p'){applyT(cx.live);penStyle(cx.live,cur);penSegment(cx.live,cur,P.length/3-1)}else if(!liveRaf){liveRaf=requestAnimationFrame(()=>{liveRaf=0;drawLiveHl()})}}
let liveRaf=0;
function drawLiveHl(){if(!cur)return;clearLive();applyT(cx.live);cx.live.globalCompositeOperation='source-over';drawHl(cx.live,cur)}
function clearLive(){cx.live.setTransform(1,0,0,1,0,0);cx.live.clearRect(0,0,cv.live.width,cv.live.height)}
function endStroke(){const s=cur;cur=null;if(!s)return;
  pushHistory();page().strokes=page().strokes.concat([s]);
  if(s.t==='p'){applyT(cx.ink);drawPen(cx.ink,s)}else{applyT(cx.hl);cx.hl.globalCompositeOperation='multiply';drawHl(cx.hl,s);cx.hl.globalCompositeOperation='source-over'}
  if(liveRaf){cancelAnimationFrame(liveRaf);liveRaf=0}clearLive();markDirty()}

/* ---- goma ---- */
const bbox=s=>{if(s._b)return s._b;let a=1e9,b=1e9,c=-1e9,d=-1e9;const P=s.pts;for(let i=0;i<P.length;i+=3){a=Math.min(a,P[i]);b=Math.min(b,P[i+1]);c=Math.max(c,P[i]);d=Math.max(d,P[i+1])}
  const m=s.t==='h'?s.w*.6:s.w;return s._b=[a-m,b-m,c+m,d+m]};
function startErase(x,y,id,touch){act={type:'erase',id,touch,before:{pi:pageIdx,s:page().strokes,sh:page().shapes},lx:x,ly:y,changed:false};cv.live.className='';eraseAt(x,y);drawEraserCursor(x,y)}
function eraseTo(x,y){const r=prefs.eraserR,d=Math.hypot(x-act.lx,y-act.ly),n=Math.max(1,Math.ceil(d/(r*.5)));
  for(let i=1;i<=n;i++)eraseAt(act.lx+(x-act.lx)*i/n,act.ly+(y-act.ly)*i/n);act.lx=x;act.ly=y;drawEraserCursor(x,y)}
function eraseAt(x,y){const r=prefs.eraserR,S=page().strokes,out=[];let changed=false;
  for(const s of S){const b=bbox(s);if(x<b[0]-r||x>b[2]+r||y<b[1]-r||y>b[3]+r){out.push(s);continue}
    const rr=(r+(s.t==='h'?s.w*.35:s.w*.5))**2,P=s.pts;
    if(prefs.eraser==='stroke'){let hit=false;for(let i=0;i<P.length;i+=3)if((P[i]-x)**2+(P[i+1]-y)**2<rr){hit=true;break}if(hit)changed=true;else out.push(s);continue}
    let run=[],pieces=[],hit=false;
    for(let i=0;i<P.length;i+=3){if((P[i]-x)**2+(P[i+1]-y)**2<rr){hit=true;if(run.length)pieces.push(run);run=[]}else run.push(P[i],P[i+1],P[i+2])}
    if(!hit){out.push(s);continue}changed=true;if(run.length)pieces.push(run);
    for(const pc of pieces)if(pc.length>=6||(s.pts.length===3))out.push({t:s.t,c:s.c,w:s.w,pts:pc})}
  if(changed){page().strokes=out;act.changed=true;scheduleRender()}}
function drawEraserCursor(x,y){clearLive();const g=cx.live;applyT(g);g.lineWidth=2/T()[0]*(window.devicePixelRatio||1);g.strokeStyle='rgba(30,30,35,.6)';g.beginPath();g.arc(x,y,prefs.eraserR,0,7);g.stroke()}
function endErase(){clearLive();if(act.changed){undoStack.push(act.before);redoStack=[];updUndo();markDirty()}}

/* ---- mover plantillas ---- */
let selId=null;
const selShape=()=>page().shapes.find(s=>s.id===selId);
function startMove(x,y,id,touch){const s=selShape();let mode=null,target=s;
  if(s&&Math.hypot(x-(s.x+s.w),y-(s.y+s.h))<30)mode='resize';
  else{target=null;const sh=page().shapes;for(let i=sh.length-1;i>=0;i--){const q=sh[i];if(x>=q.x-10&&x<=q.x+q.w+10&&y>=q.y-10&&y<=q.y+q.h+10){target=q;break}}if(target)mode='drag'}
  selId=target?target.id:null;updateSel();if(!target){act=null;return}
  act={type:'move',id,touch,mode,orig:Object.assign({},target),sx:x,sy:y,before:{pi:pageIdx,s:page().strokes,sh:page().shapes},changed:false}}
function dragMove(x,y){const o=act.orig,dx=x-act.sx,dy=y-act.sy;let n;
  if(act.mode==='drag')n=Object.assign({},o,{x:Math.round(o.x+dx),y:Math.round(o.y+dy)});else n=Object.assign({},o,{w:Math.max(60,Math.round(o.w+dx)),h:Math.max(40,Math.round(o.h+dy))});
  page().shapes=page().shapes.map(s=>s.id===o.id?n:s);act.changed=true;scheduleRender()}
function endMove(){if(act.changed){undoStack.push(act.before);redoStack=[];updUndo();markDirty()}}
function updateSel(){const el=$('#sel'),s=prefs.tool==='move'&&typeof selShape==='function'?selShape():null;if(!s){el.hidden=true;return}el.hidden=false;
  Object.assign(el.style,{left:(s.x/W*100)+'%',top:(s.y/H*100)+'%',width:(s.w/W*100)+'%',height:(s.h/H*100)+'%'});
  }
$('#selBar').addEventListener('pointerdown',e=>e.stopPropagation());
$('#selBar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const s=selShape();if(!s)return;pushHistory();const a=b.dataset.act;
  if(a==='del'){page().shapes=page().shapes.filter(q=>q.id!==s.id);selId=null}
  else if(a==='dup'){const n=Object.assign({},s,{id:uid(),x:s.x+30,y:s.y+30,seed:(Math.random()*1e9)|0});page().shapes=page().shapes.concat([n]);selId=n.id}
  else if(a==='color'){const c=PENS[lastPenIdx()];page().shapes=page().shapes.map(q=>q.id===s.id?Object.assign({},q,{c:c.custom?prefs.customPen:c.c}):q)}
  renderLayers();updateSel();markDirty()});

/* ================= historial ================= */
let undoStack=[],redoStack=[];
function pushHistory(){undoStack.push({pi:pageIdx,s:page().strokes,sh:page().shapes});if(undoStack.length>300)undoStack.shift();redoStack=[];updUndo()}
function restore(from,to){const h=from.pop();if(!h)return;if(h.pi>=note.pages.length)return;if(h.pi!==pageIdx)goPage(h.pi);
  to.push({pi:pageIdx,s:page().strokes,sh:page().shapes});page().strokes=h.s;page().shapes=h.sh;if(selId&&!selShape())selId=null;renderLayers();updateSel();markDirty();updUndo()}
const undo=()=>restore(undoStack,redoStack),redo=()=>restore(redoStack,undoStack);
function updUndo(){$('#undo').disabled=!undoStack.length;$('#redo').disabled=!redoStack.length}
$('#undo').onclick=undo;$('#redo').onclick=redo;
document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}});

/* ================= páginas ================= */
function goPage(i){pageIdx=Math.max(0,Math.min(note.pages.length-1,i));selId=null;updateSel();renderLayers();updPager()}
function updPager(){$('#pager').textContent=(pageIdx+1)+' / '+note.pages.length;$('#prevPage').disabled=pageIdx===0;$('#nextPage').disabled=pageIdx>=note.pages.length-1}
$('#prevPage').onclick=()=>goPage(pageIdx-1);$('#nextPage').onclick=()=>goPage(pageIdx+1);
$('#addPage').onclick=()=>{note.pages.splice(pageIdx+1,0,blankPage());for(let i=pageIdx+1;i<note.pages.length;i++)dirty.add(i);undoStack=[];redoStack=[];updUndo();goPage(pageIdx+1);markDirty(pageIdx);toast('Página '+(pageIdx+1)+' añadida')};

/* ================= guardado ================= */
const dirty=new Set();let saveT=0,draftT=0;
function markDirty(pi=pageIdx){note.updated=Date.now();dirty.add(pi);if(note.saved){setStatus('pending');clearTimeout(saveT);saveT=setTimeout(saveNow,1400)}else{setStatus('draft');clearTimeout(draftT);draftT=setTimeout(saveDraft,1500)}}
function markMeta(){note.updated=Date.now();if(note.saved){dirty.add(-1);setStatus('pending');clearTimeout(saveT);saveT=setTimeout(saveNow,900)}else{clearTimeout(draftT);draftT=setTimeout(saveDraft,800)}}
function saveDraft(){if(note.saved)return;const d={meta:Object.assign({id:note.id},metaOf(note)),pages:note.pages.map(encPage)};ls.set('carpesano.draft',JSON.stringify(d))}
async function saveNow(){clearTimeout(saveT);if(!note.saved)return;const n=note;const pis=[...dirty];dirty.clear();
  const strs={};for(const i of pis)if(i>=0&&i<n.pages.length)strs[i]=encPage(n.pages[i]);
  if(pis.includes(0)||!n.thumb)n.thumb=makeThumb();
  setStatus('saving');
  try{await enqueue(async()=>{await storeReady;await store.saveNote(n,strs)});upsertIndex(n);if(note===n&&!dirty.size)setStatus('saved')}
  catch(e){console.error(e);for(const i of pis)dirty.add(i);if(note===n)setStatus('error')}}
function upsertIndex(n){const m=Object.assign({id:n.id},metaOf(n));const i=notesIndex.findIndex(x=>x.id===n.id);if(i>=0)notesIndex[i]=m;else notesIndex.unshift(m);notesIndex.sort((a,b)=>b.updated-a.updated)}
const flush=async()=>{if(note.saved&&dirty.size)await saveNow();await chain.catch(()=>{})};
function setStatus(s){const el=$('#status');el.className='status '+(s==='saved'?'saved':s==='saving'||s==='pending'?'saving':s==='error'?'error':'');
  const sec=sectionOf(note.sectionId);
  el.querySelector('span').textContent=s==='saved'?'Guardado en '+(sec?sec.name:'el carpesano'):s==='saving'||s==='pending'?'Guardando en '+(sec?sec.name:'el carpesano')+'…':s==='error'?'No se pudo guardar. Toca para reintentar':'Borrador: aún no está en el carpesano';
  el.onclick=s==='error'?()=>{dirty.add(pageIdx);saveNow()}:null;el.style.cursor=s==='error'?'pointer':''}
const sectionOf=id=>binder&&binder.sections.find(s=>s.id===id);
function updateSaveButtons(){const sec=sectionOf(note.sectionId);$('#saveIn').textContent=note.saved&&sec?'En: '+sec.name:'Guardar en…';$('#noteTitle').textContent=note.title}
window.addEventListener('pagehide',()=>{if(note.saved&&dirty.size)saveNow();else saveDraft()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(note.saved&&dirty.size)saveNow();else if(!note.saved)saveDraft()}});

/* ---- abrir / nueva ---- */
function loadInto(n){note=n;pageIdx=0;undoStack=[];redoStack=[];dirty.clear();selId=null;updUndo();updPager();updateSaveButtons();renderAll();updateSel();setStatus(n.saved?'saved':'draft')}
async function openNote(id,quiet){await flush();await storeReady;
  try{const {meta,pages}=await store.loadNote(id);loadInto({id,title:meta.title,sectionId:meta.sectionId,paper:meta.paper||'sq5',color:meta.color||'sky',margin:meta.margin!==false,
      pages:pages.length?pages.map(decPage):[blankPage()],created:meta.created,updated:meta.updated,saved:true,chunks:meta.chunks||[],thumb:meta.thumb||null});
    ls.set('carpesano.last',id);ls.del('carpesano.draft');if(!quiet)closeBinder()}
  catch(e){console.error(e);if(!quiet)toast('No se pudo abrir esa hoja. Prueba otra vez.')}}
async function newSheet(sectionId){await flush();
  if(!note.saved&&hasContent(note)){const ok=await ask('Esta hoja no está en el carpesano','Si empiezas una hoja nueva, la actual se pierde. Guárdala antes con «Guardar en…».',[['Cancelar',false],['Descartar y empezar',true,'danger']]);if(!ok)return false}
  const n=newNote();n.paper=note.paper;n.color=note.color;n.margin=note.margin;if(sectionId){n.sectionId=sectionId}
  loadInto(n);ls.del('carpesano.draft');ls.del('carpesano.last');return true}

function buildTray(){const t=$('#tray');let h='<div class="tray-sec"><span class="lbl">Bolis</span>';

    else if(b.dataset.c){if(prefs.tool==='pen')prefs.customPen=b.dataset.c;else prefs.customHl=b.dataset.c;buildTray()}
    savePrefs();updTray();openToolPop(document.querySelector(`.tool[data-tool="${prefs.tool}"][data-i="${prefs.ti}"]`))};
  const pk=$('#pickPen')||$('#pickHl');if(pk)pk.oninput=e=>{if(prefs.tool==='pen')prefs.customPen=e.target.value;else prefs.customHl=e.target.value;savePrefs();buildTray()}}

/* ================= panel de hoja ================= */
function paperPreview(type,color){const c=document.createElement('canvas');c.width=144;c.height=192;renderPaper(c.getContext('2d'),[144/W,0,0],{paper:type,color,margin:note.margin},false);return c}
function openPaperPop(){const p=$('#paperPop');
  p.innerHTML=`<h3>Hoja</h3><h4>Tipo de hoja</h4><div class="opts" id="ptype"></div><h4>Color de las líneas</h4><div class="opts" id="pcolor"></div><h4>Fondo</h4><div class="seg" id="bgSeg"><button data-bg="graphite">Grafito</button><button data-bg="black">Negro</button><button data-bg="light">Gris claro</button></div>
  <h4>Opciones</h4>
  <div class="row"><span>Línea de margen</span><label class="switch"><input type="checkbox" id="optMargin" ${note.margin?'checked':''}><span></span></label></div>
  <div class="row"><span>Dibujar también con el dedo</span><label class="switch"><input type="checkbox" id="optFinger" ${prefs.finger||!prefs.penSeen?'checked':''}><span></span></label></div>
  <div class="row" style="padding-top:12px"><button class="btn ghost danger" id="delPage" ${note.pages.length<2?'disabled':''}>Eliminar esta página</button></div>`;
  const pt=$('#ptype');PAPERS.forEach(([k,n])=>{const b=document.createElement('button');b.className='paper-opt'+(note.paper===k?' on':'');b.append(paperPreview(k,note.color),n);b.onclick=()=>{note.paper=k;renderAll();markMeta();openPaperPop()};pt.append(b)});
  const pc=$('#pcolor');Object.entries(LINE_COLORS).forEach(([k,v])=>{const b=document.createElement('button');b.className='color-opt'+(lineColor(note.color)===v?' on':'');b.innerHTML=`<span style="background:${v.sw}"></span>${v.name}`;b.onclick=()=>{note.color=k;renderAll();markMeta();openPaperPop()};pc.append(b)});
  $('#bgSeg').querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b.dataset.bg===prefs.bg);b.onclick=()=>{prefs.bg=b.dataset.bg;savePrefs();applyBg();openPaperPop()}});
  $('#optMargin').onchange=e=>{note.margin=e.target.checked;renderAll();markMeta()};
  $('#optFinger').onchange=e=>{prefs.finger=e.target.checked;if(!e.target.checked)prefs.penSeen=true;savePrefs()};
  $('#delPage').onclick=async()=>{closePops();const ok=await ask('¿Eliminar la página '+(pageIdx+1)+'?','Se borra todo lo escrito en ella.',[['Cancelar',false],['Eliminar página',true,'danger']]);if(!ok)return;
    note.pages.splice(pageIdx,1);for(let i=pageIdx;i<note.pages.length;i++)dirty.add(i);undoStack=[];redoStack=[];updUndo();goPage(Math.min(pageIdx,note.pages.length-1));markMeta()};
  showPop(p,$('#paperBtn'))}
$('#paperBtn').onclick=e=>{e.stopPropagation();if(!$('#paperPop').hidden)return closePops();closePops();openPaperPop()};

/* ================= panel insertar ================= */
const INS=[['table','Tabla','<rect x="6" y="6" width="52" height="32"/><path d="M6 14h52M24 6v32M41 6v32M6 22h52M6 30h52"/>'],
  ['grid','Cuadrícula','<rect x="8" y="5" width="48" height="34"/><path d="M14 5v34M20 5v34M26 5v34M32 5v34M38 5v34M44 5v34M50 5v34M8 11h48M8 17h48M8 23h48M8 29h48M8 35h48" opacity=".45"/>'],
  ['llave','Cuadro sinóptico','<path d="M14 4q-4 0-4 3v11q0 4-4 4 4 0 4 4v11q0 3 4 3"/><path d="M18 9h12M18 22h12M18 35h12M36 5q-2 0-2 2v2q0 2-2 2 2 0 2 2v2q0 2 2 2M40 7h18M40 15h18" />'],
  ['mind','Mapa mental','<ellipse cx="32" cy="22" rx="11" ry="6"/><rect x="2" y="2" width="14" height="8" rx="3"/><rect x="48" y="2" width="14" height="8" rx="3"/><rect x="2" y="34" width="14" height="8" rx="3"/><rect x="48" y="34" width="14" height="8" rx="3"/><path d="M22 19 15 10M42 19l7-9M22 25l-7 9M42 25l7 9"/>'],
  ['flow','Diagrama de flujo','<rect x="20" y="2" width="24" height="8" rx="4"/><path d="M32 15l10 7-10 7-10-7z"/><rect x="20" y="34" width="24" height="8" rx="2"/><path d="M32 10v5M32 29v5"/>'],
  ['timeline','Línea de tiempo','<path d="M4 22h54M54 18l4 4-4 4"/><circle cx="12" cy="22" r="2"/><circle cx="24" cy="22" r="2"/><circle cx="36" cy="22" r="2"/><circle cx="48" cy="22" r="2"/><path d="M12 20V10M24 24v10M36 20V10M48 24v10"/>'],
  ['axes','Ejes x, y','<path d="M10 40V4M6 8l4-4 4 4M6 36h52M54 32l4 4-4 4M20 34v4M30 34v4M40 34v4M8 26h4M8 16h4"/>'],
  ['venn','Diagrama de Venn','<circle cx="24" cy="22" r="15"/><circle cx="40" cy="22" r="15"/>'],
  ['cornell','Método Cornell','<rect x="14" y="2" width="36" height="40"/><path d="M14 7h36M26 7v27M14 34h36"/>'],
  ['box','Recuadro','<rect x="8" y="8" width="48" height="28" rx="1"/>'],
  ['arrow','Flecha','<path d="M6 22h50M48 15l8 7-8 7"/>']];
let insR=4,insC=3;
function openInsertPop(){const p=$('#insertPop');
  p.innerHTML=`<h3>Insertar en la hoja</h3><div class="ins-grid">${INS.map(([k,n,svg])=>`<button class="ins" data-k="${k}"><svg viewBox="0 0 64 44" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${svg}</svg>${n}</button>`).join('')}</div>`;
  p.onclick=e=>{const b=e.target.closest('button');if(!b||!b.dataset.k)return;if(b.dataset.k==='table'){openTablePop();return}insertShape(b.dataset.k);closePops()};
  showPop(p,$('#insertBtn'))}
// paso 2 de la tabla: filas, columnas y un dibujo de cómo quedará
function openTablePop(){const p=$('#insertPop');
  p.innerHTML=`<button class="back" data-back>‹ Insertar</button><h3>Tabla</h3><canvas class="tbl-prev" id="tblPrev" width="600" height="340"></canvas>
  <div class="row"><span>Filas</span><div class="stepper"><button data-s="r-" aria-label="Menos filas">−</button><output id="oR">${insR}</output><button data-s="r+" aria-label="Más filas">+</button></div></div>
  <div class="row"><span>Columnas</span><div class="stepper"><button data-s="c-" aria-label="Menos columnas">−</button><output id="oC">${insC}</output><button data-s="c+" aria-label="Más columnas">+</button></div></div>
  <div class="acts" style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn primary" data-add>Añadir tabla</button></div>`;
  p.style.width='min(340px,calc(100vw - 32px))';drawTablePreview();
  p.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.back!==undefined){p.style.width='';openInsertPop();return}
    if(b.dataset.add!==undefined){p.style.width='';insertShape('table');closePops();return}
    if(b.dataset.s){const w=b.dataset.s[0],d=b.dataset.s[1]==='+'?1:-1;if(w==='r')insR=Math.max(1,Math.min(20,insR+d));else insC=Math.max(1,Math.min(10,insC+d));$('#oR').textContent=insR;$('#oC').textContent=insC;drawTablePreview()}};
  showPop(p,$('#insertBtn'))}
function drawTablePreview(){const c=$('#tblPrev');if(!c)return;const g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);g.fillStyle=PAPER_BG;g.fillRect(0,0,c.width,c.height);
  const w=Math.max(200,insC*190),h=Math.max(80,insR*75),k=Math.min((c.width-60)/w,(c.height-50)/h),ox=(c.width-w*k)/2,oy=(c.height-h*k)/2;
  g.strokeStyle=lineColor(note.color).line;g.lineWidth=1;const st=5*U*k;for(let x=ox%st;x<c.width;x+=st){g.beginPath();g.moveTo(x,0);g.lineTo(x,c.height);g.stroke()}for(let y=oy%st;y<c.height;y+=st){g.beginPath();g.moveTo(0,y);g.lineTo(c.width,y);g.stroke()}
  g.setTransform(k,0,0,k,ox,oy);const pi=lastPenIdx();drawShape(g,{k:'table',x:0,y:0,w,h,r:insR,cols:insC,c:PENS[pi].custom?prefs.customPen:PENS[pi].c,seed:7})}
$('#insertBtn').onclick=e=>{e.stopPropagation();if(!$('#insertPop').hidden)return closePops();closePops();openInsertPop()};
const SIZES={table:[600,300],grid:[500,300],mind:[760,500],llave:[720,440],flow:[380,620],timeline:[820,220],axes:[460,460],venn:[560,360],box:[420,240],arrow:[320,60]};
function insertShape(k){const r=stage.getBoundingClientRect(),pr=paper.getBoundingClientRect();
  const cxp=((r.left+r.width/2)-pr.left)/pr.width*W,cyp=((r.top+r.height/2)-pr.top)/pr.height*H;let s;
  if(k==='cornell')s={x:30*U,y:12*U,w:W-38*U,h:H-24*U};else{let [w,h]=SIZES[k];if(k==='table'){h=Math.max(80,insR*75);w=Math.max(200,insC*190)}
    s={x:Math.round(Math.max(30*U,Math.min(W-w-20,cxp-w/2))),y:Math.round(Math.max(20,Math.min(H-h-20,cyp-h/2))),w,h}}
  const pi=lastPenIdx();Object.assign(s,{id:uid(),k,c:PENS[pi].custom?prefs.customPen:PENS[pi].c,seed:(Math.random()*1e9)|0});if(k==='table'){s.r=insR;s.cols=insC}
  pushHistory();page().shapes=page().shapes.concat([s]);prefs.tool='move';prefs.ti=0;savePrefs();updTray();selId=s.id;renderLayers();updateSel();markDirty()}

/* ================= popovers ================= */
function showPop(p,anchor){p.hidden=false;const r=anchor.getBoundingClientRect(),pr=p.getBoundingClientRect();
  p.style.left=Math.max(16,Math.min(window.innerWidth-pr.width-16,r.right-pr.width))+'px';p.style.top=(r.bottom+8)+'px'}
function closePops(){['#paperPop','#insertPop','#toolPop','#menuPop'].forEach(s=>$(s).hidden=true)}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.pop')&&!e.target.closest('#paperBtn,#insertBtn,.tool,.more,.dots'))closePops()});

/* ================= diálogos ================= */
function ask(title,text,buttons){return new Promise(res=>{$('#askTitle').textContent=title;$('#askText').textContent=text;const a=$('#askActs');a.innerHTML='';
  buttons.forEach(([l,v,cls])=>{const b=document.createElement('button');b.className='btn '+(cls==='danger'?'primary':'ghost');if(cls==='danger')b.style.background='var(--danger)';b.textContent=l;b.onclick=()=>{$('#askDlg').hidden=true;res(v)};a.append(b)});
  $('#askDlg').hidden=false})}
let toastT=0;function toast(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.append(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}

/* ---- guardar en… ---- */
let pickSec=null;
function openSaveDlg(){pickSec=note.sectionId||(binder?binder.sections[0].id:'general');$('#saveTitle').value=note.title;renderSecPick();$('#saveDlg').hidden=false;$('#newSecName').value='';
  $('#saveOk').textContent=note.saved?'Mover aquí':'Guardar aquí'}
function renderSecPick(){const w=$('#secPick');w.innerHTML='';const secs=binder?binder.sections:defaultBinder().sections;
  secs.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='sec-chip'+(s.id===pickSec?' on':'');b.innerHTML=`<i style="background:${s.color}"></i>`;b.append(s.name);b.onclick=()=>{pickSec=s.id;renderSecPick()};w.append(b)})}
function addSection(name){if(!binder)binder=defaultBinder();const s={id:uid(),name:name.slice(0,40),color:SEC_COLORS[binder.sections.length%SEC_COLORS.length]};binder.sections.push(s);return s}
$('#newSecAdd').onclick=()=>{const v=$('#newSecName').value.trim();if(!v)return $('#newSecName').focus();const s=addSection(v);pickSec=s.id;$('#newSecName').value='';renderSecPick();saveBinder()};
$('#newSecName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#newSecAdd').click()}});
$('#saveCancel').onclick=()=>$('#saveDlg').hidden=true;
$('#saveForm').onsubmit=async e=>{e.preventDefault();const t=$('#saveTitle').value.trim();if(t)note.title=t.slice(0,80);note.sectionId=pickSec;
  const first=!note.saved;note.saved=true;$('#saveDlg').hidden=true;updateSaveButtons();
  if(first){note.pages.forEach((_,i)=>dirty.add(i));ls.del('carpesano.draft');flyToBinder()}dirty.add(-1);ls.set('carpesano.last',note.id);
  saveBinder();await saveNow();if(note.saved&&!dirty.size)toast((first?'Guardado en ':'Movido a ')+(sectionOf(note.sectionId)||{name:'el carpesano'}).name+'. Se guardará solo.')};
async function saveBinder(){const b=JSON.parse(JSON.stringify(binder||defaultBinder()));try{await enqueue(async()=>{await storeReady;await store.setBinder(b)})}catch(e){console.error(e);toast('No se pudo guardar el separador. Prueba otra vez.')}}
$('#saveIn').onclick=()=>openSaveDlg();
$('#finish').onclick=async()=>{if(!note.saved){openSaveDlg();return}await flush();openBinder(note.sectionId)};
function flyToBinder(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const a=paper.getBoundingClientRect(),b=$('#openBinder').getBoundingClientRect();
  const f=document.createElement('div');f.className='flyer';f.style.cssText+=`left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;background:${PAPER_BG} url(${makeThumb()}) center/cover`;document.body.append(f);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2),s=28/a.width;
  f.animate([{transform:'none',opacity:1},{transform:`translate(${dx*.5}px,${dy*.4}px) scale(.45) rotate(-6deg)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${s}) rotate(-12deg)`,opacity:.2}],{duration:700,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>f.remove()}

/* ---- título ---- */
$('#noteTitle').onclick=()=>{const b=$('#noteTitle'),i=document.createElement('input');i.className='title-input';i.value=note.title;i.id='titleInput';b.replaceWith(i);i.focus();i.select();
  const done=()=>{const v=i.value.trim();if(v&&v!==note.title){note.title=v.slice(0,80);markMeta()}i.replaceWith(b);updateSaveButtons()};
  i.onblur=done;i.onkeydown=e=>{if(e.key==='Enter')i.blur();if(e.key==='Escape'){i.value=note.title;i.blur()}}};

/* ================= carpesano ================= */
let bSec='all';
async function openBinder(sec){closePops();if(note.saved&&dirty.size)saveNow();bSec=sec||bSec;$('#binder').hidden=false;renderBinder();await storeReady;renderBinder()}
function closeBinder(){$('#binder').hidden=true}
$('#openBinder').onclick=()=>openBinder();$('#bClose').onclick=closeBinder;
$('#bNew').onclick=async()=>{if(await newSheet(bSec!=='all'?bSec:null))closeBinder()};
const esc=t=>String(t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function askName(title,value){return new Promise(res=>{$('#nameTitle').textContent=title;const i=$('#nameInput');i.value=value||'';$('#nameDlg').hidden=false;setTimeout(()=>i.focus(),50);
  $('#nameForm').onsubmit=e=>{e.preventDefault();$('#nameDlg').hidden=true;res(i.value.trim()||null)};$('#nameCancel').onclick=()=>{$('#nameDlg').hidden=true;res(null)}})}
function renderBinder(){const secs=binder?binder.sections:defaultBinder().sections;
  if(bSec!=='all'&&!secs.some(s=>s.id===bSec))bSec='all';
  const count=id=>notesIndex.filter(n=>id==='all'||n.sectionId===id).length;
  const tabs=$('#bTabs');tabs.innerHTML='';
  const mk=(id,name,color)=>{const b=document.createElement('button');b.className='b-tab'+(bSec===id?' on':'');b.style.setProperty('--c',color);
    b.innerHTML=`<span>${esc(name)}</span><span class="n">${count(id)}</span>`+(id!=='all'?'<span class="dots" aria-label="Opciones del separador">⋯</span>':'');
    b.onclick=e=>{if(e.target.closest('.dots')){secMenu(id,e.target.closest('.dots'));return}bSec=id;renderBinder()};tabs.append(b)};
  mk('all','Todo','#5b5b62');secs.forEach(s=>mk(s.id,s.name,s.color));
  const add=document.createElement('button');add.className='b-tab add';add.textContent='+';add.title='Nuevo separador';add.setAttribute('aria-label','Nuevo separador');
  add.onclick=async()=>{const v=await askName('Nuevo separador','');if(!v)return;const s=addSection(v);bSec=s.id;saveBinder();renderBinder()};tabs.append(add);
  const sec=secs.find(s=>s.id===bSec);$('#bPage').style.setProperty('--c',sec?sec.color:'#5b5b62');
  const list=notesIndex.filter(n=>bSec==='all'||n.sectionId===bSec);
  const g=$('#sheets');g.innerHTML='';
  if(!store){g.innerHTML='<div class="empty"><strong>Abriendo…</strong></div>';return}
  if(!list.length){g.innerHTML='<div class="empty"><strong>Vacío</strong>Pulsa «+ Hoja nueva» para empezar.</div>';return}
  for(const n of list){const c=document.createElement('div');c.className='sheet'+(n.id===note.id?' current':'');c.setAttribute('role','button');c.tabIndex=0;
    c.innerHTML=`<div class="thumb">${n.thumb?`<img alt="" src="${n.thumb}">`:''}</div><b></b><button class="more" aria-label="Opciones">⋯</button>`;
    c.querySelector('b').textContent=n.title||'Sin título';
    c.onclick=e=>{if(e.target.closest('.more'))return;if(n.id===note.id){closeBinder();return}openNote(n.id)};
    c.onkeydown=e=>{if(e.key==='Enter')c.click()};
    c.querySelector('.more').onclick=e=>{e.stopPropagation();sheetMenu(n,e.currentTarget)};g.append(c)}}
function placeMenu(p,anchor){p.hidden=false;const r=anchor.getBoundingClientRect(),pr=p.getBoundingClientRect();p.style.left=Math.max(16,Math.min(window.innerWidth-pr.width-16,r.right-pr.width))+'px';p.style.top=Math.min(window.innerHeight-pr.height-16,r.bottom+6)+'px'}
async function moveNote(n,to){if(n.id===note.id){note.sectionId=to;markMeta();updateSaveButtons();upsertIndex(note);return}
  await enqueue(async()=>{const {meta,pages}=await store.loadNote(n.id);const tmp={id:n.id,...meta,sectionId:to,pages:pages.map(()=>blankPage())};await store.saveNote(tmp,{});upsertIndex(tmp)})}
function sheetMenu(n,anchor){const p=$('#menuPop');const secs=binder.sections.filter(s=>s.id!==n.sectionId);
  p.innerHTML=secs.map(s=>`<button data-m="${s.id}">Mover a ${esc(s.name)}</button>`).join('')+'<button data-a="del" class="danger">Eliminar</button>';
  p.onclick=async e=>{const b=e.target.closest('button');if(!b)return;p.hidden=true;
    if(b.dataset.m){try{await moveNote(n,b.dataset.m);toast('Movida a '+sectionOf(b.dataset.m).name)}catch(err){toast('No se pudo mover.')}renderBinder()}
    else if(b.dataset.a==='del'){const ok=await ask('¿Eliminar «'+(n.title||'Sin título')+'»?','No se puede deshacer.',[['Cancelar',false],['Eliminar',true,'danger']]);if(!ok)return;
      try{await enqueue(()=>store.deleteNote(n.id,n));notesIndex=notesIndex.filter(x=>x.id!==n.id);if(n.id===note.id){note.saved=false;loadInto(newNote())}renderBinder()}catch(err){toast('No se pudo eliminar.')}}};
  placeMenu(p,anchor)}
function secMenu(id,anchor){const p=$('#menuPop');p.innerHTML='<button data-a="ren">Cambiar nombre</button><button data-a="del" class="danger">Eliminar separador</button>';
  p.onclick=async e=>{const b=e.target.closest('button');if(!b)return;p.hidden=true;const s=sectionOf(id);if(!s)return;
    if(b.dataset.a==='ren'){const v=await askName('Cambiar nombre',s.name);if(!v)return;s.name=v.slice(0,40);saveBinder();updateSaveButtons();if(note.saved)setStatus(dirty.size?'pending':'saved');renderBinder()}
    else{if(binder.sections.length===1){toast('Tiene que quedar al menos un separador');return}
      const inSec=notesIndex.filter(n=>n.sectionId===s.id),target=binder.sections.find(x=>x.id!==s.id);
      const ok=await ask('¿Eliminar «'+s.name+'»?',inSec.length?`Sus hojas pasan a «${target.name}».`:'Está vacío.',[['Cancelar',false],['Eliminar',true,'danger']]);if(!ok)return;
      try{for(const n of inSec)await moveNote(n,target.id)}catch(err){toast('Algunas hojas no se pudieron mover.')}
      binder.sections=binder.sections.filter(x=>x.id!==s.id);bSec='all';saveBinder();updateSaveButtons();renderBinder()}};
  placeMenu(p,anchor)}

/* ================= arranque ================= */
function applyBg(){const v=prefs.bg==='black'||prefs.bg==='light'?prefs.bg:null;if(v)document.documentElement.dataset.bg=v;else delete document.documentElement.dataset.bg}
(function boot(){
  try{const d=JSON.parse(ls.get('carpesano.draft')||'null');if(d&&d.meta){const m=d.meta;note={id:m.id,title:m.title,sectionId:null,paper:m.paper,color:m.color,margin:m.margin,pages:(d.pages||[]).map(decPage),created:m.created,updated:m.updated,saved:false,chunks:[],thumb:null};if(!note.pages.length)note.pages=[blankPage()]}}catch(e){}
  if(!prefs.hint)$('#hint').hidden=true;else setTimeout(hideHint,9000);
  if(!['pen','hl','eraser','move'].includes(prefs.tool)){prefs.tool='pen';prefs.ti=0}
  applyBg();buildTray();updPager();updUndo();updateSaveButtons();setStatus('draft');layout();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>renderLayers());
  initStore();
})();
})();
</script>
